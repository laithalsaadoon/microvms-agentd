# SPDX-License-Identifier: Apache-2.0
# Accepted findings for Cargo.lock, each with its reason (same rule as .config/trivyignore.yaml: an
# ignore without a reason is a finding someone silenced).
#
# osv-scanner cannot consume VEX documents, so this file exists as a mirror:
# every vulnerability ignored here MUST also carry a statement in
# .vex/microvms-agentd.openvex.json, which is the canonical record grype and
# trivy consume. See .vex/README.md.
#
# osv-scanner applies a config file to the lockfiles in its own directory, so each lockfile's
# acceptances sit beside it: this file for Cargo.lock, crates/agentd/fuzz/osv-scanner.toml for the
# fuzz workspace's own Cargo.lock, site/osv-scanner.toml for the docs site's pnpm-lock.yaml.
# OpenSSF Scorecard's Vulnerabilities check reads them the same way.
#
# Add an [[IgnoredVulns]] entry with an `id` and a `reason` only together with its VEX statement.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0542"
reason = "An informational advisory that marks humantime unmaintained and names no defect. humantime 2.4.0 is in Cargo.lock only through cucumber 0.23.0, a test-only dependency, so no shipped build links it; see the not_affected statement in .vex/microvms-agentd.openvex.json."
