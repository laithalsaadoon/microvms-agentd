# SPDX-License-Identifier: Apache-2.0
# Accepted findings, each with its reason (same rule as .config/trivyignore.yaml: an
# ignore without a reason is a finding someone silenced).
#
# osv-scanner cannot consume VEX documents, so this file exists as a mirror:
# every vulnerability ignored here MUST also carry a statement in
# .vex/microvms-agentd.openvex.json, which is the canonical record grype and
# trivy consume. See .vex/README.md.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0235"
# rkyv 0.7 appears in Cargo.lock only as an OPTIONAL dependency of rust_decimal
# whose feature this workspace never enables — `cargo tree -i rkyv` prints
# "nothing to print" because no crate actually depends on it and it is never
# compiled. The lockfile records optional deps regardless; the advisory's code
# cannot be reached from any built artifact. Re-check if rust_decimal's
# `rkyv` feature is ever turned on.
reason = "optional rust_decimal feature, never enabled; not compiled into any artifact"

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
# braces 3.0.3 (no fixed release on 2026-10-02) is docs-site build tooling only: micromatch,
# from starlight-llms-txt, expands the include/exclude/promote/demote patterns that
# site/astro.config.ts sets. An attacker can't supply a pattern; the VEX statement says more.
reason = "docs-site build tool; its glob patterns come only from site/astro.config.ts"

[[IgnoredVulns]]
id = "GHSA-ch52-4w7c-c8xp"
# http-cache-semantics 4.2.0 (no fixed release on 2026-10-02) is used by astro's build-time
# remote-image cache. The site is static, with no server and no shared cache answering users,
# which the advisory needs; the VEX statement says more.
reason = "astro build-time image cache only; the site is static and runs no shared cache"

[[IgnoredVulns]]
id = "GHSA-rj75-hqrm-r3gf"
# postcss-selector-parser 6.1.4 (fixed only in 7.1.6, which postcss-nested 6.2.0's ^6.1.1 can't
# reach) is docs-site build tooling only: @expressive-code/core runs postcss-nested over the CSS its
# plugins and site/astro.config.ts's styleOverrides emit. The VEX statement says more.
reason = "docs-site build tool; it parses only CSS committed here or shipped in pinned packages"
