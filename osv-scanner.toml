# SPDX-License-Identifier: Apache-2.0
# Accepted findings for Cargo.lock, each with its reason (same rule as .config/trivyignore.yaml: an
# ignore without a reason is a finding someone silenced).
#
# osv-scanner cannot consume VEX documents, so this file exists as a mirror:
# every vulnerability ignored here MUST also carry a statement in
# .vex/microvms-agentd.openvex.json, which is the canonical record grype and
# trivy consume. See .vex/README.md.
#
# osv-scanner applies a config file to the lockfiles in its own directory, so each lockfile's
# acceptances sit beside it: this file for Cargo.lock, site/osv-scanner.toml for the docs site's
# pnpm-lock.yaml. OpenSSF Scorecard's Vulnerabilities check reads them the same way.
#
# None today: rkyv, the one Cargo.lock acceptance (RUSTSEC-2026-0235), left the lockfile in the
# 2026-09-04 dependency rollup (#127), and osv-scanner reported the ignore as unused.
