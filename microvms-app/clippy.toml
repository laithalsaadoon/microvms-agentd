# ARCH-7: the use cases do no I/O of their own. Each thing they need from outside the process
# comes through a port this crate declares, and `microvms-edges` implements it. The crate root
# forbids both lints, so a hit fails the build and an inner `#[allow]` or `#[expect]` is itself
# an error: there's no exception list, because a use case that needs one of these needs a port.
#
# Clippy takes fully qualified paths and no wildcards, so each item is named. Crates that do I/O
# (reqwest, the AWS crates, getrandom, tokio-tungstenite) never get this far: the dependency set
# in `arch/placement.toml` keeps them out, and `microvms-cli/tests/dependency_direction.rs`
# asserts it and each dependency's declared features. This file covers what `std` can do without
# a dependency, and tokio's `net`, `fs`, `process`, `io-std` and `signal` items, which this crate
# doesn't enable but can still name once another member turns them on through feature
# unification (the CLI and agentd turn on all five).
#
# `std::time::SystemTime` stays usable as a data type (`Microvm::started_at` and
# `Minted::expires_at` are values, not clock reads), so only its `now` and `elapsed` are banned:
# `UNIX_EPOCH.elapsed()` is a wall-clock read too. tokio's
# `Instant` stays too: a deadline measured on it is virtual under a simulator, which is the
# property the clock port exists for.
#
# `allow-invalid = true` marks a path that doesn't exist in every build: a tokio feature this
# crate doesn't enable, or a Unix-only std item on the Windows leg. Without it clippy warns that
# the path doesn't refer to a reachable item.
#
# `scripts/test_ratchet.py`'s `AppLintTests` pins this list and runs real clippy over a call from
# each group, so a deleted line fails there.

