# The command surface for this repo. `mise run check` is the definition of done.
#
# Two tiers, split by cost rather than by kind:
#
#   mise run check   local gates; downloads tools/rules/providers. No AWS mutations.
#   mise run live    the suites that talk to real AWS. Billable, ~15 min.
#
# `live` is never wired to a hook or to push. It creates real MicroVMs in the
# caller's account, and a gate that spends money on every push is a gate people
# disable. It is a deliberate command and a manual CI dispatch.

[tools]
# `rust = "stable"` makes mise provide the toolchain via rustup, which then honors
# `rust-toolchain.toml` — and that file is the only place that can declare the
# cross-compile *targets*. Pinning an exact version here instead (we tried 1.97)
# gives a compiler with no `aarch64-unknown-linux-musl`, so the build fails with
# "can't find crate for `std`" and a suggestion naming a toolchain the reader did
# not know they were using. Removing the entry entirely is worse: cargo then
# leaves mise's PATH and every task fails with "command not found".
rust = "stable"
# Every other tool is an exact version, and mise.lock records what each one resolved to (#315).
# They were `latest`, which meant a contributor's ruff or semgrep was whatever that machine had
# last installed while CI fetched a newer one, and a finding could appear on one side only.
# `./tools/check-ci-parity.py` (`ci:parity`, in `check` and in CI's `security` job) fails
# when ci.yml runs a different version of ruff, semgrep, Node's major, actionlint, or any of
# the checksummed downloads below. Bumping one of those means this line and ci.yml together,
# plus the sha256 beside a checksummed download.
#
# betterleaks, syft, grype and osv-scanner take the version ci.yml already installs by
# checksum, since that's the one CI has proven; the rest took what `latest` resolved to here
# on 2026-09-27.
uv = "0.12.13"
ruff = "0.15.22"
semgrep = "1.176.1"
betterleaks = "1.7.3"
syft = "1.50.0"
grype = "0.116.1"
trivy = "0.74.0"
osv-scanner = "2.5.0"
terraform = "1.15.8"
tflint = "0.63.1"
lefthook = "2.1.10"
# 22 rather than 24: it's the major CI's bindings job runs and the floor of microvms-js's
# `engines` (`>=22.13.0`), so the suite contributors run is the one CI proves (D26). The parity
# check compares majors; mise.lock holds the exact release.
node = "22"
"cargo:cargo-deny" = "0.20.2"
"aqua:rhysd/actionlint" = "1.7.12"
# `ratchet:check`'s Rust collectors. A tree-sitter grammar update can change what a rule
# matches, and the ratchet's sentinel fails on any change in what it finds. CI installs the same
# release by checksum (ci.yml's `security` job, a required check).
"aqua:ast-grep/ast-grep" = "0.43.0"
# `semver:check`'s. CI installs the same release by checksum (ci.yml's `semver` job).
"github:obi1kenobi/cargo-semver-checks" = "0.50.0"

[settings]
# The cargo backend builds its tools from source (`cargo install --locked`) rather than through
# cargo-binstall. binstall fetches cargo-mutants' release binary, which needs glibc 2.39, and on
# an older host (AL2023 has 2.34) that binary can't start, so `mutants` and `guards:fire` fail
# before they test anything. cargo-deny is the other cargo tool: a first install builds it too,
# once, in a few minutes. CI doesn't install through mise (D14).
cargo.binstall = false

[env]
# The shipping target. MicroVMs are ARM64-only, and a static binary is what lets
# the daemon bake into any task image without depending on an interpreter or libc
# that image may not have. Linker choice lives in .cargo/config.toml.
AGENTD_TARGET = "aarch64-unknown-linux-musl"

# Every key of ci.yml's top-level `env`, with the same value, so a local run sees what CI's
# does (`ci:parity` holds the two together). CI colors cargo's output, and a test that parses
# cargo or clippy output without `--color never` read an empty set there and nowhere else:
# PR #314's first CI run failed `AdapterLintTests` that way.
CARGO_TERM_COLOR = "always"

[vars]
# The gates' unit suites run under pytest with pytest-xdist, which spreads a suite's tests over
# every core: `test_check_guards_fire.py` took 46 s serial and 11 s this way, measured
# 2026-09-30 at 7780e97 on a shared 16-vCPU devbox. The suites are `unittest` classes, which
# pytest runs as they are, and CI still runs them with `python -m unittest`. Besides the two
# runners, each suite gets the packages its ci.yml step installs and no others, so it can't pass
# here on one CI lacks. Pinned exactly, for the reason `[tools]` gives. `-p no:cacheprovider` in
# each call because pytest's cache is nothing the suites read, and `check` runs them at once.
pytest = "uv run --with 'pytest==9.1.1' --with 'pytest-xdist==3.8.0'"

[task_config]
# The tasks live in `.config/mise/tasks/`, a file per area: `check.toml` holds `check`,
# `live.toml` the live tier, `docs.toml` the site. mise reads an included task the way it
# reads one written here, so its `dir`, its `sources` and `{{config_root}}` resolve from this
# directory. mise reads a glob that matches no file, and a task two files define (the last
# one wins), without a word, so the gates that read the tasks go through tools/mise_config.py,
# which refuses both.
includes = [".config/mise/tasks/*.toml"]
