# The command surface for this repo. `mise run check` is the definition of done.
#
# Two tiers, split by cost rather than by kind:
#
#   mise run check   local gates; downloads tools/rules/providers. No AWS mutations.
#   mise run live    the suites that talk to real AWS. Billable, ~15 min.
#
# `live` is never wired to a hook or to push. It creates real MicroVMs in the
# caller's account, and a gate that spends money on every push is a gate people
# disable. It is a deliberate command and a manual CI dispatch.
#
# CI runs these tasks too: each job of ci.yml and fuzz.yml installs mise and this file's tools
# from mise.lock, then runs one `ci:<job>` task (below), so a check CI runs is a task a
# contributor runs, under the same tools and `[env]`.

# The oldest mise that reads this file the way CI's does: CI pins this version (the `version`
# input of `.github/actions/mise/action.yml`), and the `ci:<job>` tasks call other tasks from
# `run`, which older releases don't parse.
min_version = "2026.8.1"

[tools]
# `rust` is the release `rust-toolchain.toml` pins, with that file's components and targets
# repeated. mise selects the toolchain by setting `RUSTUP_TOOLCHAIN`, which rustup puts ahead of
# `rust-toolchain.toml`, so under mise the file's lists reach rustup only through this entry.
# Without them (tried with 1.97, and with 1.99.0 on mise 2026.8.1) the toolchain has no
# `aarch64-unknown-linux-musl`, and the build fails with "can't find crate for `std`".
# `ci:parity` holds the version to the file's channel. Removing the entry entirely is worse:
# cargo then leaves mise's PATH and every task fails with "command not found".
rust = { version = "1.99.0", components = ["clippy", "rustfmt"], targets = ["aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"] }
# Every other tool is an exact version, and mise.lock records what each one resolved to (#315),
# with each platform's checksum. They were `latest`, which meant a contributor's ruff or semgrep
# was whatever that machine had last installed while CI fetched a newer one, and a finding could
# appear on one side only. CI installs from mise.lock with `--locked`, so a bump is this line
# and `mise lock`, and both sides move together. `ci:parity` fails on a `latest` here or in a
# task's own `tools`.
#
# betterleaks, syft, grype and osv-scanner took the version CI then installed by checksum,
# since that was the one CI had proven; the rest took what `latest` resolved to here on
# 2026-09-27.
uv = "0.12.13"
ruff = "0.15.22"
semgrep = "1.176.1"
betterleaks = "1.7.3"
syft = "1.50.0"
grype = "0.116.1"
trivy = "0.74.0"
osv-scanner = "2.5.0"
terraform = "1.15.8"
tflint = "0.63.1"
lefthook = "2.1.10"
# 22 rather than 24: it's the floor of microvms-js's `engines` (`>=22.13.0`), so the suite
# contributors and CI run is the oldest one a consumer may have (D26). mise.lock holds the exact
# release.
node = "22"
# The release's static musl binary, by checksum, rather than a `cargo install` build: every CI job
# installs all of `[tools]`, and building cargo-deny from source took minutes of each job whose
# tools cache missed.
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:rhysd/actionlint" = "1.7.12"
# `ratchet:check`'s Rust collectors. A tree-sitter grammar update can change what a rule
# matches, and the ratchet's sentinel fails on any change in what it finds.
"aqua:ast-grep/ast-grep" = "0.43.0"
# `vex:check`'s reader of the OpenVEX document.
jq = "1.8.1"
# `semver:check`'s, the release binary by the checksum mise.lock records. In `[tools]` rather than
# a task's own because the guards job fires the protocol crate's semver faults with it.
"github:obi1kenobi/cargo-semver-checks" = "0.50.0"

[settings]
# The cargo backend builds its tools from source (`cargo install --locked`) rather than through
# cargo-binstall. binstall fetches cargo-mutants' release binary, which needs glibc 2.39, and on
# an older host (AL2023 has 2.34) that binary can't start, so `mutants` and `guards:fire` fail
# before they test anything. The cargo tools are the tasks' own (`[vars]` below pins them), and
# CI's tools cache holds their builds (`ci:tools`).
cargo.binstall = false

[env]
# The shipping target. MicroVMs are ARM64-only, and a static binary is what lets
# the daemon bake into any task image without depending on an interpreter or libc
# that image may not have. Linker choice lives in .cargo/config.toml.
AGENTD_TARGET = "aarch64-unknown-linux-musl"

# CI colors cargo's output, so every run here does too: a test that parses cargo or clippy
# output without `--color never` read an empty set in CI and nowhere else, which is how PR
# #314's first CI run failed `AdapterLintTests`. CI runs its tasks under this table, so the two
# can't differ.
CARGO_TERM_COLOR = "always"

[vars]
# The tasks' own tools, which `mise install` leaves out and mise.lock doesn't record. Their
# versions live here, in the file CI's tools cache is keyed on (with mise.lock), so a bump
# moves the key and the cache CI restores is rebuilt with it (`ci:tools`).
cargo_mutants = "27.1.0"
cargo_bolero = "0.13.4"
cargo_fuzz = "0.13.2"
lychee = "0.24.2"

[task_config]
# The tasks live in `.config/mise/tasks/`, a file per area: `check.toml` holds `check`,
# `live.toml` the live tier, `docs.toml` the site. mise reads an included task the way it
# reads one written here, so its `dir`, its `sources` and `{{config_root}}` resolve from this
# directory. mise reads a glob that matches no file, and a task two files define (the last
# one wins), without a word, so the gates that read the tasks go through tools/mise_config.py,
# which refuses both.
includes = [".config/mise/tasks/*.toml"]
