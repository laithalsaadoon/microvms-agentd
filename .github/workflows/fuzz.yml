name: fuzz

# Runs the cargo-fuzz target in `crates/agentd/fuzz` and the bolero harnesses in the CLI, core, the
# edges, the app and the daemon, each for a bounded slice of time. Two minutes or less per
# target is not a fuzzing campaign. It is a regression harness: the targets stay buildable,
# the doorway feature stays wired, and an input class the engine newly mishandles has a chance
# to surface before a release does. A real campaign runs longer and locally
# (`cargo +nightly fuzz run tar_extract` from `crates/agentd/`, or `cargo +nightly bolero test` with a
# harness and its crate).
#
# Two jobs, split by crate, where there was one per harness: each pull request run held eight
# of the account's concurrent job slots. Most of a job is the sanitizer build of a crate's test
# targets, which the harnesses in one crate share, so each job installs its tools once, builds
# each of its crates once, and then fuzzes. libFuzzer runs a harness on one thread, and a runner
# has four vCPUs, so the harnesses fuzz side by side, each for its own time budget, after the builds
# rather than beside them. The CLI's and core's builds are the two largest, so they share a job,
# and the daemon's, the edges' and the app's harnesses make up the other. Measured at c11b144
# (run 36658243595): 13.9 and 13.6 minutes, 27.5 job-minutes against the eight jobs' 61 in run
# 36602136663, and with four fuzzers sharing a runner's four vCPUs each harness ran 0.4 to 1.1
# times the inputs it ran alone there.
#
# The PR trigger is path-scoped to the engine and the targets, because a fuzz
# build compiles the whole graph with sanitizers and that cost buys nothing on
# a docs change.
on:
  schedule:
    - cron: '30 11 * * 1' # Mondays, after codeql.yml's 10:30 slot
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/agentd/fuzz/**'
      - 'crates/agentd/src/fs.rs'
      - 'crates/microvms-cli/src/envelope.rs'
      - 'crates/microvms-cli/src/closed_output*.rs'
      # The fetch and its parsers moved to the edges and the use cases to the app in #283.
      - 'crates/microvms-edges/src/provision*.rs'
      # `elf_machine`, which `provision_fuzz::elf` drives, lives in the domain since #282.
      - 'crates/microvms-domain/src/provision.rs'
      - 'crates/microvms-app/src/control/artifact.rs'
      - 'crates/microvms-core/tests/wrap_fuzz.rs'
      - 'crates/microvms-app/src/control/context.rs'
      - 'crates/microvms-edges/src/control/context.rs'
      - 'crates/microvms-core/tests/context_fuzz.rs'
      - 'crates/agentd/src/exec_start*.rs'
      - 'crates/protocol/src/exec.rs'
      - 'crates/microvms-app/src/control/connector.rs'
      - 'crates/microvms-app/src/control/posture_fuzz.rs'
      # The client's event-stream parser, which reads bytes a guest can write (#297), and the
      # module file whose `mod sse_fuzz;` compiles its harness: without that line the harness
      # never builds, and this job fails with `no targets matched`.
      - 'crates/microvms-app/src/session/sse.rs'
      - 'crates/microvms-app/src/session/sse_fuzz.rs'
      - 'crates/microvms-app/src/session/mod.rs'
      - '.github/workflows/fuzz.yml'
      # The tasks that hold the jobs' steps, the file that pins their tools, and the action
      # that installs mise.
      - '.config/mise/tasks/ci.toml'
      - 'mise.toml'
      - '.github/actions/mise/**'

permissions:
  contents: read

# Cargo resolves features for the packages one command selects, so `cargo bolero test -p
# microvms-cli` and `-p microvms-core` turn on different features of shared dependencies
# (serde's `default`, hyper's `server`, tokio's), and a changed feature rebuilds every crate
# above it: at 7780e97, core's fuzz build had 118 units the CLI's didn't, the AWS SDK, sigstore,
# reqwest, tokio and serde crates among them, and 32 once features are resolved for the whole
# workspace, which nightly's `-Zfeature-unification` does here. Features are additive, so each
# harness still fuzzes its own crate's code, against dependencies built with every feature some
# member of the workspace turns on; stable `cargo test` runs each harness per crate on every
# pull request. The two `ci:fuzz-*` tasks set both keys in their own `env`; the stable cargo that
# builds their tools ignores them with a warning.
#
# Each job has ci.yml's shape: its checkout, the toolchain and cache, `.github/actions/mise`,
# and one `mise run ci:fuzz-<job>`, whose task holds the builds and the side-by-side fuzzing.
# cargo-bolero and cargo-fuzz are those tasks' own tools, pinned in mise.toml's `[vars]` and
# built into the tools cache the `guards-cache` job saves on main.

jobs:
  # The CLI's closed-output harness (CLI-7, CLI-8, CLI-9; #216), in-crate since the CLI has no
  # lib target; core's task-Dockerfile wrap (IMAGE-1..IMAGE-4; #220); and core's build context,
  # context hash and artifact key (IMAGE-6..IMAGE-8; #221), whose ignore-rule harness checks the
  # matcher against moby's own regex translation of each pattern. Stable `cargo test` runs each
  # with random inputs on every PR; this job runs the same tests under libFuzzer.
  cli-core:
    name: fuzz (CLI and core harnesses, bounded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Nightly, because libFuzzer instrumentation rides on `-Z` sanitizer
      # flags that stable refuses. Only this workflow uses nightly; the
      # shipping graph never does.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      # Saved on main only (the scheduled run), as in ci.yml: pull requests' copies of every
      # job's cache pushed the repo's caches past their cap, which evicts main's.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/mise
      - run: mise run ci:fuzz-cli-core
      # A crash writes a reproducer into the harness's `__fuzz__/`; surface it rather than
      # letting it die with the runner.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: cli-core-fuzz-crashes
          path: |
            crates/microvms-cli/src/__fuzz__/
            crates/microvms-core/tests/__fuzz__/
          if-no-files-found: ignore

  # The cargo-fuzz target `tar_extract`; the daemon's exec-start harness (AGENTD-7..16; #224,
  # #225, #226): start bodies whose union fields take every JSON spelling, resolved against a
  # fuzzed guest; the version, SHA256SUMS, digest-record and ELF parsers daemon provisioning
  # rests on (BIND-17..BIND-20), thirty seconds each; the app's egress-posture harness
  # (BIND-11..13; #227): the request-side answer against the launch over arbitrary options; and
  # its event-stream harness (BIND-22; #297): `SseParser::feed` and `decode` over hostile bytes,
  # floods past the pending-bytes ceiling included.
  daemon-edges-app:
    name: fuzz (daemon, edges and app harnesses, bounded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Nightly: see the `cli-core` job.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      # See the `cli-core` job. `crates/agentd/fuzz` is a workspace of its own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            crates/agentd/fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/mise
      - run: mise run ci:fuzz-daemon-edges-app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: daemon-edges-app-fuzz-crashes
          path: |
            crates/agentd/fuzz/artifacts/
            crates/agentd/src/__fuzz__/
            crates/microvms-edges/src/__fuzz__/
            crates/microvms-app/src/control/__fuzz__/
            crates/microvms-app/src/session/__fuzz__/
          if-no-files-found: ignore
