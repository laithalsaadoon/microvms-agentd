name: fuzz

# Runs the cargo-fuzz target in `agentd/fuzz` and the bolero harnesses in the CLI, core, the
# edges, the app and the daemon, each for a bounded slice of time. Two minutes or less per
# target is not a fuzzing campaign. It is a regression harness: the targets stay buildable,
# the doorway feature stays wired, and an input class the engine newly mishandles has a chance
# to surface before a release does. A real campaign runs longer and locally
# (`cargo +nightly fuzz run tar_extract` from `agentd/`, or `cargo +nightly bolero test` with a
# harness and its crate).
#
# Two jobs, split by crate, where there was one per harness: each pull request run held eight
# of the account's concurrent job slots. Most of a job is the sanitizer build of a crate's test
# targets, which the harnesses in one crate share, so each job installs its tools once, builds
# each of its crates once, and then fuzzes. libFuzzer runs a harness on one core, and a runner
# has four, so the harnesses fuzz side by side, each for its own time budget, after the builds
# rather than beside them. The CLI's and core's builds are the two largest, so they share a job,
# and the daemon's, the edges' and the app's harnesses make up the other.
#
# The PR trigger is path-scoped to the engine and the targets, because a fuzz
# build compiles the whole graph with sanitizers and that cost buys nothing on
# a docs change.
on:
  schedule:
    - cron: '30 11 * * 1' # Mondays, after codeql.yml's 10:30 slot
  workflow_dispatch:
  pull_request:
    paths:
      - 'agentd/fuzz/**'
      - 'agentd/src/fs.rs'
      - 'microvms-cli/src/envelope.rs'
      - 'microvms-cli/src/closed_output*.rs'
      # The fetch and its parsers moved to the edges and the use cases to the app in #283.
      - 'microvms-edges/src/provision*.rs'
      # `elf_machine`, which `provision_fuzz::elf` drives, lives in the domain since #282.
      - 'microvms-domain/src/provision.rs'
      - 'microvms-app/src/control/artifact.rs'
      - 'microvms-core/tests/wrap_fuzz.rs'
      - 'microvms-app/src/control/context.rs'
      - 'microvms-edges/src/control/context.rs'
      - 'microvms-core/tests/context_fuzz.rs'
      - 'agentd/src/exec_start*.rs'
      - 'protocol/src/exec.rs'
      - 'microvms-app/src/control/connector.rs'
      - 'microvms-app/src/control/posture_fuzz.rs'
      # The client's event-stream parser, which reads bytes a guest can write (#297), and the
      # module file whose `mod sse_fuzz;` compiles its harness: without that line the harness
      # never builds, and this job fails with `no targets matched`.
      - 'microvms-app/src/session/sse.rs'
      - 'microvms-app/src/session/sse_fuzz.rs'
      - 'microvms-app/src/session/mod.rs'
      - '.github/workflows/fuzz.yml'

permissions:
  contents: read

# Cargo resolves features for the packages one command selects, so `cargo bolero test -p
# microvms-cli` and `-p microvms-core` turn on different features of shared dependencies
# (serde's `default`, hyper's `server`, tokio's), and a changed feature rebuilds every crate
# above it: at 7780e97, core's fuzz build had 118 units the CLI's didn't, the AWS SDK, sigstore,
# reqwest, tokio and serde crates among them, and 32 once features are resolved for the whole
# workspace, which nightly's `-Zfeature-unification` does here. Features are additive, so each
# harness still fuzzes its own crate's code, against dependencies built with every feature some
# member of the workspace turns on; stable `cargo test` runs each harness per crate on every
# pull request. The `cargo install` steps run stable cargo (`rust-toolchain.toml`), which
# ignores both keys with a warning.
env:
  CARGO_UNSTABLE_FEATURE_UNIFICATION: "true"
  CARGO_RESOLVER_FEATURE_UNIFICATION: workspace

jobs:
  # The CLI's closed-output harness (CLI-7, CLI-8, CLI-9; #216), in-crate since the CLI has no
  # lib target; core's task-Dockerfile wrap (IMAGE-1..IMAGE-4; #220); and core's build context,
  # context hash and artifact key (IMAGE-6..IMAGE-8; #221), whose ignore-rule harness checks the
  # matcher against moby's own regex translation of each pattern. Stable `cargo test` runs each
  # with random inputs on every PR; this job runs the same tests under libFuzzer.
  cli-core:
    name: fuzz (CLI and core harnesses, bounded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Nightly, because libFuzzer instrumentation rides on `-Z` sanitizer
      # flags that stable refuses. Only this workflow uses nightly; the
      # shipping graph never does.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      # Saved on main only (the scheduled run), as in ci.yml: pull requests' copies of every
      # job's cache pushed the repo's caches past their cap, which evicts main's.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install cargo-bolero
        run: cargo install cargo-bolero --version 0.13.4 --locked
      # `+nightly`, because `rust-toolchain.toml` pins stable and libFuzzer needs `-Z`. One
      # harness of each crate, for one input, which builds the crate's fuzz binaries for all of
      # its harnesses before any of them fuzzes.
      - name: build the harnesses
        run: |
          cargo +nightly bolero test closed_output_fuzz::output_plan -p microvms-cli --runs 1
          cargo +nightly bolero test wrap_case -p microvms-core --runs 1
      # One harness a core, each with its output in a log of its own, printed whole once all
      # have ended: a failed harness's outside a collapsed group, after an error naming it.
      - name: fuzz the harnesses side by side
        run: |
          logs=$(mktemp -d) status=0
          declare -a harness=()
          start() { "${@:2}" > "$logs/$1.log" 2>&1 & harness[$!]=$1; }
          finish() {
            for pid in "${!harness[@]}"; do
              name=${harness[$pid]}
              if wait "$pid"; then
                echo "::group::$name passed"; cat "$logs/$name.log"; echo "::endgroup::"
              else
                status=1; echo "::error::$name failed; its output follows"; cat "$logs/$name.log"
              fi
            done
            harness=()
          }
          start closed-output cargo +nightly bolero test closed_output_fuzz::output_plan -p microvms-cli -T 120s
          start wrap cargo +nightly bolero test wrap_case -p microvms-core -T 120s
          start ignore-rules cargo +nightly bolero test ignore_rules_agree_with_mobys_regex_translation -p microvms-core -T 60s
          start context-hash cargo +nightly bolero test the_context_hash_extends_the_legacy_one_and_follows_every_entry -p microvms-core -T 60s
          finish
          exit "$status"
      # A crash writes a reproducer into the harness's `__fuzz__/`; surface it rather than
      # letting it die with the runner.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: cli-core-fuzz-crashes
          path: |
            microvms-cli/src/__fuzz__/
            microvms-core/tests/__fuzz__/
          if-no-files-found: ignore

  # The cargo-fuzz target `tar_extract`; the daemon's exec-start harness (AGENTD-7..16; #224,
  # #225, #226): start bodies whose union fields take every JSON spelling, resolved against a
  # fuzzed guest; the version, SHA256SUMS, digest-record and ELF parsers daemon provisioning
  # rests on (BIND-17..BIND-20), thirty seconds each; the app's egress-posture harness
  # (BIND-11..13; #227): the request-side answer against the launch over arbitrary options; and
  # its event-stream harness (BIND-22; #297): `SseParser::feed` and `decode` over hostile bytes,
  # floods past the pending-bytes ceiling included.
  daemon-edges-app:
    name: fuzz (daemon, edges and app harnesses, bounded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Nightly: see the `cli-core` job.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      # See the `cli-core` job. `agentd/fuzz` is a workspace of its own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            agentd/fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install cargo-fuzz and cargo-bolero
        run: |
          cargo install cargo-fuzz --locked
          cargo install cargo-bolero --version 0.13.4 --locked
      # See the `cli-core` job. `cargo fuzz` runs from the directory that holds `fuzz/`.
      - name: build the harnesses
        run: |
          (cd agentd && cargo +nightly fuzz build tar_extract)
          cargo +nightly bolero test exec_start_fuzz::start_resolution -p agentd --runs 1
          cargo +nightly bolero test provision_fuzz::version -p microvms-edges --runs 1
          cargo +nightly bolero test control::posture_fuzz::posture_matches_the_launch -p microvms-app --runs 1
      # See the `cli-core` job. Four two-minute harnesses, then the four provisioning parsers.
      - name: fuzz the harnesses side by side
        run: |
          logs=$(mktemp -d) status=0
          declare -a harness=()
          start() { "${@:2}" > "$logs/$1.log" 2>&1 & harness[$!]=$1; }
          finish() {
            for pid in "${!harness[@]}"; do
              name=${harness[$pid]}
              if wait "$pid"; then
                echo "::group::$name passed"; cat "$logs/$name.log"; echo "::endgroup::"
              else
                status=1; echo "::error::$name failed; its output follows"; cat "$logs/$name.log"
              fi
            done
            harness=()
          }
          start tar-extract env -C agentd cargo +nightly fuzz run tar_extract -- -max_total_time=120
          start exec-start cargo +nightly bolero test exec_start_fuzz::start_resolution -p agentd -T 120s
          start egress-posture cargo +nightly bolero test control::posture_fuzz::posture_matches_the_launch -p microvms-app -T 120s
          start event-stream cargo +nightly bolero test session::sse_fuzz::hostile_stream_bytes_stay_bounded_and_every_event_round_trips -p microvms-app -T 120s
          finish
          for target in version sums record elf; do
            start "provision-$target" cargo +nightly bolero test "provision_fuzz::$target" -p microvms-edges -T 30s
          done
          finish
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: daemon-edges-app-fuzz-crashes
          path: |
            agentd/fuzz/artifacts/
            agentd/src/__fuzz__/
            microvms-edges/src/__fuzz__/
            microvms-app/src/control/__fuzz__/
            microvms-app/src/session/__fuzz__/
          if-no-files-found: ignore
