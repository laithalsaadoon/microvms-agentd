name: fuzz

# Runs the cargo-fuzz targets in `agentd/fuzz`, the CLI's closed-output bolero harness,
# core's task-Dockerfile wrap and egress-posture harnesses, and the daemon's exec-start
# harness, for a bounded slice of time.
# Two minutes per target on a weekly schedule is not a fuzzing campaign — it is
# a regression harness: the targets stay buildable, the doorway feature stays
# wired, and an input class the engine newly mishandles has a chance to surface
# before a release does. A real campaign runs longer and locally
# (`cargo +nightly fuzz run tar_extract` from `agentd/`).
#
# The PR trigger is path-scoped to the engine and the targets, because a fuzz
# build compiles the whole graph with sanitizers and that cost buys nothing on
# a docs change.
on:
  schedule:
    - cron: '30 11 * * 1' # Mondays, after codeql.yml's 10:30 slot
  workflow_dispatch:
  pull_request:
    paths:
      - 'agentd/fuzz/**'
      - 'agentd/src/fs.rs'
      - 'microvms-cli/src/envelope.rs'
      - 'microvms-cli/src/closed_output*.rs'
      - 'microvms-core/src/provision*.rs'
      - 'microvms-core/src/control/artifact.rs'
      - 'microvms-core/tests/wrap_fuzz.rs'
      - 'microvms-core/src/control/context.rs'
      - 'microvms-core/tests/context_fuzz.rs'
      - 'agentd/src/exec_start*.rs'
      - 'protocol/src/exec.rs'
      - 'microvms-core/src/control/connector.rs'
      - 'microvms-core/src/control/posture_fuzz.rs'
      - '.github/workflows/fuzz.yml'

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (tar_extract, bounded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Nightly, because libFuzzer instrumentation rides on `-Z` sanitizer
      # flags that stable refuses. Only this workflow uses nightly; the
      # shipping graph never does.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: agentd/fuzz
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: fuzz tar_extract for two minutes
        working-directory: agentd
        run: cargo +nightly fuzz run tar_extract -- -max_total_time=120
      # A crash writes a reproducer into artifacts/; surface it rather than
      # letting it die with the runner.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: agentd/fuzz/artifacts/
          if-no-files-found: ignore

  # The CLI's closed-output harness (CLI-7, CLI-8, CLI-9; #216), coverage-guided. The CLI has
  # no lib target, so the harness is an in-crate bolero test: stable `cargo test` runs it on
  # every PR with random inputs, and this job runs the same test under libFuzzer.
  closed-output:
    name: fuzz (closed_output_fuzz::output_plan, bounded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: install cargo-bolero
        run: cargo install cargo-bolero --version 0.13.4 --locked
      # `+nightly`, because `rust-toolchain.toml` pins stable and libFuzzer needs `-Z`.
      - name: fuzz the closed-output harness for two minutes
        run: cargo +nightly bolero test closed_output_fuzz::output_plan -p microvms-cli -T 120s
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: closed-output-fuzz-crashes
          path: microvms-cli/src/__fuzz__/
          if-no-files-found: ignore

  # The task-Dockerfile wrap (IMAGE-1..IMAGE-4; #220), coverage-guided. Stable `cargo test`
  # runs `microvms-core/tests/wrap_fuzz.rs` on every PR with random inputs; this job runs the
  # same test under libFuzzer.
  wrap-dockerfile:
    name: fuzz (wrap_fuzz::wrap_case, bounded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: install cargo-bolero
        run: cargo install cargo-bolero --version 0.13.4 --locked
      # `+nightly`, because `rust-toolchain.toml` pins stable and libFuzzer needs `-Z`.
      - name: fuzz the wrap harness for two minutes
        run: cargo +nightly bolero test wrap_case -p microvms-core -T 120s
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: wrap-dockerfile-fuzz-crashes
          path: microvms-core/tests/__fuzz__/
          if-no-files-found: ignore

  # The daemon's exec-start harness (AGENTD-7..16; #224, #225, #226), coverage-guided: start
  # bodies whose union fields take every JSON spelling, resolved against a fuzzed guest. An
  # in-crate bolero test like the CLI's, so stable `cargo test` runs it on every PR too.
  exec-start:
    name: fuzz (exec_start_fuzz::start_resolution, bounded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: install cargo-bolero
        run: cargo install cargo-bolero --version 0.13.4 --locked
      # `+nightly`, because `rust-toolchain.toml` pins stable and libFuzzer needs `-Z`.
      - name: fuzz the exec-start harness for two minutes
        run: cargo +nightly bolero test exec_start_fuzz::start_resolution -p agentd -T 120s
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: exec-start-fuzz-crashes
          path: agentd/src/__fuzz__/
          if-no-files-found: ignore

  provision:
    name: fuzz (provision_fuzz parsers, bounded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: install cargo-bolero
        run: cargo install cargo-bolero --version 0.13.4 --locked
      # The version, SHA256SUMS, digest-record, and ELF parsers daemon provisioning rests
      # on (BIND-17..BIND-20), thirty seconds each.
      - name: fuzz the provisioning parsers
        run: |
          for target in version sums record elf; do
            cargo +nightly bolero test "provision_fuzz::$target" -p microvms-core -T 30s
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: provision-fuzz-crashes
          path: microvms-core/src/__fuzz__/
          if-no-files-found: ignore

  # The core's egress-posture harness (BIND-11..13; #227): the request-side answer against the
  # launch over arbitrary options. Same shape as the closed-output job.
  egress-posture:
    name: fuzz (control::posture_fuzz::posture_matches_the_launch, bounded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: install cargo-bolero
        run: cargo install cargo-bolero --version 0.13.4 --locked
      - name: fuzz the egress-posture harness for two minutes
        run: cargo +nightly bolero test control::posture_fuzz::posture_matches_the_launch -p microvms-core -T 120s
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: egress-posture-fuzz-crashes
          path: microvms-core/src/control/__fuzz__/
          if-no-files-found: ignore

  # The build context, the context hash and the artifact key (IMAGE-6..IMAGE-8; #221),
  # coverage-guided. The ignore-rule harness checks the matcher against moby's own regex
  # translation of each pattern.
  build-context:
    name: fuzz (context_fuzz, bounded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: install cargo-bolero
        run: cargo install cargo-bolero --version 0.13.4 --locked
      # `+nightly`, because `rust-toolchain.toml` pins stable and libFuzzer needs `-Z`.
      - name: fuzz the ignore rules for one minute
        run: cargo +nightly bolero test ignore_rules_agree_with_mobys_regex_translation -p microvms-core -T 60s
      - name: fuzz the context hash for one minute
        run: cargo +nightly bolero test the_context_hash_extends_the_legacy_one_and_follows_every_entry -p microvms-core -T 60s
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: build-context-fuzz-crashes
          path: microvms-core/tests/__fuzz__/
          if-no-files-found: ignore
