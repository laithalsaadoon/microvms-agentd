name: native Box release

on:
  pull_request:
    paths:
      - .github/workflows/native-box.yml
      - examples/strands-box-codex-sdk/**
      - conformance/lanes/native_box.py
      - conformance/selftest/native_box.py
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: download Box's release and start it on native aarch64 Linux
    # GitHub's public-repository ARM64 runner, not emulation: the release's binaries are aarch64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: download the example's pinned Box release and record its digests
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          examples/strands-box-codex-sdk/download-box.sh
          examples/strands-box-codex-sdk/.box-bin/box --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-box
          path: examples/strands-box-codex-sdk/.box-bin/
          include-hidden-files: true
          if-no-files-found: error
