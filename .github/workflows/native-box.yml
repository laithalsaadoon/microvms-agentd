name: native Box build

on:
  pull_request:
    paths:
      - .github/workflows/native-box.yml
      - examples/strands-box-codex-sdk/**
      - conformance/lanes/native_box.py
      - conformance/selftest/native_box.py
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build Box on native aarch64 Linux
    # GitHub's public-repository ARM64 runner, not emulation or a cross-build host.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
      - name: install the pinned cross-linker for the guest's glibc
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          curl -fsSL https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-linux-0.16.0" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.23.4 --locked
      - name: build the example's Box binaries and record their provenance
        run: |
          examples/strands-box-codex-sdk/build-box.sh
          examples/strands-box-codex-sdk/.box-bin/strands-box --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-box
          path: examples/strands-box-codex-sdk/.box-bin/
          include-hidden-files: true
          if-no-files-found: error
