name: live conformance

# Manual only, and deliberately so. This workflow launches real MicroVMs in a
# real account: it costs money, it takes about twenty minutes (the suite's own
# docstring breaks that down — the idle-keepalive section deliberately waits out
# a 60-second idle window twice), and it needs credentials that can create IAM
# roles. None of that belongs on a push trigger.
#
# The `environment:` below is the actual gate. Configure it in repository settings
# with a required reviewer, and no fork, no bot, and no compromised token can
# spend money here without a human approving the run.
#
# Dispatched on a release tag (`gh workflow run live-conformance.yml --ref vX.Y.Z`), it's the
# live run `release.yml`'s `live-gate` waits for. It then tests the tag's draft release rather
# than a build: the daemon baked into the suite's images is the draft's `agentd`, the CLI under
# test is the draft's Linux archive, and `$MICROVM_RELEASE_DIR` points the quickstart section's
# fetch at the draft's assets, which it verifies against their attestation as it would the
# published release's. When every step passes it uploads the `live-verified` marker the gate
# reads. Dispatched on a branch, it builds both binaries from that branch as it always has.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "AWS region (must be a Lambda MicroVMs region)"
        required: true
        default: us-east-1
        type: choice
        options: [us-east-1, us-west-2]
      destroy_after:
        description: "Destroy the Terraform stack when finished"
        required: true
        default: true
        type: boolean

# One at a time. Two concurrent runs would race on the same Terraform state and
# on the same account, and the loser would report failures that are really
# collisions.
concurrency:
  group: live-conformance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Only the repository's owner starts a live run. Dispatching needs write access, which a
  # collaborator or an App granted `actions: write` would also hold. `triggering_actor` is
  # whoever started this attempt, so a re-run someone else starts fails here too. This job
  # fails before `live` reaches its environment, so nobody is asked to approve such a run.
  # It guards only this file as reviewed on main: an edited copy on a branch or a tag can drop
  # it, and the `live-aws` environment's reviewer and the AWS role's trust policy are what
  # hold then.
  owner:
    name: started by the repository owner
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: refuse a run anyone else started
        env:
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::$ACTOR started this run; only $OWNER, the repository owner, starts live conformance."
            exit 1
          fi

  # On a tag only. A draft release is visible only with push access, so the download gets a job
  # of its own: this one holds `contents: write` and runs nothing from the repository, and the
  # job below, which builds and runs the suite with AWS credentials, keeps `contents: read`.
  draft:
    name: the tag's draft release
    needs: owner
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # lists and downloads a draft release
    steps:
      - name: download the draft's assets and check them against its SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "draft-release/$TAG"
          (cd "draft-release/$TAG" && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: draft-release
          path: draft-release
          if-no-files-found: error

  live:
    name: real AWS
    needs: [owner, draft]
    # A branch run skips `draft` and runs this on its own build; a tag run runs it only once the
    # draft downloaded. `draft` also reads as skipped when `owner` failed, so `owner` is checked
    # by name.
    if: ${{ !cancelled() && needs.owner.result == 'success' && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: live-aws
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # for OIDC; no long-lived key is stored
    steps:
      # The full history and the tags, for the suite's version-skew section
      # (`conformance/lanes/skew.py`): it pairs this tree with the highest `v*` tag reachable
      # from HEAD and reads the daemon's version from that tag's tree with `git show`, and the
      # default one-commit checkout has neither.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
        # rust-toolchain.toml declares the aarch64-musl target, so it installs
        # without a step here.

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Every `uses:` here is on a Node 24 major, for the reason `ci.yml`'s header
      # paragraph gives — including `configure-aws-credentials@v6`, whose rolling
      # v6 tag landed on node24 (checked against the tag's action.yml, 2026-08-09).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # See `ci.yml`'s `security` job: `conformance/run_rs.py` and
          # `tools/check-live-rates.py` are PEP 723 scripts carrying their own
          # dependencies, so there is no lockfile a cache key could watch and
          # `auto` warns rather than caching.
          enable-cache: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      # OIDC rather than a stored access key: the credentials exist for the life
      # of this job and cannot be exfiltrated from a log for later use. The role
      # needs to create MicroVM images, run MicroVMs, and manage the conformance
      # stack's bucket and roles.
      - name: assume AWS role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.LIVE_CONFORMANCE_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      - name: build the shipping binary
        if: github.ref_type != 'tag'
        run: cargo build --release -p agentd --target aarch64-unknown-linux-musl

      # The host-architecture CLI, which is the client the suite drives. NOT the
      # aarch64 target above: the daemon cross-compiles because it runs inside the
      # guest, and a CLI built for the guest's architecture could not execute on
      # this runner.
      - name: build the microvm CLI
        if: github.ref_type != 'tag'
        run: cargo build --release -p microvms-cli

      - name: the binaries under test are the ones just built
        if: github.ref_type != 'tag'
        run: |
          {
            echo "AGENTD=target/aarch64-unknown-linux-musl/release/agentd"
            echo "MICROVM=target/release/microvm"
          } >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.ref_type == 'tag'
        with:
          name: draft-release
          path: draft-release

      # The release's own binaries, the ones a user downloads, not a rebuild of the tag.
      # `$MICROVM_RELEASE_DIR` is read by every provisioning fetch, and only the quickstart
      # section fetches: the others pass `--binary`, which outranks it.
      - name: the binaries under test are the draft's
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p draft-release/bin
          tar -xzf "draft-release/$TAG/microvm-x86_64-unknown-linux-gnu.tar.gz" -C draft-release/bin
          chmod +x "draft-release/$TAG/agentd" draft-release/bin/microvm
          {
            echo "AGENTD=draft-release/$TAG/agentd"
            echo "MICROVM=draft-release/bin/microvm"
            echo "MICROVM_RELEASE_DIR=$PWD/draft-release"
          } >> "$GITHUB_ENV"

      # The `live-aws` environment's `LIVE_CONFORMANCE_PERMISSIONS_BOUNDARY` variable names the
      # boundary the stack's two roles get (`conformance/infra/main.tf` says why). The role this
      # job assumes may create those roles only with it attached, so an unset variable fails
      # the apply with AccessDenied rather than creating unbounded roles.
      - name: apply the conformance stack
        env:
          AWS_REGION: ${{ inputs.region }}
          TF_VAR_permissions_boundary: ${{ vars.LIVE_CONFORMANCE_PERMISSIONS_BOUNDARY }}
        run: |
          terraform -chdir=conformance/infra init -input=false
          terraform -chdir=conformance/infra apply -auto-approve -input=false

      # The Python oracle (`conformance/run.py`) and the standalone suspend/resume
      # probe ran here until the Rust port went live-green on the same commit; both
      # are in git history now, and this suite carries the suspend/resume assertions
      # they fed. It reports the 34 checks it cannot express as SKIP rather than
      # letting them go quiet.
      - name: conformance suite
        env:
          AWS_REGION: ${{ inputs.region }}
        run: ./conformance/run_rs.py --binary "$AGENTD" --microvm-binary "$MICROVM"

      # Free, creates nothing, and the only thing here that can tell you a price
      # this repo publishes has gone wrong. Runs after the suite so a rate that
      # moved does not stop the account from being torn down.
      - name: pinned rates match the Pricing API
        env:
          AWS_REGION: ${{ inputs.region }}
        run: ./tools/check-live-rates.py

      # `if: always()` on both cleanup steps: a failed suite is exactly when
      # resources are most likely to survive, so cleanup must not be skipped by
      # the failure that made it necessary.
      - name: verify nothing leaked
        if: always()
        env:
          AWS_REGION: ${{ inputs.region }}
        run: ./tools/verify-clean.py

      - name: destroy the stack
        if: always() && inputs.destroy_after
        env:
          AWS_REGION: ${{ inputs.region }}
        run: terraform -chdir=conformance/infra destroy -auto-approve

      # Re-checked after the destroy, because "terraform destroy succeeded" and
      # "the account is clean" are different claims — six service-created log
      # groups once survived a successful destroy.
      - name: verify again after destroy
        if: always() && inputs.destroy_after
        env:
          AWS_REGION: ${{ inputs.region }}
        run: ./tools/verify-clean.py

      # Last, and only when every step above passed (an `if:` without a status function
      # implies `success()`). The SHA256SUMS is the draft's, which `release.yml`'s `live-gate`
      # compares with the one its run wrote, so this marker vouches for this draft only.
      - name: record that the tag's draft passed
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          jq -n --arg tag "$TAG" --arg commit "$GITHUB_SHA" --rawfile sums "draft-release/$TAG/SHA256SUMS" \
            '{tag: $tag, commit: $commit, sha256sums: $sums}' > live-verified.json
          cat live-verified.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.ref_type == 'tag'
        with:
          name: live-verified
          path: live-verified.json
          if-no-files-found: error
