name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, stated once: every job here reads the repo and writes
# nothing. A job that someday needs more (artifact attestation, SARIF upload)
# raises it per-job rather than widening the default.
permissions:
  contents: read

# A push that supersedes a running PR build cancels it; main never cancels, so
# the history of green on main stays gap-free.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ── the shape of a job ──────────────────────────────────────────────────────
#
# Each job is its checkout (at the depth its tasks need), the Rust toolchain and rust-cache
# where it builds Rust, `.github/actions/mise` (mise and mise.lock's tools, out of the tools
# cache), and one `mise run ci:<job>`. The task, in .config/mise/tasks/ci.toml, holds the job's
# steps, so a check CI runs is a task a contributor runs, under the same tools and `[env]`, and
# `ci:parity` holds every task `check` depends on to a job reaching it. A job's own steps are
# only what a task can't do: set up the runner, pass a pull request's base or a shard, upload an
# artifact.
#
# The Rust toolchain stays dtolnay/rust-toolchain's rather than mise's, since the fuzz jobs need
# nightly beside the stable release `rust-toolchain.toml` pins, and rust-cache keys on the
# toolchain it finds; `ci:parity` holds each input here to that file's channel. mise's `rust`
# then finds that toolchain installed.
#
# ── on the action versions below ────────────────────────────────────────────
#
# Every `uses:` in this file resolves to a Node **24** action, and that is a
# requirement rather than a preference: the runner deprecated Node 20 on
# 2025-09-19 and now forces such actions onto 24 anyway, printing a warning per
# step. A warning that appears on every green run is a warning nobody reads, so
# the versions here are chosen to emit none. `dtolnay/rust-toolchain` is a
# composite action with no Node runtime at all, and `Swatinem/rust-cache@v2`,
# `actions/cache` and `jdx/mise-action` (in `.github/actions/mise`) are Node 24.

jobs:
  rust:
    name: lint, model, and test tiers (${{ matrix.os }})
    # The daemon ships to Linux only (a MicroVM guest), but the CLI, the library,
    # and the bindings run wherever a developer sits — so the client tiers build
    # and test on all three platforms. The matrix is here rather than in a
    # separate job so a platform break fails the same required check as a logic
    # break; ubuntu remains the only place the full daemon suite runs, because
    # agentd's exec/fs tiers assume a Unix process model on purpose (the guest
    # is one). `ci:rust` is the ubuntu leg and `ci:rust-client` the other two.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            task: ci:rust
            tools: ''
            tools-cache: restore
          # Rust alone, and no tools cache: nothing `ci:rust-client` runs needs another tool.
          - os: macos-latest
            task: ci:rust-client
            tools: rust
            tools-cache: none
          - os: windows-latest
            task: ci:rust-client
            tools: rust
            tools-cache: none
    runs-on: ${{ matrix.os }}
    steps:
      # The full history and the tags, for `schema:compat`: it compares with the highest `v*` tag
      # reachable from HEAD, and the default one-commit checkout has neither. Every leg gets them
      # rather than a matrix expression picking the depth, since ci:local reads `fetch-depth` as a
      # literal to shape its clone; the history is small.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/mise
        with:
          install_args: ${{ matrix.tools }}
          tools-cache: ${{ matrix.tools-cache }}
      - run: mise run ${{ matrix.task }}

  security:
    name: semgrep, secret history, licenses, workflow lint
    runs-on: ubuntu-latest
    env:
      # The ref the ratchet's rule 3 and the registry's unregistered notes compare with: a pull
      # request's base branch, and on a push to main the commit before it, since the merge base
      # of main and itself is itself and both rules would pass vacuously.
      GATE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
      # The pull request `changelog:check` holds to a fragment, which a push to main has none of.
      # The author goes through the environment, not into a command, because a login is the
      # pull request's input.
      PR_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # betterleaks scans history, and the base refs above need the base branch. A shallow
          # clone has neither.
          fetch-depth: 0
      # For `cargo metadata --no-deps`, which reads manifests and builds nothing, so no cache.
      # Clippy for the ratchet's unit tests that lint throwaway crates with each adapter's
      # `clippy.toml` (#285); they build no dependencies either.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: ./.github/actions/mise
      - run: mise run ci:security

  sbom:
    name: SBOM and vulnerability scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # syft writes the SBOM, grype audits the SBOM, trivy audits the tree
      # (vulns + IaC misconfig + secrets), osv-scanner audits the lockfiles
      # against OSV directly. Three scanners because their databases disagree
      # at the margins. Suppressions are tiered by finding kind:
      #   - dependency VULNERABILITIES: .vex/microvms-agentd.openvex.json
      #     (OpenVEX, consumed by grype via --vex and trivy via TRIVY_VEX;
      #     osv-scanner can't read VEX, so its osv-scanner.toml mirrors it)
      #   - MISCONFIG/secret findings: .config/trivyignore.yaml (VEX has no identity
      #     for these)
      # Either way the rule holds: every accepted finding carries its reason.
      - uses: ./.github/actions/mise
      - run: mise run ci:sbom
      # The SBOMs are the artifact consumers actually want from this job —
      # attached per-run so any commit's inventory is downloadable, 90-day
      # default retention.
      - name: publish SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          if-no-files-found: error

  drift:
    name: hardcoded constraints match the service model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # TRAP-12 says "in the build gate", and pre-push alone is not a gate: a --no-verify push
      # or a merge that trusts CI skips it. `model:check` reads the Rust constants through `cargo
      # run -q -p microvms-cli -- constants --emit-json`, so this job builds the CLI.
      - uses: ./.github/actions/mise
      - run: mise run ci:drift

  # The published crates' Rust API against their last release on crates.io (#298).
  # `semver:check`'s comment says which crates are gated and why each is checked as itself.
  semver:
    name: published crates keep their API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/mise
      - run: mise run ci:semver

  bindings:
    name: python and node bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/mise
      # The bindings entries in verify/guards/faults/*.toml fire in the `guards` job's shards, each
      # worker in an environment of its own, not here.
      - run: mise run ci:bindings

  # `mise run guards:fire` (#274): each entry in verify/guards/faults/*.toml (every one on a push to main,
  # the ones whose recorded verdict it can't keep on a pull request) is seeded into a scratch
  # worktree, and its guard must fail for the reason the entry names. Its own job because each
  # fault is one more incremental build, which is why it isn't in `check` either. Ubuntu only:
  # the guards it seeds are the same code on every platform, and the `rust` matrix already runs
  # them unseeded.
  #
  # Every push to main fires every entry under strace and records, per leg, what each entry's
  # runs read and its verdict (`--record`); a pull request's leg restores its leg's latest
  # record from main and fires only the entries whose recorded `fired` verdict it can't keep
  # (`--reuse`). The script's docstring has the rule: a changed file or directory a run read, a
  # changed entry, tool, environment or fire script, and a command that reads the git history
  # or downloads by a range all fire, and so does everything when no record restores. The
  # record is diffed from its own commit, not the merge base, so main's changes since count too.
  # A red `seeded faults fire` on main is fixed before the next merge, since no pull request
  # keeps a verdict main's record didn't see fire; one that fails an entry it didn't touch reads
  # main's last push run first.
  #
  # The job is a matrix of shards (D35, #345). Each leg fires `--shard k/N` of the same
  # selection (whole commands, weighted by their entries' rough CI seconds; the script's
  # docstring has the rule) and has 60 minutes, on a pull request and on main's push alike.
  # The legs report under their own names, and `guards-result` below carries the required
  # check's. Six shards, from measurement: run 36673442938 fired all 714 entries in three legs of
  # 13.5, 11.7 and 8.3 minutes, and its per-command seconds (`command_overhead`, `entry_cost`)
  # model the registry at this change as about 9.3 minutes of work a leg for three, 7.0 for
  # four, 5.6 for five and 4.7 for six, plus about two minutes of setup and seeding a leg. Six
  # puts the legs level with the ubuntu tier (6.5 minutes in that run), and the account ran 40
  # jobs at once on 2026-09-30, so a pull request's 22 jobs fit with room. The legs restore the dependency cache the `guards-cache` job saves,
  # which holds what every leg's commands compile, and never save one of their own. Each leg's
  # workers 2 to 4 start from a copy of it, without the workspace's own crates (the script's
  # docstring has why). `mise run guards:fire -- --venv-per-worker --shard 1/6 --reuse DIR` runs
  # one pull request leg's share locally, from a record in DIR.
  #
  # Every suite fires here, the bindings one included, each worker in a venv of its own
  # (`--venv-per-worker`), so those entries spread over the legs and their workers like the rest.
  guards:
    name: seeded faults fire (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `--reuse` diffs the tree from the record's commit, which a shallow clone doesn't have.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The `guards-cache` job's, restored and never saved here: see that job.
          shared-key: guards-deps
          save-if: false
      - uses: ./.github/actions/mise
      # `--record` traces every run with strace, which a mise task can't install. The runner
      # image carries it; this installs it where one doesn't. Both legs have it: the pull
      # request's runs the TraceReading entry's real-strace case, so a runner that can't trace
      # fails a pull request and not main's next push.
      - name: strace
        run: command -v strace > /dev/null || { sudo apt-get update && sudo apt-get install -y strace; }
      # Main's records of what each verdict read: every leg's, from one push, saved together by
      # `guards-records` once the push's legs are done. The one at the pull request's base, or
      # the newest before it. A leg's slice moves whenever the registry's weights change, and a
      # pull request that adds an entry moves most commands to another leg (#416's, 2026-09-30,
      # moved 40 of shard 0's 42), so a leg reads every leg's record and keeps a command's
      # verdict whichever leg recorded it. The records come from one push because the split
      # moves between pushes too: legs that restored their records separately got some from a
      # push still saving and some from the one before, and a command the two splits put on
      # different legs was in neither (#450's first run). Each record is its own file
      # (`shard-<leg>-of-<legs>.json`), and `--reuse` reads them all.
      - name: main's records of what each verdict read
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/guards-verdicts
          key: guards-records-${{ github.event.pull_request.base.sha }}
          restore-keys: guards-records-
      # `ci:guards` holds the fire's command and turns incremental builds on for it. `--target-dir
      # target` for rust-cache: the script's own default target exists so a developer's next
      # cargo run can't pick up a scratch build, and nothing here builds after `fire`. The two
      # steps are one command but for the last flag, `--reuse` on a pull request and `--record`
      # on main; test_check_guards_fire.py runs both as written here, through the task's command.
      - name: the seeded faults whose recorded verdicts a pull request can't keep fire
        if: github.event_name == 'pull_request'
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: mise run ci:guards --target-dir target --reuse "$RUNNER_TEMP/guards-verdicts"
      - name: every seeded fault fires, and its record is written
        if: github.event_name != 'pull_request'
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: mise run ci:guards --target-dir target --record "$RUNNER_TEMP/guards-verdicts"
      # For `guards-records`, which saves every leg's together. A leg whose fire failed uploads
      # nothing, and pull requests fire the commands it held.
      - name: the record, for the pull requests
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: guards-verdicts-${{ matrix.shard }}
          path: ${{ runner.temp }}/guards-verdicts
          retention-days: 1
          if-no-files-found: error
      # The warm workers' copies and the incremental data cost disk: what the fire left, while
      # their size on the runner is still being measured.
      - name: disk left after the fire
        if: always()
        run: df -h / "$RUNNER_TEMP"

  # The required check `seeded faults fire` (ruleset 21934766), as the shards' combined
  # result: the shards report under their own names, so this job keeps the name the ruleset
  # holds. `always()` runs it when a shard fails, since a skipped required check counts as
  # passing, and it passes on `success` only: GitHub reports a shard that timed out as
  # `cancelled`, not `failure`. It's `always()` and not `!cancelled()`: a cancelled run would
  # skip this job, and a skipped required check passes, so a superseded pull request run shows
  # red instead. A pull request that keeps every verdict still reports it green, because each
  # shard passes with nothing to fire. It has no step `if` and no `continue-on-error`, since
  # either would let it pass over a red shard, and test_check_guards_fire.py holds its shape.
  # It checks nothing out and runs no task: its one command reads the shards' result.
  guards-result:
    name: seeded faults fire
    needs: guards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every shard passed
        env:
          RESULT: ${{ needs.guards.result }}
        run: '[ "$RESULT" = success ] || { echo "::error::a guards shard ended $RESULT; open the red seeded faults fire (shard k of N) check"; exit 1; }'

  # The caches pull requests restore, saved here and nowhere else, on a push to main.
  #
  # Main's records from one push as one cache entry, which a pull request's legs restore. It
  # runs once every leg is done, `always()` so a failed leg doesn't cost the others' records,
  # and saves under the push's commit. A pull request restores records from one push only:
  # each leg's slice differs between pushes whose registries differ, so records from two pushes
  # can miss a command both held. It checks nothing out and runs no task.
  guards-records:
    name: seeded faults' records for pull requests
    needs: guards
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: guards-verdicts-*
          merge-multiple: true
          path: ${{ runner.temp }}/guards-verdicts
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/guards-verdicts
          key: guards-records-${{ github.sha }}

  # The dependency cache the `guards` legs and `mutants` restore, after compiling what every rust
  # entry's cargo commands compile and every bindings entry's extension builds
  # (`check-guards-fire.py build`), so each leg restores every build the registry needs, where it
  # used to restore the slice one leg's first worker had built. The legs don't save, and no job
  # saves on a pull request: the repo's caches are capped at 10 GB, and pull requests' copies of
  # each job's cache had pushed it past that, which evicts main's. It builds only when the key
  # missed: an exact hit is main's whole cache for this lockfile and toolchain already, and
  # rust-cache wouldn't overwrite it. The bindings suite is here because a worker's first `napi
  # build` compiled 235 crates without its builds, 90.8 s against 45.3 s with them on four pinned
  # cores at 18645c2. A build `build` starts compiling reaches the cache with the next lockfile or
  # toolchain change, since an exact hit is never saved over: main's Cargo.lock changed 37 times
  # from 2026-09-01 to f3d88bb.
  #
  # And the tools cache every job restores (`.github/actions/mise` says why it's saved here
  # only): mise.lock's tools plus every task's own (`ci:tools`), the cargo-built ones among them,
  # so a `guards` or `mutants` leg doesn't build cargo-mutants before it tests anything. It's
  # restored by exact key, so an entry holds this mise.toml's tools and not every version an
  # older entry carried.
  guards-cache:
    name: seeded faults' dependency cache
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: guards-deps
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: mise
        uses: ./.github/actions/mise
        with:
          tools-cache: exact
      - name: build what the seeded faults compile
        if: steps.cache.outputs.cache-hit != 'true'
        run: mise run ci:guards-cache --target-dir target
      - name: install every task's own tools
        if: steps.mise.outputs.tools-cache-hit != 'true'
        run: mise run ci:tools
      - name: save the tools cache
        if: steps.mise.outputs.tools-cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: ${{ steps.mise.outputs.tools-cache-key }}

  # `mise run mutants` (#275), in shards: cargo-mutants changes the Rust a pull request
  # touches, one mutant at a time (a return value, an operator, a deleted `!`), and the job
  # fails when the mutated package's own tests still pass with one in. `.cargo/mutants.toml`
  # has the settings and each exclusion's reason, tools/check-mutants.py the package list
  # and what each exit code means, and CONTRIBUTING.md how to read a shard's missed.txt.
  #
  # Pull requests only: the question is about a change, and a push to main was asked it on its
  # pull request. No workflow path filter, since a required check behind one never reports on
  # a change it filters out, and that blocks the merge. The first step ends the job green
  # instead when the diff has no Rust. No `needs: rust`, which would wait for all three OS legs:
  # each shard runs its own unmutated baseline first, and a red baseline fails the shard.
  #
  # A fixed four-way split in cargo-mutants' order (`--shard k/4` takes consecutive slices),
  # so a shard's mutants sit close together and each one rebuilds little. `--in-place` builds
  # in the checkout, which the runner throws away, so rust-cache can restore dependencies into
  # its target: the `guards-cache` job's, since this job never runs on main to save its own.
  # Measured over #283's diff at 67a13cb (173 mutants under this config) on four cores of a
  # shared devbox with warm dependencies, 2026-09-28: 87 s to 325 s a shard. A hosted runner
  # builds its first baseline cold; the timeout is the budget for that.
  mutants:
    name: mutation testing (shard ${{ matrix.shard }} of 4)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The diff starts at the base branch, which a shallow clone doesn't have.
          fetch-depth: 0
      # The wrapper passes a change with no Rust without mutating anything too; this step is
      # here so such a change doesn't install a toolchain or mise first. It's the wrapper's own
      # answer (`--detect`, the runner's python3, no dependencies), so the gate and the run can't
      # disagree, and test_check_mutants.py runs this step and the gated ones as written here.
      # A base git can't resolve fails the step rather than reading as no Rust.
      - name: the change touches Rust
        id: diff
        env:
          BASE: origin/${{ github.base_ref }}
        run: python3 tools/check-mutants.py --base "$BASE" --detect >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.diff.outputs.rust == 'true'
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.diff.outputs.rust == 'true'
        with:
          # The `guards-cache` job's, restored and never saved: its builds are `cargo test -p`
          # runs of these packages, which is what a mutant's test run compiles.
          shared-key: guards-deps
          save-if: false
      - uses: ./.github/actions/mise
        if: steps.diff.outputs.rust == 'true'
      - name: mutate this shard of the change
        if: steps.diff.outputs.rust == 'true'
        env:
          BASE: origin/${{ github.base_ref }}
          SHARD: ${{ matrix.shard }}/4
        run: mise run ci:mutants --base "$BASE" -- --shard "$SHARD" --in-place
      # Each mutant's diff and test log, and the missed and timeout lists, one click from the
      # PR. A shard the diff gave no mutants writes none.
      - name: upload mutants.out
        if: always() && steps.diff.outputs.rust == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-out-shard-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: warn

  # `mise run mutmut`, the Python twin of `mutants`: mutmut changes the functions a pull request
  # touches in tools/*.py, one mutant at a time, and the job fails when a changed function has
  # more surviving mutants than it had on the base (a new one starts from none).
  # tools/check-mutmut.py has the rules and what it counts. Pull requests only and no path
  # filter, for `mutants`' reasons. The toolchain with clippy is the `security` job's: the suites
  # it runs are ones that job runs, and test_ratchet.py lints throwaway crates.
  #
  # Four shards, each measuring its share of the changed functions, heaviest first onto the
  # lightest (`--shard`), each function's base in the same shard, so a shard's verdict needs no
  # other's. The first step is the script's own answer, on the runner's python3: shard 0 runs
  # whenever a script changed, since it reports what no shard measures, and another only when it
  # has a function. A shard's mutants and its base run within `ci:mutmut`'s budget, under the
  # job's timeout: #495's twelve functions in check-guards-fire.py made 1,306 mutants, and one
  # job measuring them all ran past its 60 minutes with its head side a third done. A function
  # the budget leaves undecided passes, and the job's log names it.
  mutmut:
    name: mutation testing the gate scripts (shard ${{ matrix.shard }} of 4)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The base run checks out the merge base, which a shallow clone doesn't have.
          fetch-depth: 0
      - name: the shard has a changed script to measure
        id: diff
        env:
          BASE: origin/${{ github.base_ref }}
          SHARD: ${{ matrix.shard }}/4
        run: python3 tools/check-mutmut.py --base "$BASE" --shard "$SHARD" --detect >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.diff.outputs.python == 'true'
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: ./.github/actions/mise
        if: steps.diff.outputs.python == 'true'
      - name: mutate this shard's changed functions
        if: steps.diff.outputs.python == 'true'
        env:
          BASE: origin/${{ github.base_ref }}
          SHARD: ${{ matrix.shard }}/4
        run: mise run ci:mutmut --base "$BASE" --shard "$SHARD"

  build:
    name: static aarch64 binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # aarch64 musl is the shipping target: every MicroVM we have run is ARM64, and a static
      # binary is what lets the daemon bake into a task's own base image without depending on
      # an interpreter that image may not have. The release job links it with the runner's
      # aarch64 gcc, which a mise task can't install, so this job does the same: the step and
      # the linker variable are the release job's.
      - name: install cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - uses: ./.github/actions/mise
      # The build is a gate, not a release step: what the job proves is that the shipping
      # target still cross-compiles and still links statically, which is what breaks silently
      # when a dependency acquires a C shim.
      - env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: mise run ci:build

# The requirements-verification job (symspec over verify/spec/*.symspec.json) ran here
# while symspec was on npm. The tool this repo actually needs is the v5 line
# (1.0.0-alpha.0) — the only version that can read core.symspec.json's state
# model and reachability tier — and it is not published anywhere yet; it runs
# from a local checkout via `mise run spec:core`. A CI job that installed the
# 0.1.0 registry package would verify the six-requirement daemon draft and skip
# the 51 requirements that matter, which is worse than no job: green next to
# the word "requirements" reads as "the requirements were verified". The job
# returns when symspec 1.x is installable from a registry or vendorable.
