# Watches the three ecosystems this repo actually has. Terraform is absent on
# purpose: conformance/infra is one file with two pinned providers that the
# live suite exercises directly, and an unattended provider bump there changes
# what a paid conformance run tests.
#
# The npm entry covers microvms-js's single devDependency (@napi-rs/cli);
# cargo covers Cargo.lock; github-actions covers the version-tagged actions in
# the workflows and the mise action. The tools mise installs are mise.lock's
# (`mise lock` refreshes it), and the checksummed curl installs left in the
# release workflows are refreshed by hand, as their comments state.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # The fuzz crate is excluded from the workspace (sanitizer builds, nightly),
  # so it carries its own lockfile that the root cargo entry never sees.
  - package-ecosystem: cargo
    directory: /crates/agentd/fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  # Every action bump in one pull request a week: each pull request runs the
  # full CI, and five separate action bumps (#324 to #328) ran it five times
  # for one week's updates. The group takes version updates only (that's the
  # `applies-to` default), so a security update still arrives on its own.
  # The workflows, and the composite action every CI job installs mise through, whose own
  # `uses:` pins (actions/cache, jdx/mise-action) a scan of the workflows alone doesn't see.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/mise"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /bindings/microvms-js
    schedule:
      interval: weekly
