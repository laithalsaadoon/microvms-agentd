# The decisions this tree cites by id, such as `(D35, #345)` in a comment. The ids come from the
# maintainers' decision log, which lives outside the repository, so until this file a citation
# pointed at nothing a reader could open. `agents:check` fails on an id cited anywhere in the tree
# that has no table here (scripts/check-agents-md.py's `decision_problems` says where it looks).
#
# Each table holds `decision`, what was decided, and `source`, where it was decided or first
# recorded here. `status` says what has happened to it since. A decision that's reversed keeps
# its table: the commits that cite it still do.

[D14]
decision = "CI doesn't install mise. Its jobs install each tool themselves, and `ci:parity` (scripts/check-ci-parity.py) compares ci.yml's tool versions and env with mise.toml's instead of CI running the mise tasks."
source = "Cited first by #316 (91c3272, 2026-09-28), whose pull request says \"D14 holds: CI doesn't install mise, and parity is checked by comparing files\". The decision predates that change, and its reason wasn't recorded in the repository."
status = "Laith approved reversing it on 2026-09-30: CI may install mise through a SHA-pinned jdx/mise-action with a locked install from mise.lock. A later pull request makes that change and updates this entry; until it lands, CI works as the decision says."

[D18]
decision = "The tests that hold microvms-app to agentd-model's rows live in their own unpublished workspace crate, model-conformance. microvms-app is published, so it can't take a versioned dev-dependency on the unpublished agentd-model, and .cargo/deny.toml refuses a path dependency without a version (#296)."
source = "#343 (8234794, 2026-09-29)."

[D26]
decision = "mise pins Node 22 rather than 24: it's the major CI's bindings job runs and the floor of microvms-js's `engines`, so the suite contributors run is the one CI proves. `ci:parity` compares the majors."
source = "#316 (91c3272, 2026-09-28)."

[D31]
decision = "CI's `guards` job fires only the entries a pull request affects (`guards:fire -- --affected`), and every entry on each push to main. Laith picked option 2 of #323."
source = "#334 (a081c25, 2026-09-29)."

[D35]
decision = "CI's `guards` job runs as a matrix of shards, each firing its share of the selection with 60 minutes, on pull requests and on main's push alike, and the required `seeded faults fire` check is their combined result."
source = "Laith's decision on #345, shipped by #346 (f095b7e, 2026-09-29)."
