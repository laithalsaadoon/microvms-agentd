StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Microvms
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, \
  https://github.com/vale-cli/write-good/releases/download/v0.4.1/write-good.zip, \
  https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip, \
  https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/vale-cli/readability/releases/download/v0.2.0/Readability.zip

[*.{md,mdx}]
BasedOnStyles = ai-tells, write-good, proselint, Google, Readability, Microvms

# Reference prose preserves literal names and required distinctions; review style suggestions in context.
Google.Acronyms = suggestion
# Reference prose preserves literal names and required distinctions; review style suggestions in context.
Google.Anthropomorphism = suggestion
# Reference prose preserves literal names and required distinctions; review style suggestions in context.
Google.Colons = warning
# Reference prose preserves literal names and required distinctions; review style suggestions in context.
Google.Contractions = suggestion
# Reference prose preserves literal names and required distinctions; review style suggestions in context.
Google.Ellipses = warning
# Reference prose preserves literal names and required distinctions; review style suggestions in context.
Google.ExcessiveClaims = suggestion
# Task guides may express the reader's question in the first person.
Google.FirstPerson = NO
# Reference prose preserves literal names and required distinctions; review style suggestions in context.
Google.HeadingPunctuation = warning
# Reference prose preserves literal names and required distinctions; review style suggestions in context.
Google.Headings = warning
# Reference prose preserves literal names and required distinctions; review style suggestions in context.
Google.Jargon = suggestion
# Some command and API names preserve hyphens next to adverbs.
Google.LyHyphens = warning
# Reference prose preserves literal names and required distinctions; review style suggestions in context.
Google.OxfordComma = warning
# Reference prose preserves literal names and required distinctions; review style suggestions in context.
Google.Parens = suggestion
# write-good.Passive already reports passive constructions.
Google.Passive = NO
# Literal values keep punctuation outside the quoted value.
Google.Quotes = warning
# Reference prose preserves literal names and required distinctions; review style suggestions in context.
Google.Ranges = warning
# Reference prose preserves literal names and required distinctions; review style suggestions in context.
Google.Semicolons = suggestion
# Qualified identifiers in prose may contain dots without spaces.
Google.Spacing = warning
# American spelling is a repository requirement.
Google.Spelling = error
# Reference prose preserves literal names and required distinctions; review style suggestions in context.
Google.Timeless = suggestion
# First-person plural describes maintained project decisions.
Google.We = NO
# Reference prose preserves literal names and required distinctions; review style suggestions in context.
Google.Will = warning
# Reference prose preserves literal names and required distinctions; review style suggestions in context.
Google.WordList = warning
# Reference prose preserves literal names and required distinctions; review style suggestions in context.
Google.WordListCase = warning
# API names and required terms can raise readability scores; review the surrounding explanation.
Readability.AutomatedReadability = warning
# API names and required terms can raise readability scores; review the surrounding explanation.
Readability.ColemanLiau = warning
# API names and required terms can raise readability scores; review the surrounding explanation.
Readability.FleschKincaid = warning
# API names and required terms can raise readability scores; review the surrounding explanation.
Readability.FleschReadingEase = warning
# API names and required terms can raise readability scores; review the surrounding explanation.
Readability.GunningFog = warning
# API names and required terms can raise readability scores; review the surrounding explanation.
Readability.LIX = warning
# API names and required terms can raise readability scores; review the surrounding explanation.
Readability.Polysyllables = suggestion
# API names and required terms can raise readability scores; review the surrounding explanation.
Readability.SMOG = warning
# API descriptions often quote requests and answers produced by software.
ai-tells.AnthropomorphicCognition = warning
# A container may literally hold values.
ai-tells.BareHolds = warning
# Tables and manifests literally name values and operations.
ai-tells.BareNames = warning
# Transport and dependency descriptions use reachability in its technical sense.
ai-tells.BareReaches = warning
# Field descriptions may introduce a capitalized literal or full sentence.
ai-tells.ColonUsage = warning
# Causal clauses explain why a constraint changes behavior.
ai-tells.ConsequenceClause = warning
# Wire payloads and commands carry specified fields.
ai-tells.FigurativeCarries = warning
# Data structures and guards may literally hold state or a lock.
ai-tells.FigurativeHolds = warning
# State retention and process-lifetime descriptions can use this verb literally.
ai-tells.FigurativeKeeps = warning
# Change-placement descriptions need editorial review in architecture prose.
ai-tells.FigurativeLands = warning
# Layer placement language needs editorial review rather than automatic rejection.
ai-tells.FigurativeLives = warning
# Token and identity generation use this established technical term.
ai-tells.FigurativeMints = warning
# Terms such as surface and boundary have defined architectural meanings.
ai-tells.FigurativeNouns = warning
# Ownership is a concrete property of lifecycle handles and architecture layers.
ai-tells.FigurativeOwns = warning
# Persistence descriptions distinguish state that remains across lifecycle transitions.
ai-tells.FigurativeStays = warning
# Requirements often state a forbidden capability or an absent value.
ai-tells.NegatedObject = warning
# Contract descriptions must distinguish absent inputs from present ones.
ai-tells.NegatedSubject = warning
# Technical clauses may share a sentence when their relationship is exact.
ai-tells.SemicolonUsage = warning
# Consecutive definitions can share an article without obscuring their subjects.
ai-tells.StackedAnaphora = warning
# A list of real operations can legitimately contain three verbs.
ai-tells.VerbTricolon = warning
# Reference sections can describe several real operation lists.
ai-tells.VerbTricolonDensity = warning
# Reference prose preserves literal names and required distinctions; review style suggestions in context.
proselint.P-Value = suggestion
# Examples preserve ASCII characters required by commands and protocols.
proselint.Typography = NO
# Sentence-style suggestions require editorial judgment when preserving an exact technical contract.
write-good.Cliches = warning
# Sentence-style suggestions require editorial judgment when preserving an exact technical contract.
write-good.E-Prime = suggestion
# Sentence-style suggestions require editorial judgment when preserving an exact technical contract.
write-good.Illusions = warning
# Sentence-style suggestions require editorial judgment when preserving an exact technical contract.
write-good.Passive = warning
# Sentence-style suggestions require editorial judgment when preserving an exact technical contract.
write-good.TooWordy = warning
# Sentence-style suggestions require editorial judgment when preserving an exact technical contract.
write-good.Weasel = warning

# Thresholds and dated measurements need review before treating a numeric phrase as a stale count.
Microvms.Counts = warning

# Implement, terminate, and optimize name concrete operations in this API and need contextual review.
ai-tells.FormalRegister = warning

# Process lifetimes, surviving suspend, and retained records are literal runtime properties here.
ai-tells.MortalityMetaphors = warning

# Reference sections point forward to enumerated fields and exact output contracts.
ai-tells.CataphoricForecasting = warning

# Shipping targets and published artifacts are release concepts in this repository.
ai-tells.ShipOveruse = warning

# Wire shapes and value shapes refer to concrete serialized structures.
ai-tells.FigurativeShape = warning

# Public API surfaces are defined compatibility boundaries in the repository.
ai-tells.FigurativeSurfaces = warning

# Firing a seeded fault or callback is established terminology in the guard framework.
ai-tells.FigurativeFires = warning

# Guards enforce named requirements; review their claims against the actual checks.
ai-tells.EnforcementMetaphors = warning

# Exhaustive contract statements can be valid but require checking their stated scope.
ai-tells.UniversalSubject = warning

# Exhaustive output and compatibility guarantees require source review.
ai-tells.UniversalObject = warning

# Data movement and lifecycle transitions have technical meanings that need contextual review.
ai-tells.MotionMetaphors = warning

# Exclusive API paths are sometimes intentional contracts; source review establishes exclusivity.
ai-tells.AbsoluteAssertions = warning

# The source-analysis contract uses fixed labels such as Consumer(s).
Google.OptionalPlurals = warning

# Reference prose discusses identifier suffixes and protocol units that must match their definitions.
Google.Units = warning

# Use familiar ASCII spellings in technical prose and command-oriented documentation.
proselint.Diacritical = warning

# CLI option spellings and exact command excerpts retain their required double hyphens.
ai-tells.DoubleHyphen = warning

# Typed field names and domain terms can form noun sequences that require editorial review.
ai-tells.NounString = warning

# The analysis template requires judgment-call labels and references may quote current help text.
ai-tells.FigurativeIdioms = warning

# Causal and example transitions can clarify protocol constraints and require contextual review.
ai-tells.FormalTransitions = warning

# Environment and option precedence descriptions use wins to state conflict resolution.
ai-tells.FigurativeWins = warning

# Compact status summaries and contract tables intentionally use parallel fragments.
ai-tells.ParallelStaccato = warning

# Reference tables and diagnostics use labeled definitions for scanability.
ai-tells.LabelAndExplain = warning

# Single and sole can specify required argument or selection cardinality.
ai-tells.FillerIntensifier = warning

# Harnesses often names callers rather than the figurative verb this heuristic detects.
ai-tells.OverusedVocabularyVerbs = warning

# Health is a reported service and VM state in the protocol.
ai-tells.AnthropomorphicAdjectives = warning

# Compatibility and deployment prerequisites need explicit negative requirements.
ai-tells.ContrastiveNegation = warning

# Independent absent dependencies and bootstrap prerequisites need explicit statements.
ai-tells.NegatedPair = warning

# Named variants, checks, and shells distinguish identifiers from raw values.
ai-tells.NamedAdjective = warning

# Under introduces exact command modes and model configurations in these references.
ai-tells.UnderRegime = warning

# Lifecycle descriptions use result clauses for retained state and return behavior.
ai-tells.ConsequenceParticiple = warning

# Coordinated clauses state independent protocol constraints and precedence conditions.
ai-tells.CoordinatedReveal = warning

# Colon clauses in field references often explain concrete outcomes rather than replace definitions.
ai-tells.ServesAsDodge = warning

