# ARCH-6: this crate performs no I/O. A rule that reads ambient state gives different answers
# on different machines, and it can't be tested without faking that state globally, so each
# input a rule needs arrives as a parameter. The crate root denies both lints, so a hit fails
# the build.
#
# Clippy takes fully qualified paths and no wildcards, so each item is named. Crates that do
# I/O (tokio, getrandom, reqwest) never get this far: the dependency set in
# `arch/placement.toml` keeps them out, and `microvms-cli/tests/dependency_direction.rs`
# asserts it and each dependency's declared features. This file covers what `std` can do
# without a dependency, and the clock, time zone and entropy reads that the allowed crates
# carry: jiff's `std` feature, which the domain needs, also brings `Timestamp::now`.
#
# `allow-invalid = true` marks a path that doesn't exist in every build: a feature this crate
# doesn't enable (another member can still turn it on through feature unification), or a
# Unix-only std item on the Windows leg. Without it clippy warns that the path doesn't refer
# to a reachable item, and the ban would lapse the day the item appears.
#
# `scripts/test_ratchet.py`'s `DomainLintTests` pins this list and runs real clippy over a
# call from each group, so a deleted line fails there.

disallowed-types = [
  { path = "std::fs::File", reason = "take the bytes as a parameter: the caller reads the file (a use case in microvms-app, through a port microvms-edges implements)" },
  { path = "std::fs::OpenOptions", reason = "return the bytes: the caller writes the file (a use case in microvms-app, through a port microvms-edges implements)" },
  { path = "std::fs::ReadDir", reason = "take the entries as a parameter: the caller lists the directory (a use case in microvms-app, through a port microvms-edges implements)" },
  { path = "std::process::Command", reason = "a subprocess belongs behind a port in microvms-app, implemented in microvms-edges" },
  { path = "std::net::TcpStream", reason = "network access belongs behind a port in microvms-app, implemented in microvms-edges" },
  { path = "std::net::TcpListener", reason = "network access belongs behind a port in microvms-app, implemented in microvms-edges" },
  { path = "std::net::UdpSocket", reason = "network access belongs behind a port in microvms-app, implemented in microvms-edges" },
  { path = "std::time::SystemTime", reason = "take the time as a parameter, as CalendarDate::from_unix_secs does; the caller reads the clock (the Clock port in microvms-app)" },
  { path = "std::time::Instant", reason = "take the time as a parameter; the caller reads the clock (the Clock port in microvms-app)" },
  { path = "std::fs::DirBuilder", reason = "return the path: the caller creates the directory (a use case in microvms-app, through a port microvms-edges implements)" },
  { path = "std::os::unix::net::UnixStream", reason = "network access belongs behind a port in microvms-app, implemented in microvms-edges", allow-invalid = true },
  { path = "std::os::unix::net::UnixListener", reason = "network access belongs behind a port in microvms-app, implemented in microvms-edges", allow-invalid = true },
  { path = "std::os::unix::net::UnixDatagram", reason = "network access belongs behind a port in microvms-app, implemented in microvms-edges", allow-invalid = true },
]

