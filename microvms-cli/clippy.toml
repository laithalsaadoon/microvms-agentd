  { path = "microvms_core::prelude::AgentVmExt::adopt_in", reason = "the CLI reaches AWS through src/seam.rs and nothing else, so CLI-2's fake seam sees every door a handler opens" },
  { path = "microvms_core::prelude::AgentVmExt::from_name", reason = "the CLI reaches AWS through src/seam.rs and nothing else, so CLI-2's fake seam sees every door a handler opens" },
