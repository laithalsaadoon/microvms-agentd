  { path = "microvms_core::session::Session::builder", reason = "the CLI reaches AWS through src/seam.rs and nothing else, so CLI-2's fake seam sees every door a handler opens" },
  { path = "microvms_core::preflight::preflight", reason = "the CLI reaches AWS through src/seam.rs and nothing else, so CLI-2's fake seam sees every door a handler opens" },
  { path = "microvms_core::adapters::Adapters::http_backend", reason = "the CLI reaches AWS through src/seam.rs and nothing else, so CLI-2's fake seam sees every door a handler opens" },
