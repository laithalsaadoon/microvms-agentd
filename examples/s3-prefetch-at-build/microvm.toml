# Project config for the S3-prefetch example. `run.sh` passes it with
# `--config`, and `microvm doctor --config` validates the same file through
# the same loader.

# The demo VM only proves the prefetched tree is present, so it takes the
# cheapest floor: a 512 MiB minimum under the always-present 4x ceiling.
# Size your real workload's memory on its own merits — the sizing rule is
# documented in examples/coding-agents-on-bedrock/microvm.toml.
memory = 512

# No egress connector requested, deliberately — that is the demonstration.
# The data this VM reads from /opt/prefetch arrived at image-build time and
# rides the snapshot, so the launched VM needs no outbound network and makes
# no S3 call at all.
#
# `egress = false` is the default restated, and it does NOT seal the VM: the
# platform gives a connector-less VM outbound network anyway, measured three
# times (docs/PLATFORM.md). The run reports `egressPosture: unsealed` for
# exactly that reason. What this demo proves is that no S3 call is NEEDED,
# not that one is impossible.
egress = false
