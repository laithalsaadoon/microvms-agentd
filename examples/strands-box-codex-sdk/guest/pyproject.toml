# SPDX-License-Identifier: Apache-2.0
# The guest's Python environment: the Codex Python SDK, which also installs the matching
# Codex binary (openai-codex-cli-bin). `microvm build --project guest` bakes it into the
# image from uv.lock, so a launch installs nothing. GPT-6.2 Sol needs Codex 0.166.0 or later,
# and from 0.166.0 the app-server calls statfs on its SQLite home at startup, which Strands Box
# answers from v0.2.2 on. The box must not be older than that.
[project]
name = "strands-box-codex-sdk-guest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["openai-codex==0.171.0"]

[tool.uv]
package = false
