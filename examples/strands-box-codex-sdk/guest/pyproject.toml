# SPDX-License-Identifier: Apache-2.0
# The guest's Python environment: the Codex Python SDK, which also installs the matching
# Codex binary (openai-codex-cli-bin). `microvm build --project guest` bakes it into the
# image from uv.lock, so a launch installs nothing.
[project]
name = "strands-box-codex-sdk-guest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["openai-codex==0.162.1"]

[tool.uv]
package = false
