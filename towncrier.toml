# towncrier builds CHANGELOG.md's release sections from the fragments in changelog.d/.
#
# `## Unreleased` used to be one list in CHANGELOG.md that every product PR appended to, so any
# two PRs in flight conflicted there. A fragment is a new file named for its issue and type, so
# two can't. `./scripts/changelog.py` is the one way towncrier runs here (its PEP 723 header
# pins the version): `mise run changelog:check` validates the fragments and holds a branch that
# changes shipped code to adding one, `changelog:draft` prints the next release's section, and
# `release:prepare X.Y.Z` writes it into CHANGELOG.md and removes the fragments. The script's
# docstring has the rules; CONTRIBUTING.md, "Changelog", is the guide.

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
# The marker sits above the newest release, and towncrier writes each release below it.
start_string = "<!-- towncrier release notes start -->\n"
# Keep a Changelog's release heading. The headings written before towncrier put an em dash
# between the version and the date; Keep a Changelog's own format uses a hyphen.
title_format = "## [{version}] - {project_date}"
template = "changelog.d/template.md"
# A fragment holds its entries as the Markdown list items they render as, bold lead and
# two-space continuation included, so a fragment reads exactly as its entries will in
# CHANGELOG.md, and several entries for one issue keep the order their author gave them.
# towncrier's default (`true`) adds the bullet and the indent itself, and orders two fragments
# of one issue and type by directory listing, which differs between filesystems. `wrap` stays
# off, so towncrier keeps the author's line breaks.
all_bullets = false
wrap = false
# A fragment is keyed by an issue number: no orphan fragments (towncrier's `+` prefix) and no
# names for an issue.
issue_pattern = "[1-9][0-9]*"
orphan_prefix = ""
# Set, even empty, so `towncrier build` fails on a file in changelog.d/ that isn't a fragment,
# as `towncrier check` does. towncrier skips the template and `.gitkeep` by name already.
ignore = []

# Keep a Changelog's six types, in its order, which is the order a release lists them in.
[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

# Not a Keep a Changelog type, and never rendered: the fragment a change to shipped code takes
# when no user of the crates, the CLI or the bindings can observe it, such as a test module
# inside `src/` or a lint attribute. Its text says why. It's the explicit form
# of "this PR needs no entry", reviewed like any other file, and the release build removes it
# with the rest.
[[tool.towncrier.type]]
directory = "internal"
name = "Internal"
showcontent = false
