# SPDX-License-Identifier: Apache-2.0
# Accepted findings, each with its reason. An ignore without a reason is a
# finding someone silenced; an ignore with one is a decision someone made.
#
# Scope: MISCONFIGURATION and secret findings only. Dependency-vulnerability
# overrides live in .vex/microvms-agentd.openvex.json (OpenVEX), which trivy
# reads via TRIVY_VEX in CI. See .vex/README.md.
misconfigurations:
  - id: AVD-AWS-0132
    paths:
      - conformance/infra/main.tf
    statement: >-
      The conformance bucket holds a zipped daemon binary and a Dockerfile for
      the minutes a live run takes, then empties. SSE-S3 (AES256) already
      encrypts at rest; a customer-managed KMS key would add key policy,
      rotation, and per-request cost to protect a public repository's build
      artifact. Revisit if the bucket ever carries anything secret.
  - id: AVD-AWS-0132
    paths:
      - examples/background-coding-agent/infra/main.tf
    statement: >-
      The example's job bucket uses SSE-S3 (AES256) at rest, blocks public
      access, and expires objects after 30 days. A customer-managed KMS key
      would add key policy and decrypt grants for both the Lambda role and
      every CLI user to a copy-and-adapt example. Its README tells production
      deployments holding private source to add one.
  - id: AVD-DS-0002
    paths:
      - examples/coding-agents-on-bedrock/Dockerfile
      - examples/code-server-remote-dev/Dockerfile
      - examples/s3-prefetch-at-build/Dockerfile
      - examples/strands-box-codex-sdk/Dockerfile
    statement: >-
      The image's process is agentd, which runs as root in the guest
      deliberately. It demotes each exec to the user a caller names
      (CAP_SETUID, CAP_SETGID), writes uploads into any path
      (CAP_DAC_OVERRIDE), signals workloads of other users (CAP_KILL), and
      repairs the VM's identity once (CAP_SYS_ADMIN). A USER line would start
      agentd with none of those capabilities and break all four jobs, and
      granting them back to a non-root agentd would make it root in effect,
      because CAP_SETUID allows setuid(0). The trust contract
      already treats a token holder and a root workload as the same principal
      (docs/TRUST.md), and the MicroVM, one tenant per Firecracker VM with its
      own kernel, is the isolation boundary for the host. DS-0002's goal, an
      unprivileged workload process, applies to agentd's execs: an exec runs
      as the user its caller names, and as root when it names none. Revisit
      this exception if agentd stops needing to demote execs. The
      strands-box-codex-sdk example also needs root at start to give its
      sandbox a private mount namespace with a fresh /proc before
      vm/launch_in_fresh_proc.py drops to uid 1000.
