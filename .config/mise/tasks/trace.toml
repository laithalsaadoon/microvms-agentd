# The formal requirements, and the traceability matrix that ties them to tests.

["spec:setup"]
description = "Install the optional locked verifier and its checksum-pinned semantic model"
# This tool needs Node 24; keep that requirement local to formal verification so
# the published Node binding continues to be tested at its Node 22 floor.
tools = { node = "24.22.0" }
env = { SYMSPEC_MODEL_DIR = "{{config_root}}/verify/formal/model" }
run = [
  "npm ci --prefix verify/formal --ignore-scripts --no-audit --no-fund",
  "verify/formal/node_modules/.bin/symspec download-model",
]

["spec:check"]
description = "Verify the optional formal wrapper's version and verdict checks without installing it"
run = "uv run --locked pytest -q -p no:cacheprovider tools/test_check_spec.py"

[spec]
description = "Verify the daemon's bootstrap and control-token requirements"
tools = { node = "24.22.0" }
env = { SYMSPEC_MODEL_DIR = "{{config_root}}/verify/formal/model" }
# Optional: run spec:setup first. Error-severity findings fail; strict coverage
# remains a separate policy until every finding has been reconciled.
run = "./tools/check-spec.sh verify/spec/agentd.symspec.json"

["spec:core"]
description = "Verify the client requirements: contradictions, coverage, and reachability"
tools = { node = "24.22.0" }
env = { SYMSPEC_MODEL_DIR = "{{config_root}}/verify/formal/model" }
# Z3 cancellation is cooperative; an explicit reachability timeout is required.
run = "./tools/check-spec.sh verify/spec/core.symspec.json --reachability-timeout-ms 5000"

["trace:check"]
description = "Every traced requirement appears in the model, a Gherkin tag, a fuzz harness and a test that name it, and the code; docs/TRACEABILITY.md is current"
# Offline: ast-grep from `[tools]` reads the Rust and Node tests, stdlib `ast` the Python ones,
# and nothing comes from PyPI. `./tools/check-trace.py --write` regenerates the matrix.
#
# The unit tests run first: they build throwaway trees and run the real parsers over them, so a
# rule that stopped telling a test's doc from a comment fails there before it reads this tree.
run = [
  "uv run --locked pytest -n auto -q -p no:cacheprovider tools/test_check_trace.py",
  "./tools/check-trace.py --check",
]
