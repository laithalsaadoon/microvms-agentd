# The release builds, the publish and tag gates, and the changelog.

[build]
description = "Release build for the shipping target"
run = "cargo build --release -p agentd --target $AGENTD_TARGET"

["build:cli"]
description = "Release build of the `microvm` CLI, for the host"
# NOT `$AGENTD_TARGET`. The daemon cross-compiles to aarch64-musl because it runs *inside*
# the guest; the CLI runs on the operator's machine, so building it for the guest's
# architecture would produce a binary that cannot execute here. Two different answers to
# "which target", because they are two different questions.
#
# Out of `check`'s depends: `cargo clippy --all-targets` in `lint` and `cargo test --all` in
# `test` already compile this crate, so a third build would add ~30s to the gate to produce
# an artifact only the live tier consumes.
run = "cargo build --release -p microvms-cli"

["publish:check"]
description = "The publish set is the intended one and every manifest can upload. Offline"
# In `check` because it costs a `cargo metadata` and catches the class of defect that is
# otherwise found by a release tag: `cargo publish` requires `description`, `license`, a
# `readme` file that exists, keywords within crates.io's limits, and a `version` on every
# path dependency, and nothing in `build`, `test`, or `lint` reads any of that. A tag is the
# worst place to learn it, because crates.io versions are immutable — there is no second
# `0.1.0`.
#
# It also asserts the publish set by equality, so a crate that quietly becomes publishable
# fails here. `agentd` and `agentd-model` are `publish = false` on purpose and a diff that
# flips either one has to say so.
run = "./tools/check-publishable.py"

["release:check"]
description = "Every job in release.yml that publishes waits on the live gate and the release environment. Offline"
# A release is gated on a live run of its tag's draft (`tools/release-gate.py`'s docstring has
# the flow and the rules), and the gate holds only while every publishing job needs it. A job
# that drops it publishes on the tag push again, which nothing else here would notice before a
# tag did. In `check` for `live:check`'s reason: it reads one file, so it costs the same as a
# lint. release.yml's `guard` job runs the same graph check against the tagged commit. The unit
# tests run first, for `trace:check`'s reason.
run = [
  "{{vars.pytest}} --with 'pyyaml==6.0.3' pytest -n auto -q -p no:cacheprovider tools/test_release_gate.py",
  "./tools/release-gate.py graph",
]

["release:tag"]
description = "Create and push a release tag, refusing a reused or stale one. THE way to release"
# `git tag` is not idempotent and its failure is not fatal to a shell sequence: a leftover local
# `v0.1.0` from three weeks earlier made `git tag -a v0.1.0` fail while the following
# `git push origin v0.1.0` succeeded, pushing the OLD tag at a commit predating the crate rename
# and the release workflow. No CI check separates that from a real release — an ancestry test
# passes an old commit on main, and the tag-versus-manifest check passes it too, because every
# version here read `0.1.0` for weeks.
#
# So the control is here, before the tag exists: no reuse local or remote, a clean tree, HEAD at
# main's tip, and `publish:check` against the tag.
run = "./tools/release-tag.sh"

["npm:check"]
description = "The npm package's loader and glibc floor. Needs a built addon"
# Out of `check`, because both gates read build artifacts rather than sources: `index.js` and
# the `.node` files are generated by `napi build` and gitignored, so on a fresh clone there is
# nothing to assert over and a gate that passes on absence is worse than no gate.
#
# `--all-platforms` is deliberately absent here. One `napi build` produces one triple, which is
# what a developer has locally; the release job adds the flag because that is the only place
# all four exist. `ci.yml`'s bindings job runs this same pair.
run = [
  "./tools/check-npm-loader.py",
  "./tools/check-addon-glibc.py bindings/microvms-js",
]

["publish:dry-run"]
description = "Package and verify every publishable crate as if the others were released"
# NOT in `check`, and not for the usual reason. This is the strongest gate in the repo for
# release readiness and it needs the network: `cargo publish --workspace --dry-run` resolves
# against the registry, so `--offline` fails outright with "attempting to make an HTTP
# request". `check` is offline and free, which is what makes it runnable on a plane and
# therefore runnable at all — so this runs in `ci.yml`, beside the other network tiers.
#
# `--workspace` publishes in dependency order (Cargo 1.90+) and verifies the whole set as
# one build, which is the only way the `microvms-core -> microvms-protocol` edge gets checked
# the way a consumer will resolve it rather than through the path dependency.
#
# Needs a COMMITTED tree. `cargo publish` refuses while any tracked file differs from HEAD —
# staged is still dirty — because packaging uncommitted work verifies something that is not in
# the repository. That is invisible in CI, where the checkout is clean by construction, and it
# is the first thing this hits when run from a working branch.
run = "./tools/check-publishable.py --dry-run"

# ── the changelog: fragments in changelog.d/, written into CHANGELOG.md at release ──
#
# CHANGELOG.md's `## Unreleased` was one list that every product PR appended to, so any two in
# flight conflicted there. Each entry is a fragment now, a file of its own, and towncrier
# (towncrier.toml) builds the release's section from them. All three tasks run
# `./tools/changelog.py`, whose PEP 723 header pins towncrier, so they and CI's step run one
# version; the script's docstring has the rules.

["changelog:check"]
description = "Every changelog.d/ fragment is well named and builds, and a branch that changes shipped code adds one. Offline once uv has towncrier"
# In `check` for `ratchet:check`'s reason: it reads the working tree against its merge base with
# origin/main, a local ref, so a branch learns it needs a fragment before a push rather than
# from CI's `security` job, which runs the same command with the pull request's base and
# author. The unit tests run first, for `trace:check`'s reason: they build throwaway repos and
# run the real script over them.
run = [
  "uv run python -m unittest discover -s tools -p 'test_changelog.py'",
  "./tools/changelog.py check",
]

["changelog:draft"]
description = "Print the next release's CHANGELOG.md section from changelog.d/, writing nothing"
run = "./tools/changelog.py draft"

["release:prepare"]
description = "Write changelog.d/ into CHANGELOG.md as release X.Y.Z and remove the fragments (towncrier build), staged for the release PR"
# Before `release:tag`, in the release PR that bumps the versions: the section it writes is the
# one the tag publishes. It refuses a malformed fragment, a version that isn't semver, and a
# build with nothing to render, which is what a second run finds.
run = "./tools/changelog.py build"
