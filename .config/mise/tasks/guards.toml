# The seeded-fault registry, the check that the docs name only tasks, faults,
# paths and jobs that exist, and the check that a pull request's body follows the template.

["agents:check"]
description = "Every task, fault id, path, file, CI job and code name AGENTS.md, CONTRIBUTING.md and the PR template cite exists. Offline"
# AGENTS.md states each rule with the check that holds it (#278), and a rule whose check was
# renamed reads as enforced when nothing enforces it. In `check` for `live:check`'s reason: it
# reads local files and git's index, so it costs the same as a lint. The script's docstring
# says what counts as a reference.
#
# The unit tests run first, for `trace:check`'s reason: they build throwaway repos and run the
# real script over them, so an extractor that stopped matching fails there first.
run = [
  "uv run --locked pytest -n auto -q -p no:cacheprovider tools/test_check_agents_md.py",
  "./tools/check-agents-md.py",
]

["pr-body:check"]
description = "A pull request's body has the template's sections, and a `Size:` line when its product diff is over the soft cap; with no pull request, the template has the sections. Offline"
# The rules for a pull request (CONTRIBUTING.md, "Pull requests") that a script can read. In
# `check` for `agents:check`'s reason, and there, with no pull request event, it holds the
# template to the sections every body needs. CI's `security` job runs it on every event: on a
# pull request the runner's `GITHUB_EVENT_PATH` payload carries the body and the author, and
# `PR_BASE` the base the size is measured against; a push to main has no body, so it reads the
# template. `mise run pr-body:check -- --body <file>` checks a body before the pull request
# exists. The unit tests run first, for `trace:check`'s reason: they build throwaway repos and
# run the real script over them.
run = [
  "uv run --locked pytest -n auto -q -p no:cacheprovider tools/test_check_pr_body.py",
  './tools/check-pr-body.py ${PR_BASE:+--base "$PR_BASE"}',
]

["guards:list"]
description = "Every seeded fault in verify/guards/faults/*.toml still applies, and every Falsification note has an entry or is listed. No builds"
# The cheap half of #274, and the half that runs on every push: it reads the registry, checks
# each transform anchor and patch against the tree, and holds the Falsification notes in the
# tests to verify/guards/faults/*.toml or verify/guards/unregistered.txt, which only shrinks from the merge
# base with origin/main (CI's `GATE_BASE`, as for the ratchet). The script's docstring has the
# rules. ast-grep from `[tools]` reads the Rust and JS tests, stdlib `ast` the Python ones, and
# the base is a local ref, so it's offline.
#
# The unit tests run first, for `trace:check`'s reason: they build throwaway repos with a fake
# runner and drive every verdict through the real script, `fire` included.
run = [
  "uv run --locked pytest -n auto -q -p no:cacheprovider tools/test_check_guards_fire.py",
  './tools/check-guards-fire.py list ${GATE_BASE:+--base "$GATE_BASE"}',
]

["guards:fire"]
description = "Seed each registered fault in a scratch worktree and require its guard to catch it"
# Not in `check`: every entry is one more build with its fault in, and the pre-push hook runs
# `check` on every push. CI's `guards` job runs every suite, bindings included, with
# `--venv-per-worker`. Extra arguments pass through: `mise run guards:fire -- --only
# agentd-fs-pop`. Bindings entries are skipped without `--venv-per-worker` or `--venv DIR`,
# because `maturin develop` installs into whatever environment is active. It builds
# into target/guards-fire, not target/, so a later narrow cargo run never picks up a scratch
# build (the script's docstring has the two ways that went wrong); that's a second build's
# worth of disk.
#
# `-- --jobs N` runs faults in N scratch worktrees at once with the serial run's verdicts
# and output; each extra worker builds in its own target, removed when the run ends, which
# starts as a copy of target/guards-fire's dependency units (never the workspace's own crates).
# `-- --record DIR` traces every run with strace and writes what each entry's verdict read, as
# CI's `guards` job does on every push to main; `-- --reuse DIR` keeps each recorded `fired`
# verdict whose inputs haven't changed since the recorded commit and fires the rest, as it does
# on a pull request. `-- --shard k/N` fires shard k (from 0) of N of the selection, one leg of
# that job's matrix (#345). The script's docstring has all four.
#
# cargo-mutants is here for the `fuzz_extract` exclusion's entry, at the `mutants` task's pin.
tools = { "cargo:cargo-mutants" = "{{vars.cargo_mutants}}" }
run = "./tools/check-guards-fire.py fire"
