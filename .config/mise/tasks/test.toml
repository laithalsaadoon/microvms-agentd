# The Rust tiers, the live suite's offline self-test, and mutation testing.

[test]
description = "All six Rust tiers: unit, model, proptest, turmoil, panic, schema"
depends = ["parity:fixtures"]
run = "cargo test --all"

["parity:fixtures"]
description = "Build the portable peer used by every surface's verified tunnel cases"
run = "cargo build -p microvms-core --example parity-tunnel-peer"

# `test:python` was here: 83 client-library tests against a fake daemon over a real
# loopback socket. The Python tier moved to git history after the Rust port went
# live-green — both suites passed against real AWS on the same commit (Python oracle
# 56/56, Rust CLI 38/38), which is what made the oracle's job finished rather than
# merely duplicated. The Python left in the tree is tooling and binding tests, not a client:
# `conformance/run_rs.py` drives the Rust CLI, the six `tools/` gates read botocore's model,
# the Pricing API, the account, and the pyo3 surface, and `bindings/microvms-py/tests` covers the
# bindings (run in CI against a built wheel, not here — it needs `maturin develop`).
#
# Every one of them is linted by `fmt` and `lint`, which is newly true rather than restated:
# eighteen files are what `ruff.toml` reaches now, against the one file the two ruff lines
# used to see. `./tools/check-lint-coverage.py` prints the count on every run, which is what
# keeps this number from drifting the way the live-suite counts above did.

["conformance:self-test"]
description = "The live suite's own helpers and their negative twins, against a stub CLI. Offline"
# In `check` for `live:check`'s reason: the helpers decide what a live run reports, and a live
# run is the one tier nobody runs every time. A twin such as "eq(None, None) must fail" only
# guards anything if something runs it, and before this task nothing did. uv supplies the
# script's own pinned dependencies; it makes no AWS call.
run = "uv run --script conformance/run_rs.py --self-test"

["mutants:check"]
description = "The mutants wrapper's unit tests, and the skip sites and exclusions it hands cargo-mutants. No builds"
# The cheap half of `mutants`, in `check` and in CI's `security` job. A fake cargo stands in for
# cargo-mutants, and the CI job's own steps run from ci.yml over a throwaway repo, so a broken
# wrapper or step fails here rather than as a green shard that mutated nothing.
run = "uv run --locked pytest -n auto -q -p no:cacheprovider tools/test_check_mutants.py"

["mutmut:check"]
description = "The mutmut ratchet's unit tests: the changed functions, the suites that measure them, the counts and the ratchet. No mutmut run over the tree"
# `mutants:check`'s place for the gate scripts, in `check` and in CI's `security` job. A fake
# mutmut stands in for the real one in all but one case, which runs mutmut over a throwaway suite
# to hold the fake's contract to mutmut's.
run = "uv run --locked pytest -n auto -q -p no:cacheprovider tools/test_check_mutmut.py"

[mutmut]
description = "Mutation-test the functions this branch changes in tools/*.py against origin/main; fails when one has more surviving mutants than on the base"
# CI's `mutmut` job. The script's docstring says what it mutates and how it counts. Not in `check`
# or any hook: each mutant is a run of the tests that call its function, and one function of
# check-ci-parity.py called by most of its suite took 17 minutes at `--jobs 4` on a shared
# devbox under a load average near 70 (f2b386b, 2026-09-30). Arguments after `--` go to the
# script: `mise run mutmut -- --jobs 4 --keep`. Uncommitted and untracked scripts are in what it
# mutates.
run = "./tools/check-mutmut.py"

[mutants]
description = "Mutation-test the Rust this branch changes against origin/main; fails on a mutant its tests miss"
# CI's `mutants` job, unsharded (#275). The wrapper's docstring says what it runs, and
# `.cargo/mutants.toml` holds the settings and the exclusions. Not in `check` or any hook: each
# mutant is a build and a test run, and #283's diff took 7 minutes at `-j 4` on a 16-core
# devbox (67a13cb, 2026-09-28). Arguments after `--` go to the wrapper, and after a second `--` to cargo-mutants:
# `mise run mutants -- -- --shard 1/4 -j 3`. Uncommitted edits to tracked files are in the
# diff it mutates; a new file needs `git add` first.
#
# A per-task tool, for the lychee task's reason: nothing else needs it on a fresh clone. mise
# builds it from source (mise.toml's `[settings]` says why), about three minutes the first
# time. CI builds the same version into its tools cache (`ci:tools`).
tools = { "cargo:cargo-mutants" = "{{vars.cargo_mutants}}" }
run = "./tools/check-mutants.py"

# ── the bindings, built and tested the way they ship ────────────────────────
#
# The binding integration suites run under the toolchains that ship them, which is where
# BIND-2 and BIND-5 live, with tests that go red if the planted bypasses reopen a door.
# Out of `check`, because each builds a
# binding; CI's `bindings` job runs them, and `mise run ci:bindings` runs that job here.

["bindings:py"]
description = "Build the Python binding into .venv-bindings and run its tests"
depends = ["parity:fixtures"]
# `maturin develop` installs into the active environment, so the tests get one of their own,
# made fresh each run.
shell = "bash -e -c"
run = '''
uv venv --python 3.11 --clear -q .venv-bindings
. .venv-bindings/bin/activate
uvx maturin@1.14.1 develop -m bindings/microvms-py/Cargo.toml
uv pip install pytest
pytest bindings/microvms-py/tests -q
'''

["bindings:py-typed"]
description = "The typed consumer against the stub as a caller gets it: built into a wheel, installed into a throwaway venv, and checked with ty"
# A check against the source tree would pass on a stub that never made it into the wheel, which
# is the failure `py.typed` makes invisible. `ty` rather than mypy or pyright: it's Astral's
# checker, so it arrives through uvx with no Node runtime, and it reads `py.typed` and `.pyi` by
# the same PEP 561 rules. Pinned exactly, for a reason its version states: `ty` is pre-1.0, and
# pre-release checkers add diagnostics between patch releases.
shell = "bash -e -c"
run = '''
rm -rf dist-wheel
uvx maturin@1.14.1 build -m bindings/microvms-py/Cargo.toml -o dist-wheel
uv venv --python 3.11 --clear -q .venv-typed
uv pip install --python .venv-typed/bin/python dist-wheel/*.whl
uvx ty@0.0.72 check --python .venv-typed bindings/microvms-py/examples/typed_usage.py
'''

["bindings:js"]
description = "Build the Node addon in place and run its tests"
depends = ["parity:fixtures"]
# `dts` is the build: it also rewrites `index.d.ts`, so run `dts:check` before this, not after.
run = [
  { task = "dts" },
  'node --test "bindings/microvms-js/__test__/*.mjs"',
]

["npm:lambda:build"]
description = "Build the Node addon with the release compiler's glibc floor for Lambda"
# A native Ubuntu build requires a newer glibc than Lambda's Amazon Linux runtime.
# Match the release addon build's compiler and linker before testing that runtime.
tools = { zig = "{{vars.zig}}", "cargo:cargo-zigbuild" = "{{vars.cargo_zigbuild}}" }
shell = "bash -e -c"
run = '''
case "$(uname -m)" in
  aarch64|arm64) lambda_target=aarch64-unknown-linux-gnu ;;
  x86_64) lambda_target=x86_64-unknown-linux-gnu ;;
  *) echo "Lambda smoke requires a Linux arm64 or x86_64 host" >&2; exit 1 ;;
esac
# Activate both tools explicitly when this task runs as another task's dependency.
mise exec zig@{{vars.zig}} cargo:cargo-zigbuild@{{vars.cargo_zigbuild}} -- \
  npx -y -p @napi-rs/cli@3.10.8 napi build --manifest-path Cargo.toml \
  --package microvms-js --platform --release --target "$lambda_target" \
  --cross-compile --output-dir . --cwd bindings/microvms-js
'''

["npm:lambda"]
description = "Load the minimal Node package in the Lambda Node.js 24 runtime without AWS credentials"
depends = ["npm:lambda:build"]
shell = "bash -e -c"
run = '''
case "$(uname -m)" in
  aarch64|arm64) lambda_arch=arm64; lambda_image_arch=arm64 ;;
  x86_64) lambda_arch=x64; lambda_image_arch=x86_64 ;;
  *) echo "Lambda smoke requires a Linux arm64 or x86_64 host" >&2; exit 1 ;;
esac
lambda_stage=$(mktemp -d)
trap 'rm -rf "$lambda_stage"' EXIT
mkdir -p "$lambda_stage/__test__"
cp bindings/microvms-js/index.js bindings/microvms-js/package.json "$lambda_stage/"
cp "bindings/microvms-js/microvms.linux-$lambda_arch-gnu.node" "$lambda_stage/"
cp bindings/microvms-js/__test__/smoke.mjs "$lambda_stage/__test__/"
docker run --rm --network none --read-only --tmpfs /tmp \
  --entrypoint /var/lang/bin/node \
  -e MICROVMS_LAMBDA_SMOKE=1 -e "MICROVMS_LAMBDA_ARCH=$lambda_arch" \
  -e AWS_EC2_METADATA_DISABLED=true -e AWS_CONFIG_FILE=/tmp/no-config \
  -e AWS_SHARED_CREDENTIALS_FILE=/tmp/no-credentials \
  -v "$lambda_stage:/var/task:ro" "public.ecr.aws/lambda/nodejs:24-$lambda_image_arch" \
  --test --test-name-pattern '^Lambda runtime' /var/task/__test__/smoke.mjs
'''
