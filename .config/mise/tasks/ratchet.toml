# The drift ratchet, which fails on drift the merge base doesn't have, and the snapshot of
# the drift that the docs site charts.

["ratchet:check"]
description = "Fail on drift (layering, parity gaps, untraced requirements) the merge base doesn't have, and on a stale decision"
# Drift is the places a driving adapter does work that belongs below it, the parity gaps (#271)
# and the untraced requirements (#295). A pass/fail rule can't say whether that count is
# shrinking, and `tests/thinness.rs` showed it can move drift sideways: it pushed an upload into
# an `aws s3 cp` subprocess it couldn't see. The script collects the drift from the working tree
# and from the merge base's tree, exported from git, and fails on drift the base doesn't have;
# its docstring has the four rules.
#
# In `check` for `model:check`'s reason: `git archive`, `cargo metadata --no-deps --offline` and
# ast-grep over local files, so no network, no credentials, no money. The base is the merge base
# of HEAD and origin/main, a local ref; CI passes the PR's base branch, or HEAD^ on main.
#
# The unit tests run first because they build throwaway workspaces and run both tools over them;
# if a tool changed under the pin, the tests say so before the gate reads the tree through it.
run = [
  "{{vars.pytest}} pytest -n auto -q -p no:cacheprovider tools/test_ratchet.py",
  "./tools/ratchet.py",
]

["ratchet:snapshot"]
description = "Rewrite verify/ratchet/drift.json, the drift snapshot the docs site charts, from the tree"
# Not in `check`, and not part of a change that fixes drift: the check never reads the snapshot,
# so a fix leaves it alone and two fixes can't conflict in it. It's rewritten in a change of its
# own, which is what adds a point to the chart; `./tools/ratchet.py snapshot --check` fails while
# it's stale.
run = "./tools/ratchet.py snapshot"
