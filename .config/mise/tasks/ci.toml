# CI's side: `ci:parity` holds ci.yml to mise.toml's tools and env, and each
# `ci:<job>` runs a CI job here.

["ci:parity"]
description = "ci.yml's env and tool versions match mise.toml's, and ci/local.toml covers every CI step. No builds"
# CI doesn't install mise (D14), so the two files are compared rather than run: ci.yml's
# top-level `env` against mise.toml's `[env]`, and each tool CI installs against the version
# pinned in its `[tools]` (the script's docstring lists them). Offline once uv has the
# script's pinned pyyaml. CI's `security` job runs both commands as steps.
#
# It also holds `ci/local.toml` to the workflows: every `run:` step needs an entry there, so
# `ci:local` (below) runs it or says why not.
#
# The unit tests run first, over fixture ci.yml and mise.toml pairs, so a rule that stopped
# matching fails there before it reads this tree. The runner's tests clone throwaway repos.
run = [
  "{{vars.pytest}} --with 'pyyaml==6.0.3' pytest -n auto -q -p no:cacheprovider tools/test_check_ci_parity.py tools/test_ci_local.py",
  "./tools/check-ci-parity.py",
]

# ── ci:local: CI's Linux jobs, here (#315) ──────────────────────────────────
#
# Each `ci:<job>` task runs that CI job's own `run:` steps, in order, in a clone of a snapshot
# of this worktree shaped like the job's checkout, with the workflow's env. `ci/local.toml` says
# which jobs each task runs and why any step runs differently; `./tools/ci-local.py`'s
# docstring has the rest. `mise run ci:local` runs them all in parallel, each with its own
# target directory, then prints every result and what stays CI-only. `mise run -c ci:local`
# lets the rest finish when one fails.
#
# Not in `check` or any hook (`ci:parity` fails if `check` depends on one): each task builds
# the tree from its own target, and `ci:fuzz` fuzzes for fuzz.yml's full time bounds. It's the
# step before a push. Pass arguments through: `mise run ci:security -- --apply fault.patch`
# runs the job over the snapshot with the patch applied, and the worktree stays as it is.

["ci:rust"]
description = "CI's `rust` job (the ubuntu leg), in a shallow clone of a worktree snapshot"
run = "./tools/ci-local.py rust"

["ci:security"]
description = "CI's `security` job, in a full clone of a worktree snapshot with origin/main"
run = "./tools/ci-local.py security"

["ci:drift"]
description = "CI's `drift` job, in a shallow clone of a worktree snapshot"
run = "./tools/ci-local.py drift"

["ci:bindings"]
description = "CI's `bindings` job, in a shallow clone of a worktree snapshot"
run = "./tools/ci-local.py bindings"

["ci:guards"]
description = "CI's `guards` job on a pull request (the seeded faults it affects), in a full clone of a worktree snapshot with origin/main"
run = "./tools/ci-local.py guards"

["ci:build"]
description = "CI's `build` job (the static aarch64 binary), in a shallow clone of a worktree snapshot"
run = "./tools/ci-local.py build"

["ci:semver"]
description = "CI's `semver` job (the published crates against crates.io), in a shallow clone of a worktree snapshot"
run = "./tools/ci-local.py semver"

["ci:fuzz"]
description = "fuzz.yml's jobs one after another, with its time bounds. Needs a nightly toolchain"
run = "./tools/ci-local.py fuzz"

["ci:local"]
description = "Every ci:<job> task in parallel, then their results and what stays CI-only"
depends = [
  "ci:rust",
  "ci:security",
  "ci:drift",
  "ci:bindings",
  "ci:guards",
  "ci:build",
  "ci:semver",
  "ci:fuzz",
]
run = "./tools/ci-local.py summary"
