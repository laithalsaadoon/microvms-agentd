# The capability table (#271): one row per capability, naming it on each surface or exempting
# that surface with a reason. `mise run parity:check` holds it to the surfaces; the rules and the
# cell forms are in tools/check-parity.py's docstring.
#
# An exemption is a decision with its reason. One with an `issue` would be a parity gap, which
# `parity:check` refuses and the ratchet holds at zero since #280 closed the last one.

# Exhaustive option/type shapes and their cross-surface contract decisions. Observations
# are collected independently; this reviewed file is never regenerated by the check.
inventory = "inventory.json"

[flag_groups]
# Flags that every command attaching a Session shares, and the infra flags every command that
# builds or launches shares. `@connection` in a CLI cell means "any attached command".
connection = ["endpoint", "agent-token", "agent-token-file", "microvm-id", "name", "port", "state-dir", "region", "unlisted-region"]
infra = ["bucket", "build-role-arn", "execution-role-arn", "config", "no-config"]

