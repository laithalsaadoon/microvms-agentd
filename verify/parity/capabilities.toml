# The capability table (#271): one row per capability, naming it on each surface or exempting
# that surface with a reason. `mise run parity:check` holds it to the surfaces; the rules and the
# cell forms are in tools/check-parity.py's docstring.
#
# An exemption with an `issue` is a gap that issue closes, and the ratchet counts it as
# parity-gap drift. One without is a decision. Closing a gap deletes its exemption here.

[flag_groups]
# Flags that every command attaching a Session shares, and the infra flags every command that
# builds or launches shares. `@connection` in a CLI cell means "any attached command".
connection = ["endpoint", "agent-token", "microvm-id", "name", "port", "state-dir", "region", "unlisted-region"]
infra = ["bucket", "build-role-arn", "execution-role-arn", "config", "no-config"]

