# The tunnel's identity keys, BIND-21 here and AGENTD-17 and AGENTD-18 in AGENTD.toml, share their
# model and gherkin waivers, so a change to one is a change to all three. #297's handshake model
# removes the model waiver, and its frame harnesses the fuzz ones.
[BIND-21]
issue = "#297"
waive.model = "#297 adds a stateright model of the tunnel handshake and its pins; until then the handshake and relay tests hold the key"
waive.gherkin = "no Gherkin tier drives the tunnel: its tests speak the WebSocket and Noise wire themselves, which a scenario would only restate"
waive.fuzz = "#297 adds a harness over the client's tunnel frame read"

[BIND-22]
issue = "#297"
waive.model = "one stream read by one parser has no interleavings to explore; its input space is bytes"
waive.gherkin = "hostile bytes aren't a scenario a caller drives; the parser's tests feed it directly"
waive.live = "a live daemon sends well-formed events, so a live run can't present hostile bytes"
