# The COST group's traced requirements. The format and the rules are in tools/check-trace.py.

[COST-1]
issue = "#303"
waive.model = "a rule over values and one pure function of a usage and a pinned rate table, not a state"
waive.gherkin = "no behavior to script: a duration has no unlabelled constructor, and the tests build each label"
waive.fuzz = "the input is a choice of two labels and a number, which the tests enumerate at the boundaries"

