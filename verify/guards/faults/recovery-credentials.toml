# The credential boundary cannot bypass provenance, persist secrets, or leak provider output.
[[family]]
guard = "test_recovery_credentials.py"
run = ["uv", "run", "--locked", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_recovery_credentials.py"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "credential-hosted"
message = "FAIL: test_provenance_or_hosted_failure_prevents_token_and_sts"
transform = { file = "tools/recovery-credentials.py", replace = "environ.get(\"RUNNER_ENVIRONMENT\") == \"github-hosted\"", with = "True" }

[[family.fault]]
id = "credential-provenance"
message = "FAIL: test_provenance_precedes_oidc_sts_and_apply_with_process_local_credentials"
transform = { file = "tools/recovery-credentials.py", replace = "run_child(\"preflight\", args, preflight)", with = "args.report.write_text('{}')" }

[[family.fault]]
id = "credential-unsigned"
message = "FAIL: test_sts_is_unsigned_single_attempt_and_uses_exact_existing_role"
transform = { file = "tools/recovery-credentials.py", replace = "signature_version=UNSIGNED", with = "signature_version=\"v4\"" }

[[family.fault]]
id = "credential-duration"
message = "FAIL: test_sts_is_unsigned_single_attempt_and_uses_exact_existing_role"
transform = { file = "tools/recovery-credentials.py", replace = "DURATION_SECONDS = 3600", with = "DURATION_SECONDS = 1200" }

[[family.fault]]
id = "credential-values"
message = "FAIL: test_invalid_role_region_expiration_or_credential_never_reaches_apply"
transform = { file = "tools/recovery-credentials.py", replace = "child[target] = safe_value(credentials[source], r\"[A-Za-z0-9/+=]+\", 16384)", with = "child[target] = credentials[source]" }

[[family.fault]]
id = "credential-privacy"
message = "FAIL: test_main_never_prints_exception_token_identity_or_child_output"
transform = { file = "tools/recovery-credentials.py", replace = "print(\"recovery: failed\")", with = "print(\"recovery: failed\", \"secret-token\")" }

[[family.fault]]
id = "credential-receipt"
message = "FAIL: test_partial_apply_receipt_survives_only_after_schema_validation"
transform = { file = "tools/recovery-credentials.py", replace = "return VALIDATE_RECEIPT(json.loads(path.read_bytes()))", with = "return json.loads(path.read_bytes())" }

[[family.fault]]
id = "credential-redirect"
message = "FAIL: test_oidc_request_is_bounded_scoped_and_cannot_redirect"
transform = { file = "tools/recovery-credentials.py", replace = "        # The bearer token must never follow a redirect to another authority.\n        raise Refused", with = "        return None" }

[[family.fault]]
id = "credential-partial-receipt"
message = "FAIL: test_partial_apply_receipt_survives_only_after_schema_validation"
transform = { file = "tools/recovery-credentials.py", replace = "if report[\"status\"] == \"failed\":", with = "if False:" }

[[family.fault]]
id = "credential-deadline"
message = "FAIL: test_provenance_precedes_oidc_sts_and_apply_with_process_local_credentials"
transform = { file = "tools/recovery-credentials.py", replace = "deadline = time.monotonic() + 1020", with = "deadline = time.monotonic() + 1200" }

[[family.fault]]
id = "credential-report-grace"
message = "FAIL: test_provenance_precedes_oidc_sts_and_apply_with_process_local_credentials"
transform = { file = "tools/recovery-credentials.py", replace = "REPORT_GRACE_SECONDS = 30", with = "REPORT_GRACE_SECONDS = 0" }

[[family.fault]]
id = "credential-child-capture"
message = "FAIL: test_child_captures_every_stream_and_validates_receipt"
transform = { file = "tools/recovery-credentials.py", replace = "capture_output=True", with = "capture_output=False" }
