# ── the client's event-stream parser (#297) ──────────────────────────────────

# The pending-bytes ceiling removed from `SseParser::feed`: the harness's first flood holds more
# than it. The harness runs for its one-second stable budget and doesn't shrink, so this costs
# about as much as the unit entry below.
[[fault]]
id = "sse-fuzz-ceiling-removed"
guard = "session::sse_fuzz::hostile_stream_bytes_stay_bounded_and_every_event_round_trips"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "session::sse_fuzz::hostile_stream_bytes_stay_bounded_and_every_event_round_trips"]
expect = "test-failed"
suite = "rust"
message = "bytes held, over the 4194304-byte ceiling"
transform = { file = "crates/microvms-app/src/session/sse.rs", replace = "        if self.buffer.len() > MAX_PENDING_BYTES {", with = "        if false {" }

# The same fault under the unit test that has guarded the ceiling since before the harness.
[[fault]]
id = "sse-ceiling-removed"
guard = "session::sse::tests::an_unterminated_stream_is_refused_at_the_pending_ceiling"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "session::sse::tests::an_unterminated_stream_is_refused_at_the_pending_ceiling"]
expect = "test-failed"
suite = "rust"
message = "the buffer passed the ceiling without erroring"
note = "crates/microvms-app/src/session/sse.rs::an_unterminated_stream_is_refused_at_the_pending_ceiling"
transform = { file = "crates/microvms-app/src/session/sse.rs", replace = "        if self.buffer.len() > MAX_PENDING_BYTES {", with = "        if false {" }

# The harness stops naming its key, and BIND-22 loses its fuzz layer.
[[fault]]
id = "trace-sse-fuzz-layer"
guard = "tools/check-trace.py --check"
run = ["./tools/check-trace.py", "--check"]
expect = "exit-nonzero"
suite = "script"
message = "BIND-22 has no fuzz layer"
transform = { file = "crates/microvms-app/src/session/sse_fuzz.rs", replace = "/// **BIND-22.** Hostile stream bytes", with = "/// Hostile stream bytes" }

# #297a review round 1 (the falsifier's faults): a gap that ends before it starts panics the
# decoder, and a scan that doesn't back up misses a terminator split across two feeds. The
# harness used to build neither.
[[family]]
guard = "session::sse_fuzz::hostile_stream_bytes_stay_bounded_and_every_event_round_trips"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "session::sse_fuzz::hostile_stream_bytes_stay_bounded_and_every_event_round_trips"]
expect = "test-failed"
suite = "rust"

[[family.fault]]
id = "sse-fuzz-gap-backwards"
message = "attempt to subtract with overflow"
transform = { file = "crates/microvms-app/src/session/sse.rs", replace = "            Ok(Some(ExecEvent::Gap {\n", with = "            let _span = payload.to - payload.from;\n            Ok(Some(ExecEvent::Gap {\n" }

[[family.fault]]
id = "sse-fuzz-straddle-missed"
message = "BIND-22: the chunks yield each piece's frames"
transform = { file = "crates/microvms-app/src/session/sse.rs", replace = "            let from = self.scanned.saturating_sub(MAX_TERMINATOR_LEN - 1);", with = "            let from = self.scanned;" }
