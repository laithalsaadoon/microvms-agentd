# ── StartRequest's builder (#273) ────────────────────────────────────────────

# The guard is the type: `#[non_exhaustive]` refuses a struct expression outside `protocol`, so a
# client can't pick its own `timeout_sec`, `reap_group_on_exit` or `inherit_image_env`.
[[fault]]
id = "start-request-literal"
guard = "protocol::exec::StartRequest (#[non_exhaustive])"
run = ["cargo", "build", "-p", "microvms-js"]
expect = "compile-error"
suite = "rust"
code = "E0639"
message = "cannot create non-exhaustive struct using struct expression"
transform = { file = "bindings/microvms-js/src/session.rs", replace = "        let mut request =\n            protocol::exec::StartRequest::new(", with = "        let _literal = protocol::exec::StartRequest {\n            exec_id: String::new(),\n            command: Vec::new(),\n            shell: protocol::exec::Shell::Flag(false),\n            cwd: None,\n            env: Default::default(),\n            user: None,\n            group: None,\n            timeout_sec: None,\n            stdin: false,\n            reap_group_on_exit: false,\n            inherit_image_env: false,\n        };\n        let mut request =\n            protocol::exec::StartRequest::new(" }

# The doctest twin that must not build. Run as the crate's whole doctest set, since cargo's
# `--exact` matches no doctest name; the message is rustdoc's own line for a compile_fail that
# compiled.
[[fault]]
id = "start-request-doctest-twin"
guard = "crates/protocol/src/exec.rs - exec::StartRequest (compile_fail twin)"
run = ["cargo", "test", "-p", "microvms-protocol", "--doc"]
expect = "exit-nonzero"
suite = "rust"
message = "Test compiled successfully, but it's marked `compile_fail`"
transform = { file = "crates/protocol/src/exec.rs", replace = "#[derive(Debug, Deserialize, JsonSchema, Serialize)]\n#[non_exhaustive]\npub struct StartRequest {\n", with = "#[derive(Debug, Deserialize, JsonSchema, Serialize)]\npub struct StartRequest {\n" }

[[fault]]
id = "start-request-builder-defaults"
guard = "exec::tests::the_builder_defaults_are_the_ones_serde_gives_an_omitted_field"
run = ["cargo", "test", "-p", "microvms-protocol", "--lib", "--", "--exact", "exec::tests::the_builder_defaults_are_the_ones_serde_gives_an_omitted_field"]
expect = "test-failed"
suite = "rust"
note = "crates/protocol/src/exec.rs::the_builder_defaults_are_the_ones_serde_gives_an_omitted_field"
transform = { file = "crates/protocol/src/exec.rs", replace = "            stdin: false,\n            reap_group_on_exit: false,\n            inherit_image_env: false,\n        }\n    }\n\n    /// Run `command` as a script", with = "            stdin: false,\n            reap_group_on_exit: true,\n            inherit_image_env: false,\n        }\n    }\n\n    /// Run `command` as a script" }
