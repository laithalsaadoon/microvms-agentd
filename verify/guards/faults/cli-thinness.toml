# ── the CLI's thinness scans and seam guards ────────────────────────────────

[[fault]]
id = "thinness-print-macro"
guard = "no_production_code_writes_with_a_print_macro"
run = ["cargo", "test", "-p", "microvms-cli", "--test", "thinness", "--", "--exact", "no_production_code_writes_with_a_print_macro"]
expect = "test-failed"
suite = "rust"
note = "crates/microvms-cli/tests/thinness.rs::no_production_code_writes_with_a_print_macro"
transform = { file = "crates/microvms-cli/src/main.rs", replace = "out.raw(&error.to_string());", with = "print!(\"{error}\");" }

[[fault]]
id = "guards-seam-door"
guard = "guards::thinness::every_aws_command_fails_through_the_seam_and_names_the_door_it_entered"
run = ["cargo", "test", "-p", "microvms-cli", "--bin", "microvm", "--", "--exact", "guards::thinness::every_aws_command_fails_through_the_seam_and_names_the_door_it_entered"]
expect = "test-failed"
suite = "rust"
note = "crates/microvms-cli/src/guards/thinness.rs::every_aws_command_fails_through_the_seam_and_names_the_door_it_entered"
transform = [
  { file = "crates/microvms-cli/src/commands/lifecycle.rs", replace = "    let plane = ctx.seam.control_plane(region).await?;\n    let current = plane.get_microvm(&microvm_id).await?;\n    if current.state != \"RUNNING\" {", with = "    let plane = ControlPlane::new(region).await?;\n    let current = plane.get_microvm(&microvm_id).await?;\n    if current.state != \"RUNNING\" {" },
  { file = "crates/microvms-cli/src/commands/lifecycle.rs", replace = "use std::time::Duration;\n", with = "use std::time::Duration;\n\nuse microvms_core::prelude::ControlPlaneExt as _;\n" },
]

