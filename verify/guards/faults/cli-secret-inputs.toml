[[fault]]
id = "cli-secret-inputs-preserve-values"
guard = "secret_input::tests::file_inputs_preserve_credential_values"
run = ["cargo", "test", "-p", "microvms-cli", "--bin", "microvm", "--", "--exact", "secret_input::tests::file_inputs_preserve_credential_values"]
expect = "test-failed"
suite = "rust"
# The new resolver has no merge-base symbol; keep the read and replace its value.
transform = { file = "crates/microvms-cli/src/secret_input.rs", replace = "*value = Some(read_secret(path, stdin, flag)?);", with = "*value = Some({ let _ = read_secret(path, stdin, flag)?; String::new() });" }

[[fault]]
id = "secret-streams-preserve-values"
guard = "secret_streams_preserve_values_and_report_invalid_input"
run = ["cargo", "test", "-p", "microvms-edges", "--test", "secret_input", "--", "--exact", "secret_streams_preserve_values_and_report_invalid_input"]
expect = "test-failed"
suite = "rust"
# The new helper has no merge-base symbol; preserve compilation and remove its result.
transform = { file = "crates/microvms-edges/src/secret_input.rs", replace = "Ok(value.to_owned())", with = "Ok(String::new())" }

[[fault]]
id = "secret-files-preserve-values"
guard = "private_secret_files_preserve_values_and_refuse_other_sources"
run = ["cargo", "test", "-p", "microvms-edges", "--test", "secret_input", "--", "--exact", "private_secret_files_preserve_values_and_refuse_other_sources"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-edges/src/secret_input.rs", replace = "read_secret(&mut file)", with = "Ok(String::new())" }

[[fault]]
id = "secret-files-refuse-named-pipes"
guard = "secret_files_refuse_named_pipes_without_waiting_for_a_writer"
run = ["cargo", "test", "-p", "microvms-edges", "--test", "secret_input", "--", "--exact", "secret_files_refuse_named_pipes_without_waiting_for_a_writer"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-edges/src/secret_input.rs", replace = "options.custom_flags(libc::O_NONBLOCK);", with = "options.custom_flags(0);" }

