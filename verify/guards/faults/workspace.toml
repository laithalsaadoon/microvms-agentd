# ── core's directory sync pass (#260) ────────────────────────────────────────

[[fault]]
id = "sync-pass-packs-the-whole-tree"
guard = "workspace::tests::a_pass_after_one_edit_uploads_that_member_and_deletes_nothing"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "workspace::tests::a_pass_after_one_edit_uploads_that_member_and_deletes_nothing"]
expect = "test-failed"
suite = "rust"
message = "only the edited member travels"
note = "crates/microvms-app/src/workspace.rs::a_pass_after_one_edit_uploads_that_member_and_deletes_nothing"
transform = { file = "crates/microvms-app/src/workspace.rs", replace = "            let packed = tree.pack_paths(dir, &delta.upload)?;\n", with = "            let whole: Vec<String> = local.files.keys().cloned().collect();\n            let packed = tree.pack_paths(dir, &whole)?;\n" }

[[fault]]
id = "sync-pass-deletes-a-hostile-path"
guard = "workspace::tests::a_hostile_deletion_path_is_refused_not_executed"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "workspace::tests::a_hostile_deletion_path_is_refused_not_executed"]
expect = "test-failed"
suite = "rust"
message = "the rm carries only the deletable path"
note = "crates/microvms-app/src/workspace.rs::a_hostile_deletion_path_is_refused_not_executed"
transform = { file = "crates/microvms-app/src/workspace.rs", replace = "            .filter(|path| deletable(path))\n", with = "            .filter(|path| !path.is_empty())\n" }

[[fault]]
id = "workspace-extract-writes-under-git"
