run = ["cargo", "test", "-p", "microvms-edges", "--lib", "--", "--exact", "workspace::tests::extraction_never_writes_under_the_local_git"]
expect = "test-failed"
suite = "rust"
message = "only the non-git member lands"
note = "crates/microvms-edges/src/workspace.rs::extraction_never_writes_under_the_local_git"
transform = { file = "crates/microvms-edges/src/workspace.rs", replace = ".any(|component| component.as_os_str() == \".git\")", with = ".any(|component| component.as_os_str() == \".git-never\")" }

