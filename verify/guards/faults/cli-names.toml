# ── every `--name` read through core's name rule (#251) ──────────────────────

[[fault]]
id = "names-region-flag-attach"
guard = "guards::names::a_region_flag_that_disagrees_with_the_names_record_is_refused_before_any_door"
run = ["cargo", "test", "-p", "microvms-cli", "--bin", "microvm", "--", "--exact", "guards::names::a_region_flag_that_disagrees_with_the_names_record_is_refused_before_any_door"]
expect = "test-failed"
suite = "rust"
message = "exec: seam-was-refused-a1b2c3: the attach_session door refused"
note = "crates/microvms-cli/src/guards/names.rs::a_region_flag_that_disagrees_with_the_names_record_is_refused_before_any_door"
transform = { file = "crates/microvms-cli/src/commands/attached.rs", replace = "names.resolve(name, explicit_region(region).as_ref())? else {", with = "names.resolve(name, None)? else {" }

