# ── model-conformance: the app's tables driven over the model's rows (#296) ─────

# One row of each app policy changed, and one floor per model: a model that returns no rows
# passes every comparison, so its test fails instead. `cargo test -p agentd-model` stays green
# under every one of these, since the model doesn't depend on the app.

# An inherited workdir refused even when the caller passed one.
[[fault]]
id = "model-conformance-wrap-inherit-ignores-workdir"
guard = "wrap_dockerfile_answers_every_row_of_the_wrap_model"
run = ["cargo", "test", "-p", "model-conformance", "--test", "tables", "--", "--exact", "wrap_dockerfile_answers_every_row_of_the_wrap_model"]
expect = "test-failed"
suite = "rust"
note = "crates/model-conformance/tests/tables.rs::wrap_dockerfile_answers_every_row_of_the_wrap_model"
message = "inherit_workdir: true } answers Wrapped"
transform = { file = "crates/microvms-app/src/control/artifact.rs", replace = "    if opts.inherit_workdir && workdir.is_none() && !dockerfile_declares_workdir(task) {\n", with = "    if opts.inherit_workdir && !dockerfile_declares_workdir(task) {\n" }

# A denied launch reported `unsealed`, as if the advisory deny weren't there.
[[fault]]
id = "model-conformance-posture-deny-unsealed"
guard = "egress_posture_for_answers_every_row_of_the_posture_model"
run = ["cargo", "test", "-p", "model-conformance", "--test", "tables", "--", "--exact", "egress_posture_for_answers_every_row_of_the_posture_model"]
expect = "test-failed"
suite = "rust"
note = "crates/model-conformance/tests/tables.rs::egress_posture_for_answers_every_row_of_the_posture_model"
message = "deny=true reports BestEffort"
transform = { file = "crates/microvms-app/src/control/connector.rs", replace = "    Ok(EgressPosture::for_launch(egress, deny_egress))\n}\n", with = "    Ok(EgressPosture::for_launch(egress, false))\n}\n" }

# The listing sent after the credential chain failed (BIND-16).
[[fault]]
id = "model-conformance-preflight-listing-without-credentials"
guard = "preflight_reports_every_row_of_the_preflight_model"
run = ["cargo", "test", "-p", "model-conformance", "--test", "tables", "--", "--exact", "preflight_reports_every_row_of_the_preflight_model"]
expect = "test-failed"
suite = "rust"
note = "crates/model-conformance/tests/tables.rs::preflight_reports_every_row_of_the_preflight_model"
message = "credentials: false, service: Answers, lines: [Pass, Fatal, NotRun]"
transform = { file = "crates/microvms-app/src/preflight.rs", replace = "        (Ok(plane), true) => service_check(plane).await,\n", with = "        (Ok(plane), _) => service_check(plane).await,\n" }

# A caller that finds the image deleting creates at once, and the service refuses the create.
[[fault]]
id = "model-conformance-plan-deleting-builds"
guard = "the_ensure_plan_is_every_row_of_the_image_model"
run = ["cargo", "test", "-p", "model-conformance", "--test", "tables", "--", "--exact", "the_ensure_plan_is_every_row_of_the_image_model"]
expect = "test-failed"
suite = "rust"
note = "crates/model-conformance/tests/tables.rs::the_ensure_plan_is_every_row_of_the_image_model"
message = "the image model's row Deleting force=false plans AwaitAbsent"
transform = { file = "crates/microvms-app/src/control/ensure.rs", replace = "        (Found::Deleting, _) => Plan::AwaitAbsent,\n", with = "        (Found::Deleting, _) => Plan::Build,\n" }

# An exit code wins over the daemon's deadline: a child that traps SIGTERM and exits 0 reads as a success.
[[fault]]
id = "model-conformance-exit-code-over-timed-out"
guard = "posix_exit_code_is_every_row_of_the_run_model"
run = ["cargo", "test", "-p", "model-conformance", "--test", "tables", "--", "--exact", "posix_exit_code_is_every_row_of_the_run_model"]
expect = "test-failed"
suite = "rust"
note = "crates/model-conformance/tests/tables.rs::posix_exit_code_is_every_row_of_the_run_model"
message = "timed_out: true, truncated: false }) None has exit code Some(124)"
transform = { file = "crates/microvms-app/src/session/exec.rs", replace = "                .is_some_and(|outcome| outcome.timed_out)\n", with = "                .is_some_and(|outcome| outcome.timed_out && outcome.exit_code.is_none())\n" }

# A release that answers it has no bundle falls through to SHA256SUMS: the laundering BIND-18 rules out.
[[fault]]
id = "model-conformance-provision-absent-bundle-launders"
guard = "fetch_release_verifies_every_row_of_the_provision_model"
run = ["cargo", "test", "-p", "model-conformance", "--test", "tables", "--", "--exact", "fetch_release_verifies_every_row_of_the_provision_model"]
expect = "test-failed"
suite = "rust"
note = "crates/model-conformance/tests/tables.rs::fetch_release_verifies_every_row_of_the_provision_model"
message = "never consults SHA256SUMS, and fetch_release did"
transform = { file = "crates/microvms-app/src/provision.rs", replace = "        Bundles::Absent(reason) => return Err(absent(tag, bytes, &reason)),\n", with = "        Bundles::Absent(reason) => reason,\n" }

