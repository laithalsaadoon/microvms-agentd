# Review round 1 (#296b). A wrap that leaves the stanza off: the task text and `USER root` are
# still right, so a comparison of those alone passed.
[[fault]]
id = "model-conformance-wrap-drops-stanza"
guard = "wrap_dockerfile_answers_every_row_of_the_wrap_model"
run = ["cargo", "test", "-p", "model-conformance", "--test", "tables", "--", "--exact", "wrap_dockerfile_answers_every_row_of_the_wrap_model"]
expect = "test-failed"
suite = "rust"
message = "ends on the generator's stanza, intact"
transform = { file = "crates/microvms-app/src/control/artifact.rs", replace = "    wrapped.push_str(&stanza);\n    Ok(wrapped)\n", with = "    let _ = &stanza;\n    Ok(wrapped)\n" }

# A row function that stops ranging over one flag (here the advisory deny) still returns rows,
# and the rows it keeps all agree with the app. The pinned count is what fails.
[[family]]
guard = "egress_posture_for_answers_every_row_of_the_posture_model"
run = ["cargo", "test", "-p", "model-conformance", "--test", "tables", "--", "--exact", "egress_posture_for_answers_every_row_of_the_posture_model"]
expect = "test-failed"
suite = "rust"

[[family.fault]]
id = "model-conformance-posture-rows-shrink"
message = "the posture model returned 46 rows, not the 92"
transform = { file = "crates/model/src/posture.rs", replace = "                for deny in [false, true] {\n                    let options = Options {\n", with = "                for deny in [false] {\n                    let options = Options {\n" }

# The posture rows answered at another ceiling than TABLE's: same count, and TABLE's rows are no
# longer among them, which is what `posture::rows()`'s doc says they are.
[[family.fault]]
id = "model-conformance-posture-table-not-in-rows"
message = "isn't among the rows it exposes"
transform = { file = "crates/model/src/posture.rs", replace = "                        deny,\n                        specified(options, WIRE_CEILING),\n", with = "                        deny,\n                        specified(options, WIRE_CEILING - 1),\n" }

# A change to the model the app never followed: a status with both an exit code and a signal
# reads as the signal death. No model property or model table reads that row, so
# `cargo test -p agentd-model` stays green, and so does the app's own restated table, which
# doesn't read the model. Only this test sees the two disagree.
[[fault]]
id = "model-conformance-run-model-drift"
guard = "posix_exit_code_is_every_row_of_the_run_model"
run = ["cargo", "test", "-p", "model-conformance", "--test", "tables", "--", "--exact", "posix_exit_code_is_every_row_of_the_run_model"]
expect = "test-failed"
suite = "rust"
message = "signal: Some(9), timed_out: false, truncated: false }) None has exit code Some(137)"
transform = { file = "crates/model/src/run.rs", replace = "    if status.timed_out {\n        return Some(TIMED_OUT);\n    }\n    match (status.exit_code, status.signal) {\n        (Some(code), _) => Some(code),\n", with = "    if status.timed_out {\n        return Some(TIMED_OUT);\n    }\n    match (status.exit_code, status.signal) {\n        (Some(code), None) => Some(code),\n        (Some(_), Some(signal)) => Some(128 + signal),\n" }
