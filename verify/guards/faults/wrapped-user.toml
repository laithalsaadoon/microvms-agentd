# The additive wrapper cannot compile on the base. Each mutation compiles and
# proves one boundary of builder capture or workload identity selection.

[[fault]]
id = "wrap-user-capture-removed"
guard = "control::artifact::tests::preserving_user_captures_before_root_and_keeps_the_daemon_as_cmd"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "control::artifact::tests::preserving_user_captures_before_root_and_keeps_the_daemon_as_cmd"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-app/src/control/artifact.rs", replace = "        \"RUN [\\\"/agentd\\\", \\\"--capture-image-user\\\"]\\n\",\n", with = "" }

[[fault]]
id = "wrap-user-workdir-dropped"
guard = "control::artifact::tests::preserving_user_keeps_the_requested_workdir"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "control::artifact::tests::preserving_user_keeps_the_requested_workdir"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-app/src/control/artifact.rs", replace = "pub fn wrap_dockerfile_preserving_user(task: &str, opts: &WrapOptions) -> Result<String, Error> {\n    validate_wrap(task, opts)?;\n    let workdir = opts.workdir.as_deref().filter(|dir| !dir.is_empty());", with = "pub fn wrap_dockerfile_preserving_user(task: &str, opts: &WrapOptions) -> Result<String, Error> {\n    validate_wrap(task, opts)?;\n    let workdir = opts.workdir.as_deref().filter(|dir| dir.is_empty());" }

