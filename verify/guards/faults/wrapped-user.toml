# The additive wrapper cannot compile on the base. Each mutation compiles and
# proves one boundary of builder capture or workload identity selection.

[[fault]]
id = "wrap-user-capture-removed"
guard = "control::artifact::tests::preserving_user_captures_before_root_and_keeps_the_daemon_as_cmd"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "control::artifact::tests::preserving_user_captures_before_root_and_keeps_the_daemon_as_cmd"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-app/src/control/artifact.rs", replace = "        \"RUN [\\\"/agentd\\\", \\\"--capture-image-user\\\"]\\n\",\n", with = "" }

[[fault]]
id = "wrap-user-capture-ignored"
guard = "exec_start::tests::captured_numeric_identity_preserves_the_primary_gid_and_explicit_precedence"
run = ["cargo", "test", "-p", "agentd", "--lib", "--", "--exact", "exec_start::tests::captured_numeric_identity_preserves_the_primary_gid_and_explicit_precedence"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/agentd/src/exec_start.rs", replace = "(None, Some(name)) if captured_user =>", with = "(None, Some(name)) if false =>" }

[[fault]]
id = "wrap-user-root-gid"
guard = "exec_start::tests::captured_numeric_identity_preserves_the_primary_gid_and_explicit_precedence"
run = ["cargo", "test", "-p", "agentd", "--lib", "--", "--exact", "exec_start::tests::captured_numeric_identity_preserves_the_primary_gid_and_explicit_precedence"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/agentd/src/exec_start.rs", replace = ".map(|(_, gid)| gid)", with = ".map(|(_, _gid)| 0)" }

[[fault]]
id = "wrap-user-explicit-ignored"
guard = "config::tests::preserved_defaults_honor_explicit_values_and_fail_closed"
run = ["cargo", "test", "-p", "agentd", "--lib", "--", "--exact", "config::tests::preserved_defaults_honor_explicit_values_and_fail_closed"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/agentd/src/config.rs", replace = "    if explicit.is_some() {", with = "    if false {" }

[[fault]]
id = "wrap-user-unsealed-record"
guard = "image_user::tests::a_writable_capture_is_never_a_runtime_default"
run = ["cargo", "test", "-p", "agentd", "--lib", "--", "--exact", "image_user::tests::a_writable_capture_is_never_a_runtime_default"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/agentd/src/image_user.rs", replace = "    if file.metadata()?.mode() & 0o022 != 0 {", with = "    if false {" }

[[fault]]
id = "wrap-user-symlink-record"
guard = "image_user::tests::a_symlink_cannot_select_an_image_user_record"
run = ["cargo", "test", "-p", "agentd", "--lib", "--", "--exact", "image_user::tests::a_symlink_cannot_select_an_image_user_record"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/agentd/src/image_user.rs", replace = ".custom_flags(nix::libc::O_NOFOLLOW)", with = ".custom_flags(0)" }
