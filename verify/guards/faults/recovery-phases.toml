[[family]]
guard = "test_recover_live_inventory.py"
run = ["uv", "run", "--locked", "pytest", "-q", "-p", "no:cacheprovider", "tools/test_recover_live_inventory.py::test_image_phase_preserves_full_inventories_without_observing_versions"]
expect = "exit-nonzero"
suite = "script"
[[family.fault]]
id = "recovery-image-phase-observation"
message = "test_image_phase_preserves_full_inventories_without_observing_versions"
transform = { file = "tools/recover-live.py", replace = "    if image_phase:\n        return plan, (images, vms, groups)", with = "    if False:\n        return plan, (images, vms, groups)" }

[[family]]
guard = "test_recover_live_inventory.py"
run = ["uv", "run", "--locked", "pytest", "-q", "-p", "no:cacheprovider", "tools/test_recover_live_inventory.py::test_unknown_logging_stops_logs_after_confirmed_image_absence"]
expect = "exit-nonzero"
suite = "script"
[[family.fault]]
id = "recovery-image-phase-initial"
message = "test_unknown_logging_stops_logs_after_confirmed_image_absence"
transform = { file = "tools/recover-live.py", replace = "    initial, _ = settled_selection(manifest, ownership, api, image_phase=True)", with = "    initial, _ = settled_selection(manifest, ownership, api, image_phase=False)" }

[[family]]
guard = "test_recover_live_inventory.py"
