# CI sets CARGO_TERM_COLOR=always for every job. Without `--color never` the stand-in's colored
# diagnostics don't match, and PR #314's first CI run failed seven AdapterLintTests on it.
[[fault]]
id = "adapter-lint-colored-output"
guard = "test_ratchet.py"
run = ["env", "CARGO_TERM_COLOR=always", "uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_ratchet.py", "-k", "AdapterLintTests"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_every_adapter_refuses_each_transport_call ("
transform = { file = "tools/test_ratchet.py", replace = "\"--quiet\",\n                \"--color\",\n                \"never\",\n", with = "\"--quiet\",\n" }
