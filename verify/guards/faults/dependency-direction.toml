# ── dependency_direction.rs: the crate graph and verify/arch/placement.toml ─────────

[[fault]]
id = "deps-py-globset"
guard = "each_adapter_depends_on_exactly_its_allowed_set"
run = ["cargo", "test", "-p", "microvms-cli", "--test", "dependency_direction", "--", "--exact", "each_adapter_depends_on_exactly_its_allowed_set"]
expect = "test-failed"
suite = "rust"
note = "crates/microvms-cli/tests/dependency_direction.rs::each_adapter_depends_on_exactly_its_allowed_set"
message = "Outside the set: [\"globset\"]"
transform = { file = "bindings/microvms-py/Cargo.toml", replace = "[dependencies]\n", with = "[dependencies]\nglobset = \"0.4\"\n" }

# The binding keys these tests trace (#306). BIND-1: a binding that depends on a layer below
# core reaches past the composition root. The edges among the four crates in `IN_QUESTION` don't
# see it; the test's member-edge assertion does.
[[fault]]
id = "deps-js-onto-domain"
guard = "each_binding_depends_on_core_and_never_on_the_cli"
run = ["cargo", "test", "-p", "microvms-cli", "--test", "dependency_direction", "--", "--exact", "each_binding_depends_on_core_and_never_on_the_cli"]
expect = "test-failed"
suite = "rust"
message = "microvms-js's crates of ours must be microvms-core"
transform = { file = "bindings/microvms-js/Cargo.toml", replace = "[dependencies]\n", with = "[dependencies]\nmicrovms-domain = { path = \"../../crates/microvms-domain\" }\n" }

# BIND-4: the Node binding's set is the thin wrapper, so a crate that does work of its own fails
# it. `deps-py-globset` above is BIND-3's.
[[fault]]
id = "deps-js-globset"
guard = "each_adapter_depends_on_exactly_its_allowed_set"
run = ["cargo", "test", "-p", "microvms-cli", "--test", "dependency_direction", "--", "--exact", "each_adapter_depends_on_exactly_its_allowed_set"]
expect = "test-failed"
suite = "rust"
message = "microvms-js's direct normal dependencies differ from its set"
transform = { file = "bindings/microvms-js/Cargo.toml", replace = "[dependencies]\n", with = "[dependencies]\nglobset = \"0.4\"\n" }

# The CLI carries placement entries, and this test holds it exactly to its set and them: it's the
# one place the ratchet's placement category is computed. New drift in the CLI fails here, and
# so does an entry whose edge is gone. reqwest is in the lock already, and without its default
# features it brings no crate the lock lacks.
[[fault]]
id = "deps-cli-new-drift"
guard = "each_adapter_depends_on_exactly_its_allowed_set"
run = ["cargo", "test", "-p", "microvms-cli", "--test", "dependency_direction", "--", "--exact", "each_adapter_depends_on_exactly_its_allowed_set"]
expect = "test-failed"
suite = "rust"
message = "Outside the set: [\"reqwest\"]"
transform = { file = "crates/microvms-cli/Cargo.toml", replace = "[dependencies]\n", with = "[dependencies]\nreqwest = { version = \"0.13\", default-features = false }\n" }

[[fault]]
id = "deps-cli-stale-entry"
guard = "each_adapter_depends_on_exactly_its_allowed_set"
run = ["cargo", "test", "-p", "microvms-cli", "--test", "dependency_direction", "--", "--exact", "each_adapter_depends_on_exactly_its_allowed_set"]
expect = "test-failed"
suite = "rust"
message = "Listed but unused: [\"reqwest\"]"
transform = { file = "verify/ratchet/drift.json", replace = "    { \"category\": \"placement\", \"key\": \"microvms-cli -> tar\", \"issue\": 260 },\n", with = "    { \"category\": \"placement\", \"key\": \"microvms-cli -> tar\", \"issue\": 260 },\n    { \"category\": \"placement\", \"key\": \"microvms-cli -> reqwest\", \"issue\": 260 },\n" }

# The records reader's floor: a reader that finds no placement record allows the CLI none of its
# drift, so the CLI's exact set fails naming every recorded crate.
[[fault]]
id = "deps-records-floor"
guard = "each_adapter_depends_on_exactly_its_allowed_set"
run = ["cargo", "test", "-p", "microvms-cli", "--test", "dependency_direction", "--", "--exact", "each_adapter_depends_on_exactly_its_allowed_set"]
expect = "test-failed"
suite = "rust"
message = "Outside the set: [\"const-hex\", \"globset\", \"notify\", \"sha2\", \"tar\"]"
transform = { file = "crates/microvms-cli/tests/dependency_direction.rs", replace = ".filter(|record| record[\"category\"] == \"placement\")", with = ".filter(|record| record[\"category\"] == \"placements\")" }

[[fault]]
id = "deps-record-without-set"
guard = "every_set_and_placement_record_belongs_to_a_crate_held_here"
run = ["cargo", "test", "-p", "microvms-cli", "--test", "dependency_direction", "--", "--exact", "every_set_and_placement_record_belongs_to_a_crate_held_here"]
expect = "test-failed"
suite = "rust"
note = "crates/microvms-cli/tests/dependency_direction.rs::every_set_and_placement_record_belongs_to_a_crate_held_here"
message = "which names microvms-edges, a crate with no set"
transform = { file = "verify/ratchet/drift.json", replace = "    { \"category\": \"placement\", \"key\": \"microvms-cli -> tar\", \"issue\": 260 },\n", with = "    { \"category\": \"placement\", \"key\": \"microvms-cli -> tar\", \"issue\": 260 },\n    { \"category\": \"placement\", \"key\": \"microvms-edges -> reqwest\", \"issue\": 260 },\n" }

[[fault]]
id = "deps-record-in-set"
guard = "every_set_and_placement_record_belongs_to_a_crate_held_here"
run = ["cargo", "test", "-p", "microvms-cli", "--test", "dependency_direction", "--", "--exact", "every_set_and_placement_record_belongs_to_a_crate_held_here"]
expect = "test-failed"
suite = "rust"
message = "already lists clap, so the record allows nothing"
transform = { file = "verify/ratchet/drift.json", replace = "      \"key\": \"microvms-cli -> notify\",\n", with = "      \"key\": \"microvms-cli -> clap\",\n" }

[[fault]]
id = "deps-record-twice"
guard = "every_set_and_placement_record_belongs_to_a_crate_held_here"
run = ["cargo", "test", "-p", "microvms-cli", "--test", "dependency_direction", "--", "--exact", "every_set_and_placement_record_belongs_to_a_crate_held_here"]
expect = "test-failed"
suite = "rust"
message = "records the placement key \"microvms-cli -> tar\" twice"
transform = { file = "verify/ratchet/drift.json", replace = "    { \"category\": \"placement\", \"key\": \"microvms-cli -> tar\", \"issue\": 260 },\n", with = "    { \"category\": \"placement\", \"key\": \"microvms-cli -> tar\", \"issue\": 260 },\n    { \"category\": \"placement\", \"key\": \"microvms-cli -> tar\", \"issue\": 260 },\n" }

[[fault]]
id = "deps-record-shape"
guard = "every_set_and_placement_record_belongs_to_a_crate_held_here"
run = ["cargo", "test", "-p", "microvms-cli", "--test", "dependency_direction", "--", "--exact", "every_set_and_placement_record_belongs_to_a_crate_held_here"]
expect = "test-failed"
suite = "rust"
