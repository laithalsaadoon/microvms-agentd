# at `abort` would refuse a report the caller only wanted warned about.

[[fault]]
id = "py-budget-ignores-the-judgement"
guard = "bindings/microvms-py/tests/test_cost.py::test_a_breach_aborts_only_when_the_caller_said_abort"
