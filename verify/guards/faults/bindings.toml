# `session.spawn()`'s stream rejections keep the code chain (#252). Since #261 the rejections
# are core's (`session/split.rs`) and the binding converts each channel item in `chunk`: a bare
# `napi::Error` there drops the chain, and core's stderr copy, its drive-error text and its two
# sends at once are each put back the way #252 found them.

[[fault]]
id = "js-spawn-gap-code-chain"
guard = "a gap errors both streams by default and names the range to resume from"
run = [
  ["npx", "-y", "-p", "@napi-rs/cli@3", "napi", "build", "--manifest-path", "Cargo.toml", "--package", "microvms-js", "--platform", "--output-dir", ".", "--cwd", "bindings/microvms-js"],
  ["node", "--test", "--test-reporter=tap", "bindings/microvms-js/__test__/process.mjs"],
]
expect = "test-failed"
suite = "bindings"
message = "stdout: the ERR_ code is on the cause"
note = "bindings/microvms-js/__test__/process.mjs::a gap errors both streams by default and names the range to resume from"
transform = { file = "bindings/microvms-js/src/process.rs", replace = "        .map_err(|error| js_async(error).into())\n", with = "        .map_err(|error| napi::Error::new(napi::Status::GenericFailure, error.to_string()))\n" }

