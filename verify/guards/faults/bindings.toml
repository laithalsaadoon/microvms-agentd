# `session.spawn()`'s stream rejections keep the code chain (#252): the gap branch, the drive-error
# branch, and the stderr copy of one rejection each put back a bare `napi::Error`; the rest keep
# the messages and send the two rejections at once.

[[fault]]
id = "js-spawn-gap-code-chain"
guard = "a gap errors both streams by default and names the range to resume from"
run = [
  ["npx", "-y", "-p", "@napi-rs/cli@3", "napi", "build", "--manifest-path", "Cargo.toml", "--package", "microvms-js", "--platform", "--output-dir", ".", "--cwd", "bindings/microvms-js"],
  ["node", "--test", "--test-reporter=tap", "bindings/microvms-js/__test__/process.mjs"],
]
expect = "test-failed"
suite = "bindings"
message = "stdout: the ERR_ code is on the cause"
note = "bindings/microvms-js/__test__/process.mjs::a gap errors both streams by default and names the range to resume from"
transform = { file = "bindings/microvms-js/src/process.rs", replace = "                                    reject_both(\n                                        &out_tx,\n                                        &err_tx,\n                                        microvms_core::Error::wire(\n                                            microvms_core::WireKind::OutputGap,\n                                            message,\n                                        ),\n                                    )\n                                    .await;\n", with = "                                    let _ = out_tx\n                                        .send(Err(napi::Error::new(\n                                            napi::Status::GenericFailure,\n                                            message.clone(),\n                                        )))\n                                        .await;\n                                    let _ = err_tx\n                                        .send(Err(napi::Error::new(\n                                            napi::Status::GenericFailure,\n                                            message,\n                                        )))\n                                        .await;\n" }

