  ["npx", "-y", "-p", "@napi-rs/cli@3", "napi", "build", "--manifest-path", "Cargo.toml", "--package", "microvms-js", "--platform", "--output-dir", ".", "--cwd", "bindings/microvms-js"],
  ["node", "--test", "--test-reporter=tap", "bindings/microvms-js/__test__/parity_cases.mjs"],
]
expect = "test-failed"
suite = "bindings"
message = "cost/estimate-running-and-suspended: ts answered"
transform = { file = "bindings/microvms-js/src/cost.rs", replace = "        suspended_seconds: options.suspended_seconds.unwrap_or(0.0),\n", with = "        suspended_seconds: options.suspended_seconds.map_or(0.0, |_| 0.0),\n" }

# Python registers its exception classes from `ErrorKind::ALL` through `exception_for` (#266): a
# kind the loop misses leaves its class raised but not importable, and `test_errors.py`'s table,
# which names every class, stops importing.

[[fault]]
id = "py-register-skips-a-kind"
guard = "bindings/microvms-py/tests/test_errors.py"
run = [
  ["uvx", "maturin@1.14.1", "develop", "-q", "-m", "bindings/microvms-py/Cargo.toml"],
  ["python", "-m", "pytest", "-q", "-rA", "bindings/microvms-py/tests/test_errors.py"],
]
expect = "exit-nonzero"
suite = "bindings"
message = "has no attribute 'UnexpectedError'"
transform = { file = "bindings/microvms-py/src/errors.rs", replace = "    for kind in ErrorKind::ALL {\n", with = "    for kind in ErrorKind::ALL.into_iter().skip(1) {\n" }

# The wait defaults each binding publishes are core's, and Python's written-out `wait_for_state`
# defaults are held to them (#266): the issue's "change a literal to 301", on the literals left.

[[fault]]
id = "py-wait-for-state-default-301"
guard = "bindings/microvms-py/tests/test_control.py::test_the_lifecycle_wait_defaults_the_signature_states_are_cores"
run = [
  ["uvx", "maturin@1.14.1", "develop", "-q", "-m", "bindings/microvms-py/Cargo.toml"],
  ["python", "-m", "pytest", "-q", "-rA", "bindings/microvms-py/tests/test_control.py::test_the_lifecycle_wait_defaults_the_signature_states_are_cores"],
]
expect = "test-failed"
suite = "bindings"
message = "assert 301.0 == 300.0"
transform = { file = "bindings/microvms-py/src/control.rs", replace = "timeout=300.0, poll_interval=5.0))]", with = "timeout=301.0, poll_interval=5.0))]" }

