  ["uvx", "maturin@1.14.1", "develop", "-q", "-m", "bindings/microvms-py/Cargo.toml"],
  ["python", "-m", "pytest", "-q", "-rA", "bindings/microvms-py/tests/test_cost.py::test_a_breach_aborts_only_when_the_caller_said_abort"],
]
