# napi 3.15+ checks class identity on every feature set (napi-rs#3610), so each proof swaps one
# typed class parameter or receiver for an unchecked JS object and rebuilds the addon.

[[fault]]
id = "js-class-arguments"
guard = "synchronous class arguments require their declared instance type"
run = [
  ["npx", "-y", "-p", "@napi-rs/cli@3.10.9", "napi", "build", "--manifest-path", "Cargo.toml", "--package", "microvms-js", "--platform", "--output-dir", ".", "--cwd", "bindings/microvms-js"],
  ["node", "--test", "--test-reporter=tap", "bindings/microvms-js/__test__/class_identity.mjs"],
]
expect = "test-failed"
suite = "bindings"
transform = { file = "bindings/microvms-js/src/region.rs", replace = "    pub fn equals(&self, other: &Region) -> bool {\n        self.inner == other.inner\n", with = "    pub fn equals(&self, other: napi::bindgen_prelude::Object<'_>) -> bool {\n        use napi::bindgen_prelude::JsObjectValue as _;\n        other.get_named_property::<String>(\"name\").is_ok_and(|name| name == self.inner.as_str())\n" }

[[fault]]
id = "js-async-class-arguments"
guard = "asynchronous class arguments require their declared instance type"
run = [
  ["npx", "-y", "-p", "@napi-rs/cli@3.10.9", "napi", "build", "--manifest-path", "Cargo.toml", "--package", "microvms-js", "--platform", "--output-dir", ".", "--cwd", "bindings/microvms-js"],
  ["node", "--test", "--test-reporter=tap", "bindings/microvms-js/__test__/class_identity.mjs"],
]
expect = "test-failed"
suite = "bindings"
transform = { file = "bindings/microvms-js/src/sandbox.rs", replace = "        region: &Region,\n        retry: Option<crate::control::RetryOptions>,\n    ) -> napi::Result<napi::bindgen_prelude::PromiseRaw<'env, Sandbox>> {\n        let region = region.clone();\n", with = "        region: napi::bindgen_prelude::Object<'env>,\n        retry: Option<crate::control::RetryOptions>,\n    ) -> napi::Result<napi::bindgen_prelude::PromiseRaw<'env, Sandbox>> {\n        use napi::bindgen_prelude::JsObjectValue as _;\n        let name = region.get_named_property::<String>(\"name\")?;\n        let region = Region { inner: name.parse().map_err(|_| napi::Error::from_reason(name))? };\n" }

[[fault]]
id = "js-class-getters"
guard = "native getters require a receiver of their declaring class"
run = [
  ["npx", "-y", "-p", "@napi-rs/cli@3.10.9", "napi", "build", "--manifest-path", "Cargo.toml", "--package", "microvms-js", "--platform", "--output-dir", ".", "--cwd", "bindings/microvms-js"],
  ["node", "--test", "--test-reporter=tap", "bindings/microvms-js/__test__/class_identity.mjs"],
]
expect = "test-failed"
suite = "bindings"
transform = { file = "bindings/microvms-js/src/region.rs", replace = "    pub fn is_measured(&self) -> bool {\n        self.inner.is_measured()\n", with = "    pub fn is_measured(this: napi::bindgen_prelude::This<'_>) -> bool {\n        use napi::bindgen_prelude::JsObjectValue as _;\n        this.get_named_property::<String>(\"name\").is_ok_and(|name| microvms_core::region::MEASURED_REGIONS.contains(&name.as_str()))\n" }
