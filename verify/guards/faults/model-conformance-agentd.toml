# ── model_conformance.rs: the bootstrap and exec model replayed against agentd (#296) ──

# The walk is replayed in slices, each a run of its shortest-first order, so the shortest path a
# daemon fault fails on is slice 0's, and each fault below that seeds the daemon names slice 0.
# The walk's floors, and the check that the slices replay it once, are
# `the_slices_replay_every_walked_path_once`.

# A step the per-state paths never take: every state a removing `Collect` reaches has a shorter
# path, so only the walk's untaken-step paths drive it.
[[fault]]
id = "model-conformance-collect-keeps-acked"
guard = "slice_0_of_the_walk_replays_against_the_daemon"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "slice_0_of_the_walk_replays_against_the_daemon"]
expect = "test-failed"
suite = "rust"
message = "collect_expired removed 0 entries; the model collects 1"
transform = { file = "crates/agentd/src/exec.rs", replace = "            Some(at) => now.duration_since(at) < ttl,\n", with = "            Some(_) => true,\n" }

# The floor: a recorder that records nothing replays nothing and would pass.
[[fault]]
id = "model-conformance-empty-walk"
guard = "the_slices_replay_every_walked_path_once"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "the_slices_replay_every_walked_path_once"]
expect = "test-failed"
suite = "rust"
message = "the walk recorded no path, so nothing was replayed"
transform = { file = "crates/agentd/tests/model_conformance.rs", replace = "accessor().into_iter().map(", with = "accessor().into_iter().filter(|_| false).map(" }

# Without the untaken-step paths the walk skips the removing `Collect`, and the coverage floor
# names it.
[[fault]]
id = "model-conformance-untaken-steps"
guard = "the_slices_replay_every_walked_path_once"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "the_slices_replay_every_walked_path_once"]
expect = "test-failed"
suite = "rust"
message = "the walk never takes [\"collect 200 removed\"]"
transform = { file = "crates/agentd/tests/model_conformance.rs", replace = "    paths.extend(untaken);\n", with = "    drop(untaken);\n" }

# Acking a running exec succeeds and releases its output.
# `exec::tests::acking_a_running_exec_is_a_conflict_not_a_silent_success` catches it too; the
# replay reaches it on the shortest path that acks before the child exits.
[[fault]]
id = "model-conformance-ack-running"
guard = "slice_0_of_the_walk_replays_against_the_daemon"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "slice_0_of_the_walk_replays_against_the_daemon"]
expect = "test-failed"
suite = "rust"
message = "ExecAck(0) }): answered 200 OK; the model's response is 409 Conflict"
transform = { file = "crates/agentd/src/exec.rs", replace = "    if slot.is_none() {\n", with = "    if slot.is_none() && false {\n" }

# Collection takes an exited entry nobody acked. `exec::tests::collection_takes_acked_entries_only`
# catches it too.
[[fault]]
id = "model-conformance-collect-unacked-exited"
guard = "slice_0_of_the_walk_replays_against_the_daemon"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "slice_0_of_the_walk_replays_against_the_daemon"]
expect = "test-failed"
suite = "rust"
message = "collect_expired removed 1 entries; the model collects 0"
transform = { file = "crates/agentd/src/exec.rs", replace = "            Some(at) => now.duration_since(at) < ttl,\n            None => true,\n", with = "            Some(at) => now.duration_since(at) < ttl,\n            None => entry.shared.terminal.try_lock().map_or(true, |terminal| terminal.is_none()),\n" }

# A retried start of an acked id spawns a second child, as if an acked id were free again. Only
# the replay catches this one: every other agentd test passes with it seeded. The phase gives it
# away (Running where the model has Acked) before the spawn count does.
[[fault]]
id = "model-conformance-restart-acked"
guard = "slice_0_of_the_walk_replays_against_the_daemon"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "slice_0_of_the_walk_replays_against_the_daemon"]
expect = "test-failed"
suite = "rust"
message = "the model's is Acked"
transform = { file = "crates/agentd/src/exec.rs", replace = "    let already_present = state.with_execs(|execs| execs.contains_key(&req.exec_id));\n", with = "    let already_present = state.with_execs(|execs| execs.get(&req.exec_id).is_some_and(|entry| entry.acked_at.is_none()));\n" }

# A retried start of a running id spawns a second child and replaces the entry: the common
# retry, a client that timed out while its child is still up. Nothing the daemon answers
# changes, so only the spawn count shows it, and no other agentd test fails with it seeded
# (`exec::tests::a_retried_start_does_not_spawn_a_second_child` retries after the exit).
[[fault]]
id = "model-conformance-restart-running"
guard = "slice_0_of_the_walk_replays_against_the_daemon"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "slice_0_of_the_walk_replays_against_the_daemon"]
expect = "test-failed"
suite = "rust"
note = "crates/agentd/tests/model_conformance.rs::slice_0_of_the_walk_replays_against_the_daemon"
message = "spawned 2 children; the model spawned 1"
transform = { file = "crates/agentd/src/exec.rs", replace = "    let already_present = state.with_execs(|execs| execs.contains_key(&req.exec_id));\n", with = "    let already_present = state.with_execs(|execs| execs.get(&req.exec_id).is_some_and(|entry| entry.acked_at.is_some() || entry.shared.terminal.try_lock().map_or(true, |terminal| terminal.is_some())));\n" }

# AGENTD-1 on the daemon: a control request presenting a token before bootstrap answers 401,
# not 503. `turmoil_transport::an_unbootstrapped_daemon_answers_503_and_a_bad_token_answers_401`
# catches it too; this entry is what shows the replay reaches auth.
[[fault]]
id = "model-conformance-auth-before-bootstrap"
guard = "slice_0_of_the_walk_replays_against_the_daemon"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "slice_0_of_the_walk_replays_against_the_daemon"]
expect = "test-failed"
suite = "rust"
message = "answered 401 Unauthorized; the model's response is 503 Service Unavailable"
transform = { file = "crates/agentd/src/auth.rs", replace = "            None => Some(StatusCode::SERVICE_UNAVAILABLE),\n", with = "            None => Some(StatusCode::UNAUTHORIZED),\n" }

# The issue's own example: a second `/run` with a differing token replaces the installed one.
# `state::tests::identical_replay_succeeds_and_a_different_token_conflicts` catches it too;
# this entry is what shows the replay reaches the hook.
[[fault]]
id = "model-conformance-hook-replaces-token"
guard = "slice_0_of_the_walk_replays_against_the_daemon"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "slice_0_of_the_walk_replays_against_the_daemon"]
expect = "test-failed"
suite = "rust"
message = "answered 200 OK; the model's response is 409 Conflict"
transform = { file = "crates/agentd/src/state.rs", replace = "                } else {\n                    Bootstrap::Conflict\n                }\n", with = "                } else {\n                    *slot = Some(presented.to_vec());\n                    Bootstrap::Installed\n                }\n" }

# A slice start that skips the walk's first path, so no test replays it. Every slice test stays
# green.
[[fault]]
id = "model-conformance-slice-gap"
guard = "the_slices_replay_every_walked_path_once"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "the_slices_replay_every_walked_path_once"]
expect = "test-failed"
suite = "rust"
message = "paths [0] are in no slice"
transform = { file = "crates/agentd/tests/model_conformance.rs", replace = "        if before * SLICES >= states * k {\n", with = "        if before * SLICES > states * k {\n" }

# Each slice starts one path early, so a path at each cut is replayed twice.
[[fault]]
id = "model-conformance-slice-overlap"
guard = "the_slices_replay_every_walked_path_once"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "the_slices_replay_every_walked_path_once"]
expect = "test-failed"
suite = "rust"
note = "crates/agentd/tests/model_conformance.rs::the_slices_replay_every_walked_path_once"
message = "paths are in more than one slice"
transform = { file = "crates/agentd/tests/model_conformance.rs", replace = "    slice_start(paths, k)..slice_start(paths, k + 1)\n", with = "    slice_start(paths, k).saturating_sub(1)..slice_start(paths, k + 1)\n" }

# A slice test that replays another's slice: the partition is whole, but the last slice's paths
# run in no test and the one before's in two.
[[fault]]
id = "model-conformance-slice-unwired"
guard = "the_slices_replay_every_walked_path_once"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "the_slices_replay_every_walked_path_once"]
expect = "test-failed"
suite = "rust"
message = "slices [7] are replayed by no test"
transform = { file = "crates/agentd/tests/model_conformance.rs", replace = "    replay_slice(7).await;\n", with = "    replay_slice(6).await;\n" }

# The wiring check on empty input: a source with no tests replays no slice, and says so.
[[fault]]
id = "model-conformance-slices-empty-source"
guard = "the_slices_replay_every_walked_path_once"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "the_slices_replay_every_walked_path_once"]
expect = "test-failed"
suite = "rust"
message = "no test in this file calls `replay_slice`"
transform = { file = "crates/agentd/tests/model_conformance.rs", replace = "syn::parse_str(include_str!(\"model_conformance.rs\"))", with = "syn::parse_str(\"\")" }

# A slice's own floor: truncating division puts every path in the last slice, which the
# partition check accepts, and a slice with nothing to replay would pass.
[[fault]]
id = "model-conformance-empty-slice"
guard = "slice_0_of_the_walk_replays_against_the_daemon"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "slice_0_of_the_walk_replays_against_the_daemon"]
expect = "test-failed"
suite = "rust"
message = "slice 0 holds no path, so it replays nothing"
transform = { file = "crates/agentd/tests/model_conformance.rs", replace = "        if before * SLICES >= states * k {\n", with = "        if before >= k / SLICES * states {\n" }

# The key floor: a model property that loses its key leaves the replay's claim with nothing
# to back it, and trace:check can't see that while the key isn't traced in verify/spec/traced/.
[[fault]]
id = "model-conformance-unkeyed-property"
guard = "the_keys_the_replay_backs_name_safety_properties_of_the_model"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "the_keys_the_replay_backs_name_safety_properties_of_the_model"]
expect = "test-failed"
suite = "rust"
note = "crates/agentd/tests/model_conformance.rs::the_keys_the_replay_backs_name_safety_properties_of_the_model"
message = "no safety property of the model is named for [\"AGENTD-1\"]"
transform = { file = "crates/model/src/lib.rs", replace = "                \"AGENTD-1 control API is closed before bootstrap\",\n", with = "                \"control API is closed before bootstrap\",\n" }

# The key floor's own floor: a model that states no property backs no key, and says so.
[[fault]]
id = "model-conformance-no-properties"
guard = "the_keys_the_replay_backs_name_safety_properties_of_the_model"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "the_keys_the_replay_backs_name_safety_properties_of_the_model"]
expect = "test-failed"
suite = "rust"
message = "the model states no property, so no key can be checked against it"
transform = { file = "crates/agentd/tests/model_conformance.rs", replace = "deployment_invariant_held()).properties();\n", with = "deployment_invariant_held()).properties().into_iter().take(0).collect::<Vec<_>>();\n" }

# A test's doc claims a key for the trace that no model property backs. check-trace.py credits
# the test layer from that doc, so the key check has to read the same doc, not a list beside it.
[[fault]]
id = "model-conformance-doc-claims-unbacked-key"
guard = "the_keys_the_replay_backs_name_safety_properties_of_the_model"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "the_keys_the_replay_backs_name_safety_properties_of_the_model"]
expect = "test-failed"
suite = "rust"
message = "no safety property of the model is named for [\"AGENTD-5\"]"
transform = { file = "crates/agentd/tests/model_conformance.rs", replace = "/// It's the daemon's side of AGENTD-1:", with = "/// It's the daemon's side of AGENTD-1 and AGENTD-5:" }

# The key check on empty input: a source with no tests claims no key, and says so.
[[fault]]
id = "model-conformance-keys-empty-source"
guard = "the_keys_the_replay_backs_name_safety_properties_of_the_model"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "the_keys_the_replay_backs_name_safety_properties_of_the_model"]
expect = "test-failed"
suite = "rust"
message = "no test in this file claims a requirement key"
transform = { file = "crates/agentd/tests/model_conformance.rs", replace = "syn::parse_file(include_str!(\"model_conformance.rs\"))", with = "syn::parse_file(\"\")" }

# The key check with a parser that returns nothing.
[[fault]]
id = "model-conformance-keys-no-items"
guard = "the_keys_the_replay_backs_name_safety_properties_of_the_model"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "the_keys_the_replay_backs_name_safety_properties_of_the_model"]
expect = "test-failed"
suite = "rust"
message = "no test in this file claims a requirement key"
transform = { file = "crates/agentd/tests/model_conformance.rs", replace = "claims(&source.items, ", with = "claims(&source.items[..0], " }
