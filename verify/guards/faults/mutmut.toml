# ── mutmut: the ratchet over the gate scripts' changed functions ───────────────
# Each entry breaks one rule of tools/check-mutmut.py and runs its unit suite, whose throwaway
# repos hand the gate a fake mutmut's verdicts (and, for the hashes, the real mutmut's).

# The ratchet itself: a changed function whose survivors grow reads as a pass.
[[fault]]
id = "mutmut-growth-passes"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_a_function_whose_survivors_grow_fails_and_shows_each"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_function_whose_survivors_grow_fails_and_shows_each ("
transform = { file = "tools/check-mutmut.py", replace = "            more = held and len(head.counted) > before\n", with = "            more = False\n" }

# The floor: a run that wrote no results reads as a script with nothing to mutate.
[[fault]]
id = "mutmut-missing-results-pass"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_no_results_from_a_run_that_passed_fails"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_no_results_from_a_run_that_passed_fails ("
transform = { file = "tools/check-mutmut.py", replace = "        data = json.loads(meta.read_bytes())\n", with = "        data = json.loads(meta.read_bytes()) if meta.exists() else {\"exit_code_by_key\": {}}\n" }

# Results that name another module's mutants read as this script's.
[[fault]]
id = "mutmut-stray-results-pass"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_results_that_name_another_modules_mutants_fail"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_results_that_name_another_modules_mutants_fail ("
transform = { file = "tools/check-mutmut.py", replace = "    if strays:\n", with = "    if False:\n" }

# A mutant the run never finished reads as one of the statuses mutmut gives a verdict.
[[fault]]
id = "mutmut-no-verdict-counts"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_a_mutant_the_run_left_without_a_verdict_fails"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_mutant_the_run_left_without_a_verdict_fails ("
transform = { file = "tools/check-mutmut.py", replace = "        if code in UNREAD:\n", with = "        if False:\n" }

# The sentinel: hashes that aren't mutmut's make the changed functions read here not the ones
# mutmut mutates. The case that holds them to mutmut's own function sees it.
[[fault]]
id = "mutmut-hashes-not-mutmuts"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_function_hashes_are_mutmuts"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_function_hashes_are_mutmuts ("
transform = { file = "tools/check-mutmut.py", replace = "DUMP = {\"annotate_fields\": False}\n", with = "DUMP = {\"annotate_fields\": True}\n" }

# A pragma with no reason passes.
[[fault]]
id = "mutmut-pragma-reason-unchecked"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_each_changed_scripts_bare_pragma_fails_before_mutmut_runs"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_each_changed_scripts_bare_pragma_fails_before_mutmut_runs ("
transform = { file = "tools/check-mutmut.py", replace = "        and not REASONED.search(token.string)\n", with = "        and False\n" }

# A pathspec that matches nothing: every change reads as no script changed, and CI's first step
# answers `false`.
[[fault]]
id = "mutmut-scripts-pathspec-empty"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_the_jobs_steps_ask_the_script_and_run_it_as_these_cases_do"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_the_jobs_steps_ask_the_script_and_run_it_as_these_cases_do ("
transform = { file = "tools/check-mutmut.py", replace = "SCRIPTS = \":(glob)tools/*.py\"\n", with = "SCRIPTS = \":(glob)tools/*.pyx\"\n" }

# A suite that stops loading its script under mutmut's name stops the script's measurement, and
# that reads as a script nothing measures.
[[fault]]
id = "mutmut-dropped-suite-passes"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_a_suite_that_stops_naming_its_script_fails"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_suite_that_stops_naming_its_script_fails ("
transform = { file = "tools/check-mutmut.py", replace = "        elif script.base_suites:\n", with = "        elif False:\n" }

# An exit code mutmut doesn't name reads as a caught mutant instead of a count that can't be read.
[[fault]]
id = "mutmut-unnamed-code-caught"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_an_exit_code_mutmut_doesnt_name_fails"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_an_exit_code_mutmut_doesnt_name_fails ("
transform = { file = "tools/check-mutmut.py", replace = "        if code not in STATUS and -code not in SIGNALS:\n", with = "        if False:\n" }

# Each run mutated every function of the script: check-guards-fire.py's mutated copy came to 40
# MB, and mutmut took 22 minutes to write it for a run that tested one function's mutants.
[[fault]]
id = "mutmut-unchanged-functions-mutated"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_the_real_mutmut_counts_an_untested_change_and_agrees_on_the_hashes"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_the_real_mutmut_counts_an_untested_change_and_agrees_on_the_hashes ("
transform = { file = "tools/check-mutmut.py", replace = "                    starts.add(node.lineno)\n", with = "                    pass\n" }

# The sentinel of the marking: the changed function marked instead, so mutmut writes no mutant of
# it and its count reads as none.
[[fault]]
id = "mutmut-changed-function-marked"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_the_real_mutmut_counts_an_untested_change_and_agrees_on_the_hashes"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_the_real_mutmut_counts_an_untested_change_and_agrees_on_the_hashes ("
transform = { file = "tools/check-mutmut.py", replace = "if cls else f\"x_{node.name}\") not in keep:\n", with = "if cls else f\"x_{node.name}\") in keep:\n" }

# A suite that runs its script from another directory fails mutmut's stats pass.
[[fault]]
id = "mutmut-stats-mark-reaches-children"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_a_suite_that_runs_its_script_from_another_directory_is_measured"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_suite_that_runs_its_script_from_another_directory_is_measured ("
transform = { file = "tools/check-mutmut.py", replace = "    env[\"PYTHONPATH\"] = os.pathsep.join(\n", with = "    env[\"UNUSED\"] = os.pathsep.join(\n" }

# A suite's state from one pass reaches the next.
[[fault]]
id = "mutmut-pass-state-shared"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_a_suites_state_doesnt_outlive_a_pass"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_suites_state_doesnt_outlive_a_pass ("
transform = { file = "tools/check-mutmut.py", replace = "process_isolation = forkserver\n", with = "" }

# mutmut's stop when no test reached a mutant reads as a failed run.
[[fault]]
id = "mutmut-none-reached-fails"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_a_base_no_in_process_test_reached_holds_the_head_to_no_count"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_base_no_in_process_test_reached_holds_the_head_to_no_count ("
transform = { file = "tools/check-mutmut.py", replace = "    stopped = NONE_REACHED.encode() in ", with = "    stopped = False and NONE_REACHED.encode() in " }

# A base no in-process test reached reads as a count of none, so the change that adds the first
# such test fails for what it leaves alive.
[[fault]]
id = "mutmut-unreached-base-counts"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_a_base_no_in_process_test_reached_holds_the_head_to_no_count"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_base_no_in_process_test_reached_holds_the_head_to_no_count ("
transform = { file = "tools/check-mutmut.py", replace = "            elif base and base.total and base.unreached == base.total:\n", with = "            elif False:\n" }

# The base measures every changed function it has, including the ones none survives in.
[[fault]]
id = "mutmut-base-for-every-function"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_a_changed_function_none_survives_in_isnt_measured_on_the_base"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_changed_function_none_survives_in_isnt_measured_on_the_base ("
transform = { file = "tools/check-mutmut.py", replace = "                survived := [k for k in s.on_base if heads[(s.change.path, k)].counted]\n", with = "                survived := list(s.on_base)\n" }

# The glob that names only mutants, which leaves mutmut no tests to run clean but every suite.
[[fault]]
id = "mutmut-glob-misses-the-function"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_each_side_mutates_only_the_changed_functions_with_their_suites"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_each_side_mutates_only_the_changed_functions_with_their_suites ("
transform = { file = "tools/check-mutmut.py", replace = "    globs = [f\"{module_name(p)}.{k}*\" for p, keys", with = "    globs = [f\"{module_name(p)}.{k}__mutmut_*\" for p, keys" }

# The mutated script saved as source: every load in every test compiles it again, which made
# #495's stats pass 986 s of test time against 244 s for the plain suite.
[[fault]]
id = "mutmut-mutants-not-precompiled"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_the_suites_load_the_mutated_script_compiled_and_show_reads_its_source"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_the_suites_load_the_mutated_script_compiled_and_show_reads_its_source ("
transform = { file = "tools/check-mutmut.py", replace = "    generate(python, side, wanted)\n", with = "    pass\n" }

# The compiled script left in place after the run, so a survivor's diff reads bytecode.
[[fault]]
id = "mutmut-source-not-restored"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_the_suites_load_the_mutated_script_compiled_and_show_reads_its_source"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_the_suites_load_the_mutated_script_compiled_and_show_reads_its_source ("
transform = { file = "tools/check-mutmut.py", replace = "            source.replace(side / \"mutants\" / path)\n", with = "            pass\n" }

# Mutants that can't be generated read as a script with nothing to mutate.
[[fault]]
id = "mutmut-generation-failure-unchecked"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_mutants_that_cant_be_generated_fail_with_what_was_said"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_mutants_that_cant_be_generated_fail_with_what_was_said ("
transform = { file = "tools/check-mutmut.py", replace = "    if done.returncode:\n", with = "    if False:\n" }

# The budget never stops a run, so a job's wall time follows its mutants.
[[fault]]
id = "mutmut-budget-ignored"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_a_new_functions_survivor_fails_though_the_budget_stopped_the_run"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_new_functions_survivor_fails_though_the_budget_stopped_the_run ("
transform = { file = "tools/check-mutmut.py", replace = "                if late:\n", with = "                if False:\n" }

# A run the budget stopped reads as a failed one, so every big change fails at its budget.
[[fault]]
id = "mutmut-stopped-run-unread"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_a_function_the_budget_left_short_of_its_count_is_undecided_and_named"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_function_the_budget_left_short_of_its_count_is_undecided_and_named ("
transform = { file = "tools/check-mutmut.py", replace = "        if code is None and stopped:\n", with = "        if False:\n" }

# A count the budget left short reads as decided: a partial base count holds a head to it.
[[fault]]
id = "mutmut-undecided-reads-decided"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_more_than_a_partial_base_count_is_undecided"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_more_than_a_partial_base_count_is_undecided ("
transform = { file = "tools/check-mutmut.py", replace = "            if (more and base and base.unrun) or (held and not more and head.unrun):\n", with = "            if False:\n" }

# Every function goes to the first shard, which then measures the whole change alone.
[[fault]]
id = "mutmut-shard-ignores-load"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_the_heaviest_function_goes_to_the_lightest_shard"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_the_heaviest_function_goes_to_the_lightest_shard ("
transform = { file = "tools/check-mutmut.py", replace = "        lightest = load.index(min(load))\n", with = "        lightest = 0\n" }

# Every shard answers that it has something to measure, so each sets up a toolchain for nothing.
[[fault]]
id = "mutmut-detect-ignores-shard"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_the_jobs_steps_ask_the_script_and_run_it_as_these_cases_do"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_the_jobs_steps_ask_the_script_and_run_it_as_these_cases_do ("
transform = { file = "tools/check-mutmut.py", replace = "                k == 0\n", with = "                True\n" }

# A slow run prints nothing until it ends.
[[fault]]
id = "mutmut-progress-silent"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_progress_prints_each_function_as_its_verdicts_arrive"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_progress_prints_each_function_as_its_verdicts_arrive ("
transform = { file = "tools/check-mutmut.py", replace = "                if lines != printed:\n", with = "                if False:\n" }

# mutmut's own per-mutant limit, 15 times its tests' time: one hung mutant of a function the
# whole fire suite reaches held a worker for close to an hour.
[[fault]]
id = "mutmut-timeout-uncapped"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_each_side_mutates_only_the_changed_functions_with_their_suites"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_each_side_mutates_only_the_changed_functions_with_their_suites ("
transform = { file = "tools/check-mutmut.py", replace = "timeout_multiplier = 4\n", with = "" }

# A stats pass that failed over the compiled script isn't run again over the source, so a suite
# that reads its script as text (main's test_check_mutmut.py did) can't be measured.
[[fault]]
id = "mutmut-stats-failure-not-retried"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_a_stats_pass_that_fails_runs_again_over_the_source"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_stats_pass_that_fails_runs_again_over_the_source ("
transform = { file = "tools/check-mutmut.py", replace = "        and STATS_FAILED.encode() in (side / \"mutmut.log\").read_bytes()\n", with = "        and False\n" }

# The base side given the whole budget plus what the head took, rather than what the head left.
[[fault]]
id = "mutmut-base-share-unbounded"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_the_base_gets_what_the_head_left_of_the_budget"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_the_base_gets_what_the_head_left_of_the_budget ("
transform = { file = "tools/check-mutmut.py", replace = "else args.budget - (time.monotonic() - begun)", with = "else args.budget + (time.monotonic() - begun)" }

# A rerun given its side's share plus what the failed run took, rather than what it left.
[[fault]]
id = "mutmut-rerun-share-unbounded"
guard = "test_check_mutmut.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutmut.py", "-k", "test_a_rerun_gets_what_the_failed_run_left_of_the_share"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_rerun_gets_what_the_failed_run_left_of_the_share ("
transform = { file = "tools/check-mutmut.py", replace = "else seconds - (time.monotonic() - begun)", with = "else seconds + (time.monotonic() - begun)" }
