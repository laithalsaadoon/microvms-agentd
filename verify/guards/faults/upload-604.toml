# Upload ownership uses new private helpers, which cannot compile with the entire
# new module reverted. These narrow faults keep the tests compiled while removing
# the individual guarantees; the privileged tier exercises the shipped script.

[[fault]]
id = "upload-604-legacy-root"
guard = "session::upload::tests::root_uploads_remain_direct_and_identity_is_probed_once"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "session::upload::tests::root_uploads_remain_direct_and_identity_is_probed_once"]
expect = "test-failed"
suite = "rust"
note = "crates/microvms-app/src/session/upload.rs::root_uploads_remain_direct_and_identity_is_probed_once"
transform = { file = "crates/microvms-app/src/session/upload.rs", replace = "None => return Ok((ROOT_UID, ROOT_UID)),", with = "None => return Err(Error::invalid_arg(\"missing ownership marker\"))," }

[[fault]]
id = "upload-604-default-install"
guard = "session::upload::tests::nonroot_uploads_stage_then_chown_as_root_then_install_as_default_user"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "session::upload::tests::nonroot_uploads_stage_then_chown_as_root_then_install_as_default_user"]
expect = "test-failed"
suite = "rust"
note = "crates/microvms-app/src/session/upload.rs::nonroot_uploads_stage_then_chown_as_root_then_install_as_default_user"
transform = { file = "crates/microvms-app/src/session/upload.rs", replace = "script(session, &[operation, staging, path], false).await?;", with = "script(session, &[operation, staging, path], true).await?;" }

