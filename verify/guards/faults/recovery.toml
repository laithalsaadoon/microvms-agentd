transform = { file = "tools/recover-live.py", replace = "        report[\"reason\"] = \"interrupted_or_invalid_input\"", with = "        report[\"reason\"] = \"private-secret\"" }

[[family]]
guard = "test_recover_live.py"
run = ["uv", "run", "--locked", "python", "-m", "unittest", "tools.test_recover_live.RecoveryTests.test_deadline_rejects_calls_before_provider_execution"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "recovery-core-deadline"
message = "FAIL: test_deadline_rejects_calls_before_provider_execution"
transform = { file = "tools/recover-live.py", replace = "    def check_time(self) -> None:\n        require(self.clock() < self.deadline, \"deadline\")", with = "    def check_time(self) -> None:\n        require(True, \"deadline\")" }

[[family]]
