run = ["uv", "run", "--locked", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_recover_live_runtime.py"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "recovery-core-cancel-iam"
message = "FAIL: test_duration_observation_exact_role_value_and_interruption"
transform = { file = "tools/recover-live.py", replace = "            except (Refused, InterruptedError):", with = "            except Refused:" }

[[family.fault]]
id = "recovery-core-total-budget"
message = "FAIL: test_total_deadline_includes_successful_provenance_before_aws"
transform = { file = "tools/recover-live.py", replace = "            require(time.monotonic() < deadline, \"deadline\")", with = "            require(True, \"deadline\")" }

[[family.fault]]
id = "recovery-core-inherited-budget"
