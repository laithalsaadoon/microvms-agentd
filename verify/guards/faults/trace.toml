# ── trace:check (#276, #277) ─────────────────────────────────────────────────

[[fault]]
id = "trace-cli9-gherkin"
guard = "tools/check-trace.py --check"
run = ["./tools/check-trace.py", "--check"]
expect = "exit-nonzero"
suite = "script"
message = "trace: CLI-9 has no gherkin layer"
transform = { file = "crates/microvms-cli/tests/features/closed_output.feature", replace = "@CLI-9 @live", with = "@live" }

