# ── trace:check (#276, #277) ─────────────────────────────────────────────────

[[family]]
guard = "tools/check-trace.py --check"
run = ["./tools/check-trace.py", "--check"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "trace-cli9-gherkin"
message = "trace: CLI-9 has no gherkin layer"
transform = { file = "crates/microvms-cli/tests/features/closed_output.feature", replace = "@CLI-9 @live", with = "@live" }

[[family.fault]]
id = "trace-rust-cfg-any"
message = "trace: ARCH-8 has no test layer"
patch = "verify/guards/faults/trace-rust-cfg-any.patch"

# The impl layer leaves the CLI's in-crate guards out: they're test code under `src/`. Read as
# production code, each guard file would join the impl row of every key it mentions.
[[family.fault]]
id = "trace-cli-guards-not-impl"
message = "trace: docs/TRACEABILITY.md is stale"
transform = { file = "tools/check-trace.py", replace = "            or path.is_relative_to(root / CLI_GUARDS)\n", with = "            or False\n" }

[[family.fault]]
id = "trace-node-regex-in-body"
message = "trace: docs/TRACEABILITY.md is stale"
patch = "verify/guards/faults/trace-node-regex-in-body.patch"

[[family.fault]]
id = "trace-python-parametrize"
message = "trace: docs/TRACEABILITY.md is stale"
patch = "verify/guards/faults/trace-python-parametrize.patch"

# #276's H10: with the literal key off every title and docstring, a Node `test.todo` and a
# Python test under `@pytest.mark.skip` still spell IMAGE-5. Neither runs, so neither counts.
[[family.fault]]
id = "trace-never-runs"
message = "trace: IMAGE-5 has no test layer"
patch = "verify/guards/faults/trace-never-runs.patch"

[[family.fault]]
id = "trace-fuzz-file-test-doc"
message = "trace: docs/TRACEABILITY.md is stale"
transform = { file = "crates/microvms-cli/src/closed_output_fuzz.rs", replace = "/// CLI-7, CLI-8, CLI-9: the CLI's", with = "// CLI-7, CLI-8, CLI-9: the CLI's" }

[[family.fault]]
id = "trace-binding-floor"
message = "BINDING_TESTS entry ('bindings/microvms-js/__tests__', '*.mjs') yields no file"
transform = { file = "tools/check-trace.py", replace = "    (\"bindings/microvms-js/__test__\", \"*.mjs\"),\n", with = "    (\"bindings/microvms-js/__tests__\", \"*.mjs\"),\n" }

[[family.fault]]
id = "trace-layer-floor"
message = "the live collector found no requirement key"
transform = { file = "tools/check-trace.py", replace = "results\\.(?:check|eq|absent)\\(", with = "results\\.(?:never)\\(" }

# The live layer reads every module of the suite under conformance/, not only its entry point.
# The floor: an enumeration that yields nothing. The sentinel: a key whose only live check is
# in a lane module stops counting when that check loses its key.
[[family.fault]]
id = "trace-live-suite-floor"
message = "the live collector found no requirement key"
transform = { file = "tools/check-trace.py", replace = "LIVE_SUITE.relative_to(ROOT)).rglob(\"*.py\"))", with = "LIVE_SUITE.relative_to(ROOT)).rglob(\"*.pyx\"))" }

[[family.fault]]
id = "trace-live-lane-key"
message = "trace: AGENTD-10 has no live layer"
transform = { file = "conformance/lanes/exec.py", replace = "\"AGENTD-10 without --inherit-image-env", with = "\"without --inherit-image-env" }

# The traced files in verify/spec/traced/, one per requirement group, and the one loader trace:check and
# the ratchet read them with. Each refusal names its file, seeded on the real files: a key in
# another group's file, a key twice in one file (TOML refuses it) and in two files, an entry of
# another shape, a file named for no group, and the floor, a directory with no group file.
[[family.fault]]
id = "trace-traced-wrong-group"
message = "trace: verify/spec/traced/BIND.toml: STATE-1 isn't in the BIND group"
transform = { file = "verify/spec/traced/BIND.toml", replace = "[BIND-6]\n", with = "[STATE-1]\nissue = \"#302\"\n\n[BIND-6]\n" }

[[family.fault]]
id = "trace-traced-twice-in-one-file"
message = "trace: verify/spec/traced/CLI.toml doesn't parse: Cannot declare ('CLI-8',) twice"
transform = { file = "verify/spec/traced/CLI.toml", replace = "[CLI-8]\nissue = \"#216\"\n", with = "[CLI-8]\nissue = \"#216\"\n\n[CLI-8]\nissue = \"#216\"\n" }

[[family.fault]]
id = "trace-traced-twice-in-two-files"
message = "trace: CLI-7 is listed in more than one file: verify/spec/traced/CLI.toml, verify/spec/traced/IMAGE.toml"
transform = { file = "verify/spec/traced/IMAGE.toml", replace = "[IMAGE-1]\n", with = "[CLI-7]\nissue = \"#216\"\n\n[IMAGE-1]\n" }

[[family.fault]]
id = "trace-traced-malformed"
message = "trace: verify/spec/traced/CLI.toml: CLI-9 is malformed"
transform = { file = "verify/spec/traced/CLI.toml", replace = "[CLI-9]\nissue = \"#216\"\n", with = "[CLI-9]\nissues = \"#216\"\n" }

[[family.fault]]
id = "trace-traced-unknown-group"
message = "trace: verify/spec/traced/COSTS.toml isn't named for a requirement group the specs define"
patch = "verify/guards/faults/trace-traced-unknown-group.patch"

[[family.fault]]
id = "trace-traced-floor"
message = "trace: verify/spec/trace holds no group file, so no requirement is traced"
transform = { file = "tools/check-trace.py", replace = "TRACED_DIR = ROOT / \"verify\" / \"spec\" / \"traced\"\n", with = "TRACED_DIR = ROOT / \"verify\" / \"spec\" / \"trace\"\n" }

[[family.fault]]
id = "trace-keyless-shrinks"
message = "drop it from KEYLESS"
transform = { file = "crates/agentd/fuzz/fuzz_targets/tar_extract.rs", replace = "fuzz_target!(|data: &[u8]| {", with = "/// CLI-7\nfuzz_target!(|data: &[u8]| {" }

# The unit suite's own breaks, one per rule branch #276 added (its report's B rows).
[[family]]
guard = "test_check_trace.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_trace.py"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "trace-unit-js-member-callee"
message = "FAIL: test_a_node_assertion_that_calls_a_test_method_does_not_count ("
transform = { file = "tools/check-trace.py", replace = "_JS_CALLEE = r\"^(?:test|it|describe|suite)(?:\\.only)?$\"", with = "_JS_CALLEE = r\"^(?:[A-Za-z_$][\\w$]*\\.)*(?:test|it|describe|suite)(?:\\.only)?$\"" }

[[family.fault]]
id = "trace-unit-js-skip-todo"
message = "FAIL: test_a_node_test_that_never_runs_does_not_count ("
transform = { file = "tools/check-trace.py", replace = "                {\"not\": _JS_OFF},\n                {\"not\": {\"inside\": {**_JS_OFF, \"stopBy\": \"end\"}}},\n", with = "" }

[[family.fault]]
id = "trace-unit-rust-cfg-off"
message = "FAIL: test_a_rust_test_that_never_runs_does_not_count ("
transform = { file = "tools/check-trace.py", replace = "_OFF = [_in_run({\"regex\": r\"^#\\[\\s*cfg\\s*\\(\", \"not\": {\"regex\": _PLATFORM_CFG}})]", with = "_OFF = []" }

[[family.fault]]
id = "trace-unit-rust-ignored"
message = "FAIL: test_a_rust_test_that_never_runs_does_not_count ("
transform = { file = "tools/check-trace.py", replace = "_TEST_FN = {\"all\": [_runs(*_OFF, *_IGNORED)", with = "_TEST_FN = {\"all\": [_runs(*_OFF)" }

[[family.fault]]
id = "trace-unit-python-decorators"
message = "FAIL: test_a_python_literal_in_a_decorator_does_not_count ("
transform = { file = "tools/check-trace.py", replace = "            if isinstance(decorator, ast.Call) and _marker(decorator, \"req\"):\n                for argument in decorator.args:\n                    if isinstance(argument, ast.Constant) and isinstance(\n                        argument.value, str\n                    ):\n                        keys |= set(patterns.key.findall(argument.value))\n", with = "            keys |= set(patterns.key.findall(ast.unparse(decorator)))\n" }

[[family.fault]]
id = "trace-unit-harness-as-test"
message = "FAIL: test_a_harness_does_not_also_count_for_the_test_layer ("
transform = { file = "tools/check-trace.py", replace = "_TEST_FN = {\"all\": [_runs(*_OFF, *_IGNORED), {\"not\": _CALLS_BOLERO}]}", with = "_TEST_FN = {\"all\": [_runs(*_OFF, *_IGNORED)]}" }

[[family.fault]]
id = "trace-unit-bolero-spelling"
message = "FAIL: test_every_spelling_of_the_bolero_call_is_a_harness ("
transform = { file = "tools/check-trace.py", replace = "r\"^(?:(?:::\\s*)?bolero\\s*::\\s*)?check$\"", with = "r\"^bolero\\s*::\\s*check$\"" }

# A refused traced file fails the run without hiding the rest: each part of that, reverted, fails
# its test.
[[family]]
guard = "test_check_trace.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_trace.py", "-k", "ReadPastRefusals"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "trace-refusal-drops-every-file"
message = "FAIL: test_a_file_that_doesnt_parse_leaves_the_other_files_entries ("
transform = { file = "tools/check-trace.py", replace = "    return {key: kept[key] for key in sorted(kept, key=order)}, problems\n", with = "    return ({} if problems else {key: kept[key] for key in sorted(kept, key=order)}), problems\n" }

[[family.fault]]
id = "trace-refusal-ends-the-run"
message = "FAIL: test_a_refused_file_prints_first_and_the_other_entries_are_still_held ("
transform = { file = "tools/check-trace.py", replace = "    found = collect(patterns)\n    problems = enumerator_floors()", with = "    if refused:\n        return 1\n    found = collect(patterns)\n    problems = enumerator_floors()" }

[[family.fault]]
id = "trace-stale-only-when-clean"
message = "FAIL: test_a_stale_doc_is_reported_beside_another_problem ("
transform = { file = "tools/check-trace.py", replace = "    if args.check and rendered and (not DOC.exists()", with = "    if args.check and rendered and not problems and (not DOC.exists()" }

[[family.fault]]
id = "trace-sentinel-over-a-partial-load"
message = "FAIL: test_the_sentinel_waits_for_a_whole_load ("
transform = { file = "tools/check-trace.py", replace = "    if whole and SENTINEL not in traced:\n", with = "    if SENTINEL not in traced:\n" }

# The threat table's file, emptied, and the sentinel key the traced files always list. The traced
# files and the specs aren't inputs here: a group file that lists nothing is a valid one, and a
# spec is read by the ratchet's collectors too, whose refusals ratchet.toml holds.
[[scanner]]
id = "trace"
guard = "tools/check-trace.py"
run = ["./tools/check-trace.py", "--check"]
suite = "script"
inputs = ["docs/TRUST.md"]
empty = "{input} has no 'Threats and the tests that guard them' section"
sentinel = { file = "verify/spec/traced/CLI.toml", replace = "[CLI-7]\nissue = \"#216\"\n\n", with = "", message = "the sentinel CLI-7 is not in verify/spec/traced/CLI.toml" }
