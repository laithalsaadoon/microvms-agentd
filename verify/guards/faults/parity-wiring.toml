transform = { file = "tools/npx_cache.py", replace = "            fcntl.flock(handle, fcntl.LOCK_EX)\n", with = "            for _ in range(50):\n                try:\n                    fcntl.flock(handle, fcntl.LOCK_EX | fcntl.LOCK_NB)\n                    break\n                except BlockingIOError:\n                    __import__(\"time\").sleep(0.02)\n" }

# A waiter that prints nothing leaves a host-wide stall behind a slow install with no trace in the
# log (#347 review).
[[fault]]
id = "parity-npx-lock-silent-wait"
guard = "test_check_parity.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_parity.py", "-k", "NpxLockTests"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_second_caller_waits_for_the_lock ("
transform = { file = "tools/npx_cache.py", replace = "            print(\n                f\"{who}: waiting for {lock}, held by another npx install\",\n                file=sys.stderr,\n            )\n", with = "            pass\n" }

# The race needs only this package set's directory to be cold, not the whole cache, so a lock
# skipped once `_npx` exists lets it back in (#347 review).
[[fault]]
id = "parity-npx-lock-skipped-when-warm"
guard = "test_check_parity.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_parity.py", "-k", "NpxLockTests"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_typedoc_is_located_with_the_npx_lock_held ("
transform = { file = "tools/npx_cache.py", replace = "    lock = cache / \"microvms-agentd-npx.lock\"\n", with = "    if (cache / \"_npx\").is_dir():\n        yield cache\n        return\n    lock = cache / \"microvms-agentd-npx.lock\"\n" }

