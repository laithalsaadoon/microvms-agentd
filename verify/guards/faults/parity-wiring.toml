# ── wiring the table in (#271): the snapshot's format refusal, the ratchet's parity-gap ─

# The stitcher's format_version refusal through the gate CI runs, beside its unit-tier entry
# `rustdoc-walk-format-version`: a rustdoc whose format the walk wasn't written for is refused
# by name before any path is read.
[[fault]]
id = "core-api-format-version"
guard = "tools/generate-core-api.py"
run = ["./tools/generate-core-api.py", "--check"]
expect = "exit-nonzero"
suite = "script"
message = "and this walk was written for [59]"
transform = { file = "tools/rustdoc_walk.py", replace = "ACCEPTED_FORMAT_VERSIONS = frozenset({60, 61})", with = "ACCEPTED_FORMAT_VERSIONS = frozenset({59})" }

# `--exemptions`, the table-only mode the ratchet reads: an issue it can't read would print as
# null and drop out of the count as a decision.
[[fault]]
