# ── ratchet:check: the merge-base rule, the base, the snapshot, and the category it doesn't collect ─

# Rule 1 on the real tree: a subprocess added to a binding is drift the base doesn't have.
[[fault]]
id = "ratchet-subset-new-drift"
guard = "tools/ratchet.py"
run = ["./tools/ratchet.py", "--base", "HEAD"]
expect = "exit-nonzero"
suite = "script"
message = "new drift: [subprocess] bindings/microvms-py/src/names.rs: std::process::Command::new(\"gh\"). Move the work"
transform = { file = "bindings/microvms-py/src/names.rs", replace = "// SPDX-License-Identifier: Apache-2.0\n", with = "// SPDX-License-Identifier: Apache-2.0\nfn seeded() { std::process::Command::new(\"gh\"); }\n" }

# Drift that leaves passes: a rule that held the two trees equal, refusing what the base has and
# the tree doesn't, would fail the fix that edits nothing else.
[[fault]]
id = "ratchet-subset-removal-passes"
guard = "test_ratchet.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_ratchet.py", "-k", "RuleTests"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_rule_1_drift_that_leaves_passes ("
transform = { file = "tools/ratchet.py", replace = "    return unexplained\n", with = "    return unexplained + vacated\n" }

# A decision taken away (here, re-keyed so it no longer covers its finding) is drift the base
# didn't have, since each tree is measured with its own decisions.
[[fault]]
id = "ratchet-decision-taken-away"
guard = "verify/ratchet/decisions.toml"
run = ["./tools/ratchet.py", "--base", "HEAD"]
expect = "exit-nonzero"
suite = "script"
message = "new drift: [subprocess] crates/microvms-cli/src/commands/doctor.rs: std::process::Command::new(\"terraform\")"
transform = { file = "verify/ratchet/decisions.toml", replace = "key = \"crates/microvms-cli/src/commands/doctor.rs: std::process::Command::new(\\\"terraform\\\")\"\n", with = "key = \"crates/microvms-cli/src/commands/doctor.rs: std::process::Command::new(\\\"terraformed\\\")\"\n" }

# Rule 2 and rule 4 on the real tree: a decision nothing matches, and drift in a category listed
# as enforced.
[[fault]]
id = "ratchet-stale-decision"
guard = "verify/ratchet/decisions.toml"
run = ["./tools/ratchet.py", "--base", "HEAD"]
expect = "exit-nonzero"
suite = "script"
message = "stale decision: [subprocess] crates/agentd/src/exec.rs: Command::new(gone) decides a finding the tree doesn't have"
transform = { file = "verify/ratchet/decisions.toml", replace = "enforced = [\"subprocess\", \"port-impl\", \"adapter-logic\", \"placement\", \"parity-drift\"]\n", with = "enforced = [\"subprocess\", \"port-impl\", \"adapter-logic\", \"placement\", \"parity-drift\"]\n\n[[decision]]\ncategory = \"subprocess\"\nkey = \"crates/agentd/src/exec.rs: Command::new(gone)\"\nreason = \"seeded\"\n" }

[[fault]]
id = "ratchet-enforced-with-drift"
guard = "verify/ratchet/decisions.toml"
run = ["./tools/ratchet.py", "--base", "HEAD"]
expect = "exit-nonzero"
suite = "script"
message = "parity-gap is enforced by tools/check-parity.py refusing an exemption with an issue, once #280 closes the last gap, so it can't carry drift"
transform = { file = "verify/ratchet/decisions.toml", replace = "enforced = [\"subprocess\", \"port-impl\", \"adapter-logic\", \"placement\", \"parity-drift\"]\n", with = "enforced = [\"subprocess\", \"port-impl\", \"adapter-logic\", \"placement\", \"parity-drift\", \"parity-gap\"]\n" }

# The decisions reader's floor: one that read no decision would turn every decided finding into
# drift on both trees and compare them equal.
[[fault]]
id = "ratchet-decisions-floor"
guard = "test_ratchet.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_ratchet.py", "-k", "FileTests"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_the_checked_in_decisions_parse ("
transform = { file = "tools/ratchet.py", replace = "    decisions = data.get(\"decision\", [])\n", with = "    decisions = data.get(\"decisions\", [])\n" }

# A base that can't be read fails rather than reading as a base with nothing in it: on the real
# gate, a ref that names no commit; in the unit test, a tree the collectors refuse.
[[fault]]
id = "ratchet-base-unknown-ref"
guard = "tools/ratchet.py"
run = ["./tools/ratchet.py", "--base", "HEAD"]
expect = "exit-nonzero"
suite = "script"
message = "--base no-such-ref doesn't name a commit"
argv_fault = ["--base", "no-such-ref"]

[[fault]]
id = "ratchet-base-unmeasurable"
guard = "test_ratchet.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_ratchet.py", "-k", "BaseTests"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_base_the_collectors_refuse_fails ("
transform = { file = "tools/ratchet.py", replace = "        except SystemExit as error:\n            raise SystemExit(\n                f\"{label}'s tree can't be measured", with = "        except SystemExit as error:\n            return Base(label, sets, None)\n            raise SystemExit(\n                f\"{label}'s tree can't be measured" }

# The snapshot's check, which the job that rewrites drift.json runs. Seeded in the unit test, not
# on the real file: the real snapshot is stale from any fix until that job rewrites it, and a
# clean run of the check has to pass before a fault means anything.
[[fault]]
id = "ratchet-snapshot-stale"
guard = "test_ratchet.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_ratchet.py", "-k", "SnapshotTests"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_stale_snapshot_fails_its_check ("
transform = { file = "tools/ratchet.py", replace = "    if current != text:\n", with = "    if False:\n" }

# Placement is `HELD`: dependency_direction.rs computes it and holds its decisions to the tree, so
# rule 2 leaves them alone here, and the sentinel doesn't call its collector empty.
[[fault]]
id = "ratchet-held-decisions"
guard = "tools/ratchet.py"
run = ["./tools/ratchet.py", "--base", "HEAD"]
expect = "exit-nonzero"
suite = "script"
message = "stale decision: [placement] microvms-cli -> notify"
transform = { file = "tools/ratchet.py", replace = "    decided = Counter(\n        (d[\"category\"], d[\"key\"])\n        for d in head.decisions[\"decisions\"]\n        if d[\"category\"] not in HELD\n    )\n", with = "    decided = Counter((d[\"category\"], d[\"key\"]) for d in head.decisions[\"decisions\"])\n" }

[[fault]]
id = "ratchet-held-sentinel"
guard = "tools/ratchet.py"
run = ["./tools/ratchet.py", "--base", "HEAD"]
expect = "exit-nonzero"
suite = "script"
message = "sentinel: the placement collector found nothing"
transform = { file = "tools/ratchet.py", replace = "        if category in HELD:\n            continue\n", with = "" }

# What placement is held to here: the base's record. On the real tree, a crate added to a set the
# base has and drift the base doesn't have both fail, with no collector reading a manifest.
[[fault]]
id = "ratchet-placement-set-grew"
guard = "verify/arch/placement.toml"
run = ["./tools/ratchet.py", "--base", "HEAD"]
expect = "exit-nonzero"
suite = "script"
message = "set grew: verify/arch/placement.toml adds reqwest to [microvms-py] normal"
transform = { file = "verify/arch/placement.toml", replace = "normal = [\"microvms-core\", \"microvms-protocol\", \"serde_json\", \"pyo3\", \"tokio\"]", with = "normal = [\"microvms-core\", \"microvms-protocol\", \"serde_json\", \"pyo3\", \"tokio\", \"reqwest\"]" }

[[fault]]
id = "ratchet-placement-drift-grew"
guard = "verify/arch/placement.toml"
run = ["./tools/ratchet.py", "--base", "HEAD"]
expect = "exit-nonzero"
suite = "script"
message = "new drift: [placement] microvms-cli -> reqwest. A crate's drift in verify/arch/placement.toml can only shrink"
transform = { file = "verify/arch/placement.toml", replace = "[microvms-cli]\nnormal = [\"microvms-core\", \"clap\", \"ratatui\", \"serde\", \"serde_json\", \"tokio\", \"toml\", \"unicode-width\"]\n", with = "[microvms-cli]\nnormal = [\"microvms-core\", \"clap\", \"ratatui\", \"serde\", \"serde_json\", \"tokio\", \"toml\", \"unicode-width\"]\n\n[microvms-cli.drift]\nnormal = [\"reqwest\"]\n" }

# port-impl is enforced (#270): with the CLI's copied minter gone, a port implemented in an
# adapter again is drift an enforced category can't carry, and fails on the real tree.
[[fault]]
id = "ratchet-port-impl-cli-minter"
guard = "verify/ratchet/decisions.toml"
run = ["./tools/ratchet.py", "--base", "HEAD"]
expect = "exit-nonzero"
suite = "script"
message = "new drift: [port-impl] crates/microvms-cli/src/seam.rs: TokenMinter for CopiedMinter."
transform = { file = "crates/microvms-cli/src/seam.rs", replace = "/// The region every ARN in a request is derived for.\n", with = "struct CopiedMinter;\n\nimpl microvms_core::session::TokenMinter for CopiedMinter {}\n\n/// The region every ARN in a request is derived for.\n" }

# Rule 1 compares with the merge base of HEAD and `--base`, not the ref's tip: main can move
# past a pull request's merge while its job runs.

[[fault]]
id = "ratchet-base-at-the-tip"
guard = "test_ratchet.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_ratchet.py", "-k", "BaseTests"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_an_explicit_base_is_read_at_its_merge_base_with_head ("
transform = { file = "tools/ratchet.py", replace = "        [\"git\", \"-C\", str(root), \"merge-base\", \"HEAD\", commit.stdout.strip()],\n", with = "        [\"git\", \"-C\", str(root), \"rev-parse\", commit.stdout.strip()],\n" }

# A refusal takes out only the rules that read what it refused, so one bad input doesn't hide a
# finding in another category: each part of that, reverted, fails its test.
[[fault]]
id = "ratchet-collector-refusal-unreads-everything"
guard = "test_ratchet.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_ratchet.py", "-k", "RefusalTests"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_collector_refusal_leaves_the_other_collectors_running ("
transform = { file = "tools/ratchet.py", replace = "            refused.append(Refusal(str(error), frozenset(categories)))\n", with = "            refused.append(Refusal(str(error), EVERY))\n" }

[[fault]]
id = "ratchet-decision-refusal-unreads-everything"
guard = "test_ratchet.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_ratchet.py", "-k", "RefusalTests"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_refused_decision_leaves_only_its_category_unread ("
transform = { file = "tools/ratchet.py", replace = "        own = frozenset([named]) if named in CATEGORIES else EVERY\n", with = "        own = EVERY\n" }

[[fault]]
id = "ratchet-unread-category-held"
guard = "test_ratchet.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_ratchet.py", "-k", "RefusalTests"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_an_unread_category_gets_no_rule_and_the_rest_are_held ("
transform = { file = "tools/ratchet.py", replace = "        if category in skipped:\n            continue\n", with = "" }

[[fault]]
id = "ratchet-refused-placement-holds-rule-3"
guard = "test_ratchet.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_ratchet.py", "-k", "RefusalTests"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_refused_placement_file_skips_rule_3_alone ("
transform = { file = "tools/ratchet.py", replace = "    if \"placement\" in head.unread:\n        return failures\n", with = "" }

[[fault]]
id = "ratchet-summary-counts-unread"
guard = "test_ratchet.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_ratchet.py", "-k", "RefusalTests"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_the_summary_marks_an_unread_category_instead_of_counting_it ("
transform = { file = "tools/ratchet.py", replace = "        if category in head.unread or category in untrusted:\n", with = "        if False:\n" }

[[fault]]
id = "ratchet-sentinel-ends-the-run"
guard = "test_ratchet.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_ratchet.py", "-k", "RefusalTests"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_sentinel_failure_is_printed_first_and_the_tree_is_still_held ("
transform = { file = "tools/ratchet.py", replace = "        if args.command == \"snapshot\":\n            return 1\n    head = read_tree(REPO)\n", with = "        return 1\n    head = read_tree(REPO)\n" }

# The base is still measured whole: a refused category there would compare as having no drift.
[[fault]]
id = "ratchet-base-read-in-part"
guard = "test_ratchet.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_ratchet.py", "-k", "BaseTests"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_base_the_collectors_refuse_fails ("
transform = { file = "tools/ratchet.py", replace = "    if tree.refused:\n        raise SystemExit(tree.refused[0].message)\n", with = "" }
