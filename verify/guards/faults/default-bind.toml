[[fault]]
id = "default-bind-typescript-default"
guard = "tools/check-parity.py"
run = ["./tools/check-parity.py"]
expect = "exit-nonzero"
message = 'ServeOptions.bind defaults to "127.0.0.2:0", but clientDefaults.listener.bindAddress is "127.0.0.1:0"'
suite = "script"
transform = [{ file = "bindings/microvms-js/index.d.ts", replace = "@defaultValue \"127.0.0.1:0\"", with = "@defaultValue \"127.0.0.2:0\"" }]

[[fault]]
id = "default-bind-node-omission"
guard = "omitted listener options resolve to the shared effective default"
run = [["npx", "-y", "-p", "@napi-rs/cli@3.10.8", "napi", "build", "--manifest-path", "Cargo.toml", "--package", "microvms-js", "--platform", "--output-dir", ".", "--cwd", "bindings/microvms-js"], ["node", "--test", "--test-reporter=tap", "--test-name-pattern", "omitted listener options resolve to the shared effective default", "bindings/microvms-js/__test__/serve.mjs"]]
expect = "test-failed"
suite = "bindings"
transform = [{ file = "bindings/microvms-js/src/serve.rs", replace = "bind_address(options.bind.as_deref()).map_err(js_async)?", with = "bind_address(options.bind.as_deref().or(Some(\"127.0.0.2:0\"))).map_err(js_async)?" }]
