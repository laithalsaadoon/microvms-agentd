# SPDX-License-Identifier: Apache-2.0
# Bind declarations and omitted runtime inputs follow the shared listener value.

[[fault]]
id = "default-bind-cli-tunnel-ownership"
guard = "cli::tests::listener_flags_follow_the_shared_bind_ip_and_preserve_overrides"
run = ["cargo", "test", "-p", "microvms-cli", "--bin", "microvm", "--", "--exact", "cli::tests::listener_flags_follow_the_shared_bind_ip_and_preserve_overrides"]
expect = "test-failed"
suite = "rust"
transform = [{ file = "crates/microvms-app/src/session/mod.rs", replace = "pub const DEFAULT_BIND: SocketAddr = SocketAddr::V4(SocketAddrV4::new(Ipv4Addr::LOCALHOST, 0));", with = "pub const DEFAULT_BIND: SocketAddr = SocketAddr::V4(SocketAddrV4::new(Ipv4Addr::new(127, 0, 0, 2), 0));" }, { file = "crates/microvms-cli/src/cli.rs", replace = "    /// a VM running untrusted code is not something to expose on a LAN by accident.\n    #[arg(long, default_value_t = microvms_core::session::DEFAULT_BIND.ip().to_string())]", with = "    /// a VM running untrusted code is not something to expose on a LAN by accident.\n    #[arg(long, default_value = \"127.0.0.1\")]" }]

