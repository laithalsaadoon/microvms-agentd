# ── seconds flags that aren't durations (#268) ────────────────────────────────
# The CLI's seconds flags parse through core's `duration::of_secs_f64` (`cli::parse_seconds`),
# and `cost --hold-sec` through `cost::duration_of_secs_f64` (`cli::parse_report_seconds`), so a
# bad value is refused before any call, and each adapter's clippy.toml bans the panicking
# float conversions. The first two seed the parser: today's panicking expression restored, then
# a silent zero with no panic.

[[family]]
guard = "guards::seconds::a_seconds_flag_that_is_not_a_duration_is_refused_before_any_call"
run = ["cargo", "test", "-p", "microvms-cli", "--bin", "microvm", "--", "--exact", "guards::seconds::a_seconds_flag_that_is_not_a_duration_is_refused_before_any_call"]
expect = "test-failed"
suite = "rust"
note = "crates/microvms-cli/src/guards/seconds.rs::a_seconds_flag_that_is_not_a_duration_is_refused_before_any_call"

[[family.fault]]
id = "cli-seconds-flag-panics"
message = "cannot convert float seconds to Duration"
transform = { file = "crates/microvms-cli/src/cli.rs", replace = "microvms_core::duration::of_secs_f64(number_of_seconds(raw)?).map_err(|error| error.to_string())", with = "Ok(std::time::Duration::from_secs_f64(number_of_seconds(raw)?.max(0.0)))" }

[[family.fault]]
id = "cli-seconds-flag-clamps"
message = "exec --timeout=NaN: answered"
transform = { file = "crates/microvms-cli/src/cli.rs", replace = "microvms_core::duration::of_secs_f64(number_of_seconds(raw)?).map_err(|error| error.to_string())", with = "Ok(std::time::Duration::try_from_secs_f64(number_of_seconds(raw)?.max(0.0)).unwrap_or_default())" }

