# A figure every surface accepts, up to what a `Duration` holds, can be past what the clock can
# add to now. Core's deadlines saturate; the unchecked add panicked after the exec had started.

[[fault]]
id = "app-wait-deadline-overflows"
guard = "session::exec::tests::a_wait_longer_than_the_clock_can_hold_still_waits"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "session::exec::tests::a_wait_longer_than_the_clock_can_hold_still_waits"]
expect = "test-failed"
suite = "rust"
message = "overflow when adding duration to instant"
note = "crates/microvms-app/src/session/exec.rs::a_wait_longer_than_the_clock_can_hold_still_waits"
transform = { file = "crates/microvms-app/src/session/mod.rs", replace = "    now.checked_add(after).unwrap_or_else(|| now + FAR_FUTURE)\n", with = "    now + after\n" }

