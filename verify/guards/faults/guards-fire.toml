# A change to the `guards` job's steps or the workflow's `env` (CI's side of mise.toml) stops
# selecting every entry.

# The parser that returns nothing.

# The empty input: a deleted ci.yml counts as unchanged.

# The verdict cache (`fire --record`, `fire --reuse`): a pull request keeps main's recorded
# `fired` verdict only while nothing the entry's runs read differs from the record's commit.
# Each entry drops one reason an entry fires, so a pull request would keep a verdict its change
# could move, and runs the one `VerdictCache` case that reason fails. The record's own refusals
# (an uncommitted tree, no strace) and its positive path (a record that keeps every verdict)
# have one each.

[[fault]]
id = "guards-fire-reuse-content"
guard = "test_check_guards_fire.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_guards_fire.py", "-k", "test_a_changed_file_its_command_read_fires_its_entries_alone"]
