# Lint batches: an entry counts only by an error on the lines its own fault wrote, never by
# another entry's or by a warning, and whatever a batch can't read (a compile error, output
# that isn't JSON, a run that passed, lines two entries change, an error on no entry's lines)
# runs alone. A batched entry's log reads like its own run's, and its verdict line is a
# serial run's.

