[[fault]]
id = "guards-list-new-note"
guard = "tools/check-guards-fire.py list"
# `--base HEAD`: the new-note rule needs no base, so the entry doesn't depend on whether the
# checkout has origin/main (the `guards` job's shallow one didn't, before #323).
