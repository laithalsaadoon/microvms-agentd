# The `guards` job's two legs (#323): a push to main fires and records every entry and a pull
# request fires the entries whose recorded verdicts it can't keep, each in shards under the same
# budget (#345). `GuardsJob` runs both steps as ci.yml writes them, holds the cache steps between
# them and ci/local.toml's answers to them, and test_check_ci_parity.py holds ci:local to a
# budget written as an expression.

# The pull request's step loses its selection, so a pull request fires every entry again.
# Warm workers: each extra worker's target starts as a copy of the first one's
# dependency units, never a workspace member's, the copies keep their mtimes, an overlaid file
# gets a fresh mtime, and `build` compiles without running.

[[family]]
guard = "test_check_guards_fire.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_guards_fire.py", "-k", "WarmWorkers"]
expect = "exit-nonzero"
suite = "script"

