[[fault]]
id = "parity-window-closed-core"
guard = "core_answers_the_shared_case_corpus"
run = [["cargo", "build", "-p", "microvms-core", "--example", "parity-tunnel-peer"], ["cargo", "test", "-p", "microvms-core", "--test", "parity_cases", "--", "--exact", "core_answers_the_shared_case_corpus"]]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-app/src/control/microvm.rs", replace = "Err(refused) if refused.kind() == ErrorKind::Platform => {", with = "Err(refused) if false && refused.kind() == ErrorKind::Platform => {" }

