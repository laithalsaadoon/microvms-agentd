# ── ci:parity: what `check` runs, CI runs (#315) ─────────────────────────────
#
# CI's jobs run mise tasks, so the environment, the tools and each check's command are the same
# on both sides by construction. These entries hold what that leaves: every task `check` depends
# on is reached from a task a workflow runs, the Rust channel is one channel, no tool floats, and
# each job's `mise run` step fails when a command its task reaches fails.

# ── reach ────────────────────────────────────────────────────────────────────

[[family]]
guard = "tools/check-ci-parity.py"
run = ["./tools/check-ci-parity.py"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "ci-parity-check-task-unreached"
message = "`check` depends on `targets:check`, which no task a CI job runs reaches"
transform = { file = ".config/mise/tasks/ci.toml", replace = "  { task = \"targets:check\" },\n", with = "" }

# `wait_for` runs nothing: a job that only waits for a check never runs it.
[[family.fault]]
id = "ci-parity-wait-for-reaches-nothing"
message = "`check` depends on `model:check`, which no task a CI job runs reaches"
transform = { file = ".config/mise/tasks/ci.toml", replace = "run = [{ task = \"model:check\" }]\n", with = "wait_for = [\"model:check\"]\nrun = \"true\"\n" }

# The rust job names its ubuntu leg's task through a matrix `include`: read wrong, the leg's
# checks drop out of what CI reaches.
[[family.fault]]
id = "ci-parity-matrix-include-leg"
message = "`check` depends on `lint`, which no task a CI job runs reaches"
transform = { file = ".github/workflows/ci.yml", replace = "          - os: ubuntu-latest\n            task: ci:rust\n", with = "          - os: ubuntu-latest\n            task: ci:rust-client\n" }

# A task CI runs calling another through a command, where no check can see it and a `|| true`
# can swallow its failure.
[[family.fault]]
id = "ci-parity-inline-mise-run"
message = "`ci:bindings` runs `mise run bindings:py || true` in a command"
transform = { file = ".config/mise/tasks/ci.toml", replace = "  { task = \"bindings:py\" },\n", with = "  \"mise run bindings:py || true\",\n" }

[[family.fault]]
id = "ci-parity-flag-before-task"
message = "passes `mise run` the flag `--skip-deps` before its task"
transform = { file = ".github/workflows/ci.yml", replace = "      - run: mise run ci:drift\n", with = "      - run: mise run --skip-deps ci:drift\n" }

[[family.fault]]
id = "ci-parity-task-missing"
message = "runs `mise run ci:drifts`, and mise.toml has no `ci:drifts` task"
transform = { file = ".github/workflows/ci.yml", replace = "      - run: mise run ci:drift\n", with = "      - run: mise run ci:drifts\n" }

# The sentinel: the `mise run` reader matching nothing reads as a CI that runs no task.
[[family.fault]]
id = "ci-parity-reach-sentinel"
message = "runs `mise run`, so CI runs no task"
transform = { file = "tools/check-ci-parity.py", replace = "MISE_RUN = re.compile(r\"(?<![\\w./`-])mise\\s+run\\s+", with = "MISE_RUN = re.compile(r\"(?<![\\w./`-])mise\\s+runs\\s+" }

# ── the Rust channel ─────────────────────────────────────────────────────────

[[family.fault]]
id = "ci-parity-rust-channel"
message = "rust: .github/workflows/ci.yml job `security` installs 'beta', and rust-toolchain.toml says"
transform = { file = ".github/workflows/ci.yml", replace = "          toolchain: 1.99.0\n          components: clippy\n      - uses: ./.github/actions/mise\n      - run: mise run ci:security\n", with = "          toolchain: beta\n          components: clippy\n      - uses: ./.github/actions/mise\n      - run: mise run ci:security\n" }

[[family.fault]]
id = "ci-parity-rust-mise"
message = "rust: mise.toml pins rust = 'beta', and rust-toolchain.toml says"
transform = { file = "mise.toml", replace = "rust = { version = \"1.99.0\",", with = "rust = { version = \"beta\"," }

# The floor: a toolchain file with no channel holds the inputs to nothing.
[[family.fault]]
id = "ci-parity-rust-floor"
message = "rust: rust-toolchain.toml has no [toolchain] channel"
transform = { file = "rust-toolchain.toml", replace = "channel = \"1.99.0\"\n", with = "" }

# The sentinel: the toolchain step matcher finding nothing compares nothing.
[[family.fault]]
id = "ci-parity-rust-sentinel"
message = "rust: .github/workflows/ci.yml has no dtolnay/rust-toolchain step"
transform = { file = "tools/check-ci-parity.py", replace = "== \"dtolnay/rust-toolchain\":", with = "== \"dtolnay/rust-toolchains\":" }

# ── pins ─────────────────────────────────────────────────────────────────────

[[family.fault]]
id = "ci-parity-mise-latest"
message = "mise.toml [tools] pins `lefthook` to latest"
transform = { file = "mise.toml", replace = "lefthook = \"2.1.10\"\n", with = "lefthook = \"latest\"\n" }

# A task's own tool, pinned through `[vars]`.
[[family.fault]]
id = "ci-parity-task-tool-latest"
message = "tools pins `cargo:cargo-mutants` to latest"
transform = { file = "mise.toml", replace = "cargo_mutants = \"27.1.0\"\n", with = "cargo_mutants = \"latest\"\n" }

[[family.fault]]
id = "ci-parity-uvx-unpinned"
message = "runs `uvx maturin develop -m bindings/microvms-py/Cargo.toml`, which names no exact version of maturin"
transform = { file = ".config/mise/tasks/test.toml", replace = "uvx maturin@1.14.1 develop -m", with = "uvx maturin develop -m" }

# The call reader's spellings: options before the tool, `--from`, and `uv tool run`, each read
# to the tool it runs (a misread names another tool, or none, in the message).
[[family.fault]]
id = "ci-parity-uvx-option-first"
message = "which names no exact version of ty"
transform = { file = ".config/mise/tasks/test.toml", replace = "uvx ty@0.0.72 check", with = "uvx --python 3.12 ty check" }

[[family.fault]]
id = "ci-parity-uvx-from"
message = "which names no exact version of ty"
transform = { file = ".config/mise/tasks/test.toml", replace = "uvx ty@0.0.72 check", with = "uvx --from 'ty>=0.0.72' ty check" }

[[family.fault]]
id = "ci-parity-uv-tool-run"
message = "which names no exact version of ty"
transform = { file = ".config/mise/tasks/test.toml", replace = "uvx ty@0.0.72 check", with = "uv tool run ty check" }

[[family.fault]]
id = "ci-parity-uvx-unreadable"
message = "can't read the `uvx` call `uvx 'ty@"
transform = { file = ".config/mise/tasks/test.toml", replace = "uvx ty@0.0.72 check", with = "uvx 'ty@0.0.72 check" }

# The sentinel: the call finder matching nothing reads as every call pinned. The fixture's
# pinned calls then go uncounted, and the unit suite's unpinned ones pass.
[[fault]]
id = "ci-parity-uvx-sentinel"
guard = "test_check_ci_parity.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_ci_parity.py", "-k", "ParityTests"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_an_unpinned_uvx_call_fails ("
transform = { file = "tools/check-ci-parity.py", replace = "UV_CALL = re.compile(r\"(?<![\\w./-])(uvx|uv\\s+tool\\s+run)(?=\\s)\")", with = "UV_CALL = re.compile(r\"(?<![\\w./-])(uvxx|uv\\s+tool\\s+runx)(?=\\s)\")" }

# ── unreadable input ─────────────────────────────────────────────────────────

[[family]]
guard = "tools/check-ci-parity.py"
run = ["./tools/check-ci-parity.py"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "ci-parity-root-empty"
message = "mise.toml: can't read"
argv_fault = ["--root", "{empty_dir}"]

# ── the unit suite ───────────────────────────────────────────────────────────

[[family]]
guard = "test_check_ci_parity.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_ci_parity.py", "-k", "ParityTests"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "ci-parity-unit-uvx-valued"
message = "FAIL: test_every_uvx_spelling_is_read ("
transform = { file = "tools/check-ci-parity.py", replace = "    \"--cache-dir\", \"--refresh-package\", \"-p\", \"--python\", \"--color\",\n", with = "    \"--cache-dir\", \"--refresh-package\", \"-p\", \"--color\",\n" }

# The registry read through check-guards-fire.py's loader, with what it refuses ignored: the
# single file the registry was before the split would go unread.
[[family.fault]]
id = "ci-parity-unit-registry-refused"
message = "FAIL: test_the_former_single_registry_file_is_unreadable ("
transform = { file = "tools/check-ci-parity.py", replace = "    if refused:\n        raise Unreadable(\n            f\"{GUARDS['REGISTRY']}", with = "    if False:\n        raise Unreadable(\n            f\"{GUARDS['REGISTRY']}" }

# A matrix `include` entry that matches no leg joins every leg, as GitHub adds it.
[[family.fault]]
id = "ci-parity-unit-include"
message = "FAIL: test_an_include_with_only_new_keys_joins_every_leg ("
transform = { file = "tools/check-ci-parity.py", replace = "        if matched:\n", with = "        if matched and any(k in axes for k in entry):\n" }

# `depends_post` and a `run` of tasks run them: read as reaching nothing, a check CI runs that
# way reads as unreached.
[[family.fault]]
id = "ci-parity-unit-run-tasks"
message = "FAIL: test_depends_post_and_a_run_list_of_tasks_reach ("
transform = { file = "tools/check-ci-parity.py", replace = "            out += listed(entry.get(\"task\")) + listed(entry.get(\"tasks\"))\n", with = "            out += listed(entry.get(\"task\"))\n" }

# ── each job's `mise run` step fails when a command its task reaches fails ────
#
# `CiCommands` runs each step through real mise over this repository's tasks with every command
# stubbed. Each entry makes one job's step swallow a failure, and the case for that job fails.

[[fault]]
id = "ci-wrapper-rust"
guard = "test_check_ci_parity.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_ci_parity.py", "-k", "CiCommands.test_rust_"]
expect = "exit-nonzero"
suite = "script"
message = "step `mise run ${{ matrix.task }} || true` passes when"
transform = { file = ".github/workflows/ci.yml", replace = "      - run: mise run ${{ matrix.task }}\n", with = "      - run: mise run ${{ matrix.task }} || true\n" }

[[fault]]
