# A job-level skip the step can't see: the environment telling mise not to run a task the job
# reaches. The case requires every command a job reaches to run.
[[fault]]
id = "ci-wrapper-task-skipped"
guard = "test_check_ci_parity.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_ci_parity.py", "-k", "CiCommands.test_security_"]
expect = "exit-nonzero"
suite = "script"
message = "the commands that ran"
transform = { file = ".github/workflows/ci.yml", replace = "      PR_AUTHOR: ${{ github.event.pull_request.user.login }}\n", with = "      PR_AUTHOR: ${{ github.event.pull_request.user.login }}\n      MISE_TASK_SKIP: targets:check\n" }

# The floor: no step to run makes every case above vacuous.
[[fault]]
id = "ci-wrapper-floor"
guard = "test_check_ci_parity.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_ci_parity.py", "-k", "CiCommands.test_the_repository_has_steps_to_run"]
expect = "exit-nonzero"
suite = "script"
message = "ci.yml and fuzz.yml run no `mise run` step"
transform = { file = "tools/test_check_ci_parity.py", replace = "    found = PARITY[\"ci_commands\"](REPO, problems)\n", with = "    found = PARITY[\"ci_commands\"](REPO, problems, ())\n" }

# ── mise's own validation, in `ci:parity` ────────────────────────────────────

# A `depends` naming no task, in a task nothing in CI reaches. The scratch tree is a checkout
# mise hasn't trusted, so the command trusts it for its own run.
[[fault]]
id = "mise-tasks-validate-depends"
guard = "mise tasks validate"
run = ["bash", "-c", "MISE_TRUSTED_CONFIG_PATHS=\"$PWD\" mise tasks validate"]
expect = "exit-nonzero"
suite = "script"
message = "Dependency 'docs:bracez' not found"
transform = { file = ".config/mise/tasks/docs.toml", replace = "depends = [\"docs:braces\"]\nrun = \"pnpm exec astro dev\"\n", with = "depends = [\"docs:bracez\"]\nrun = \"pnpm exec astro dev\"\n" }

# An unreadable file takes out only the rules that read it: each part of that, reverted, fails its
# test.
[[family]]
guard = "test_check_ci_parity.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_ci_parity.py", "-k", "ParityTests"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "ci-parity-unreadable-workflow-ends-the-check"
message = "FAIL: test_an_unreadable_workflow_is_listed_first_and_the_other_rules_still_run ("
transform = { file = "tools/check-ci-parity.py", replace = "    commands = ci_commands(root, problems, tuple(workflows))\n", with = "    if len(workflows) < len(WORKFLOWS):\n        return problems, \"\"\n    commands = ci_commands(root, problems, tuple(workflows))\n" }

[[family.fault]]
id = "ci-parity-partial-reach-held"
message = "FAIL: test_an_unreadable_workflow_is_listed_first_and_the_other_rules_still_run ("
transform = { file = "tools/check-ci-parity.py", replace = "    for dep in depends if every_workflow else []:\n", with = "    for dep in depends:\n" }

[[family.fault]]
id = "ci-parity-unreadable-registry-ends-the-check"
message = "FAIL: test_an_unreadable_registry_leaves_the_other_rules ("
transform = { file = "tools/check-ci-parity.py", replace = "        problems.append(str(error))\n        calls_read = 0\n", with = "        problems[:] = [str(error)]\n        calls_read = 0\n" }

# The files ci:parity reads itself, each emptied and each made unreadable, and its sentinel: a
# `check` with no dependencies holds CI to nothing. mise.toml and the task files are read through
# tools/mise_config.py, whose refusals the mise-config entries and ParityTests hold.
[[scanner]]
id = "ci-parity"
guard = "tools/check-ci-parity.py"
run = ["./tools/check-ci-parity.py"]
suite = "script"
inputs = [".github/workflows/ci.yml", ".github/workflows/fuzz.yml", "rust-toolchain.toml"]
empty = "{input} is empty"
unreadable = "{input} doesn't parse"
sentinel = { file = ".config/mise/tasks/check.toml", replace = "depends = [\n  \"lint\",\n  \"security\",\n", with = "was = [\n  \"lint\",\n  \"security\",\n", message = "mise.toml's `check` depends on no task" }
