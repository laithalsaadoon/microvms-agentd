[[fault]]
id = "retry-resolution-cancellation-ignored"
guard = "sandbox::tests::cancellation_interrupts_image_resolution_and_releases_the_sandbox"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "sandbox::tests::cancellation_interrupts_image_resolution_and_releases_the_sandbox"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-app/src/sandbox.rs", replace = "        wire.image_identifier = if let Some(cancellation) = cancellation {\n            // This lookup only reads images, so cancelling it cannot abandon a VM.\n            // The launch below remains shielded while its request is in flight.\n            tokio::select! {\n                biased;\n                _ = cancellation.cancelled() => {\n                    return Err(Error::new(\n                        ErrorKind::Interrupted,\n                        \"launch cancelled before a VM was assigned\",\n                    ));\n                }\n                resolved = resolution => resolved?,\n            }\n        } else {\n            resolution.await?\n        };", with = "        wire.image_identifier = resolution.await?;" }

[[fault]]
id = "js-retry-details-null-floor"
guard = "retryDetails refuses unrelated values and reads telemetry without parsing text"
run = [["npx", "-y", "-p", "@napi-rs/cli@3.10.8", "napi", "build", "--manifest-path", "Cargo.toml", "--package", "microvms-js", "--platform", "--output-dir", ".", "--cwd", "bindings/microvms-js", "--features", "parity-fixtures", "--dts", "parity-fixtures.d.ts"], ["node", "--test", "--test-reporter=tap", "bindings/microvms-js/__test__/retry.mjs"]]
expect = "test-failed"
suite = "bindings"
transform = { file = "bindings/microvms-js/src/errors.rs", replace = "    if error.get_type().ok()? != ValueType::Object {\n        return None;\n    }\n    let error = Object::from_unknown(error).ok()?;\n    Some(RetryDetails", with = "    let error = Object::from_unknown(error).ok()?;\n    Some(RetryDetails" }

[[fault]]
id = "js-retry-details-forwarded"
guard = "Sandbox control-plane failures retain retry telemetry"
run = [["npx", "-y", "-p", "@napi-rs/cli@3.10.8", "napi", "build", "--manifest-path", "Cargo.toml", "--package", "microvms-js", "--platform", "--output-dir", ".", "--cwd", "bindings/microvms-js", "--features", "parity-fixtures", "--dts", "parity-fixtures.d.ts"], ["node", "--test", "--test-reporter=tap", "bindings/microvms-js/__test__/retry.mjs"]]
expect = "test-failed"
suite = "bindings"
transform = { file = "bindings/microvms-js/src/errors.rs", replace = "result.map_err(|error| with_retry_details(env, error))", with = "result.map_err(napi::Error::from)" }

[[fault]]
id = "py-retry-stub-attributes"
guard = "tools/generate-py-stubs.py --check"
run = ["./tools/generate-py-stubs.py", "--check"]
expect = "exit-nonzero"
suite = "bindings"
message = "bindings/microvms-py/microvms.pyi is stale"
transform = { file = "tools/generate-py-stubs.py", replace = "                \"    throttled: bool\",\n                \"    attempt_count: int\",\n                \"    backoff_seconds: float\",\n", with = "" }
