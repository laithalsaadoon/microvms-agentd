# Retry budgets and telemetry: each mutant removes one observable guarantee.

[[fault]]
id = "retry-throttle-attempts-ignored"
guard = "control::transport::tests::throttle_budget_counts_attempts_bounds_elapsed_and_keeps_other_failures_default"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "control::transport::tests::throttle_budget_counts_attempts_bounds_elapsed_and_keeps_other_failures_default"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-app/src/control/transport.rs", replace = "details.attempt_count < policy.max_attempts", with = "details.attempt_count < 6" }

[[fault]]
id = "retry-throttle-deadline-ignored"
guard = "control::transport::tests::throttle_budget_counts_attempts_bounds_elapsed_and_keeps_other_failures_default"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "control::transport::tests::throttle_budget_counts_attempts_bounds_elapsed_and_keeps_other_failures_default"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-app/src/control/transport.rs", replace = "&& elapsed.saturating_add(delay) < policy.max_elapsed", with = "&& elapsed.saturating_add(delay) < Duration::MAX" }

[[fault]]
id = "retry-error-attempts-lost"
guard = "control::transport::tests::exhausted_public_retry_reports_throttle_attempts_and_backoff"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "control::transport::tests::exhausted_public_retry_reports_throttle_attempts_and_backoff"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-domain/src/error.rs", replace = "self.attempts = attempts;", with = "self.attempts = attempts.saturating_sub(attempts);" }

[[fault]]
id = "retry-cancellation-ignored"
guard = "control::transport::tests::a_cancel_signal_wakes_backoff_before_another_request"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "control::transport::tests::a_cancel_signal_wakes_backoff_before_another_request"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-app/src/control/transport.rs", replace = "if cancellation.is_some_and(RetryCancellation::is_cancelled) {", with = "if false && cancellation.is_some_and(RetryCancellation::is_cancelled) {" }

[[fault]]
id = "retry-launch-running-time-lost"
guard = "sandbox::tests::launch_metrics_track_retries_running_and_ready_without_changing_on_clones"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "sandbox::tests::launch_metrics_track_retries_running_and_ready_without_changing_on_clones"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-app/src/sandbox.rs", replace = "            metrics\n                .lock()\n                .unwrap_or_else(std::sync::PoisonError::into_inner)\n                .running_at\n                .get_or_insert_with(|| self.control.clock().unix_now().as_secs_f64());", with = "            let _ = metrics;" }

[[fault]]
id = "retry-cancellation-discards-an-accepted-launch"
guard = "sandbox::tests::cancellation_preserves_an_inflight_accepted_launch"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "sandbox::tests::cancellation_preserves_an_inflight_accepted_launch"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-app/src/control/transport.rs", replace = "            Ok(reply) if reply.is_success() || accept.contains(&reply.status) => {\n                return Ok((reply, details));", with = "            Ok(reply) if reply.is_success() || accept.contains(&reply.status) => {\n                if cancellation.is_some_and(RetryCancellation::is_cancelled) {\n                    return Err(Error::new(ErrorKind::Interrupted, \"cancelled\"));\n                }\n                return Ok((reply, details));" }

