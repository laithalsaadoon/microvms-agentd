# Retry budgets and telemetry: each mutant removes one observable guarantee.

[[fault]]
id = "retry-domain-details-lost"
guard = "error::tests::retry_details_distinguish_unmeasured_and_observed_failures"
run = ["cargo", "test", "-p", "microvms-domain", "--lib", "--", "--exact", "error::tests::retry_details_distinguish_unmeasured_and_observed_failures"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-domain/src/error.rs", replace = "self.attempts = attempts;", with = "self.attempts = attempts.saturating_sub(attempts);" }

