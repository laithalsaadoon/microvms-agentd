# Default kinds and omission metadata must fail closed (#570).
[[family]]
guard = "tools/check-parity.py"
run = ["./tools/check-parity.py"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "default-kind-string"
message = "defaults to \"agent-default\", but clientDefaults.prompt.permissionMode is \"unrestricted\""
transform = { file = "docs/manifest.json", replace = "\"permissionMode\": \"agent-default\"", with = "\"permissionMode\": \"unrestricted\"" }

[[family.fault]]
id = "default-kind-zero"
message = "defaults to 0, but clientDefaults.stream.offset is 1"
transform = { file = "docs/manifest.json", replace = "\"offset\": 0", with = "\"offset\": 1" }

[[family.fault]]
id = "default-kind-absent"
message = "defaults to None, but clientDefaults.exec.cwd is \"/tmp\""
transform = { file = "docs/manifest.json", replace = "\"cwd\": null", with = "\"cwd\": \"/tmp\"" }

[[family.fault]]
id = "default-kind-typescript"
message = "ts: PromptOptions.permissionMode defaults to \"unrestricted\""
transform = { file = "bindings/microvms-js/index.d.ts", replace = "* @defaultValue \"agent-default\"", with = "* @defaultValue \"unrestricted\"" }

[[family.fault]]
id = "default-typescript-floor"
message = "ts: the surface states no default the rows hold, so nothing was read"
transform = { file = "tools/check-parity.py", replace = "    record_ts_defaults(project, surface)\n", with = "    pass\n" }

[[family.fault]]
id = "default-exemption-pin"
message = "default stdin-eof: an exempt default must pin its value"
transform = { file = "verify/parity/capabilities.toml", replace = "id = \"stdin-eof\"\nexempt = \"whether this one write closes stdin: an argument of the call, with no default anywhere else\"\nvalue = \"False\"", with = "id = \"stdin-eof\"\nexempt = \"whether this one write closes stdin: an argument of the call, with no default anywhere else\"" }

[[family]]
guard = "tools/test_check_parity.py"
run = ["python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_parity.py", "-q"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "default-python-overload-conflict"
message = "AssertionError: ParityError not raised"
transform = { file = "tools/check-parity.py", replace = "            if previous is not None and previous != parameter[\"default\"]:\n", with = "            if False:\n" }

[[family.fault]]
id = "default-typescript-inline-input"
message = "test_the_typescript_reader_over_typedoc"
transform = { file = "tools/check-parity.py", replace = "            if isinstance(declaration, dict):\n", with = "            if False:\n" }

[[family.fault]]
id = "default-python-overload-only"
message = "test_python_overloads_are_read_and_must_agree"
transform = { file = "site/scripts/reference/griffe_dump.py", replace = "    for name, overloads in owner.overloads.items():\n", with = "    for name, overloads in []:\n" }

[[family.fault]]
id = "default-python-constructor"
message = "test_python_constructor_defaults_use_the_class_name_and_must_agree"
transform = { file = "tools/check-parity.py", replace = "                    \"__init__\",\n", with = "" }

[[fault]]
id = "default-typescript-permission-fallback"
guard = "both agents and permission modes reach the wire with the remote deadline"
run = [
  ["npx", "-y", "-p", "@napi-rs/cli@3.10.8", "napi", "build", "--manifest-path", "Cargo.toml", "--package", "microvms-js", "--platform", "--output-dir", ".", "--cwd", "bindings/microvms-js"],
  ["node", "--test", "--test-reporter=tap", "bindings/microvms-js/__test__/agents.mjs"],
]
expect = "test-failed"
suite = "bindings"
note = "bindings/microvms-js/__test__/agents.mjs::both agents and permission modes reach the wire with the remote deadline"
transform = { file = "bindings/microvms-js/src/agents.rs", replace = ".unwrap_or(defaults.permission_mode)", with = ".unwrap_or(\"unrestricted\".parse().unwrap())" }

[[fault]]
id = "default-typescript-base-workdir-ownership"
guard = "an omitted base working directory follows the shared default"
run = [
  ["npx", "-y", "-p", "@napi-rs/cli@3.10.8", "napi", "build", "--manifest-path", "Cargo.toml", "--package", "microvms-js", "--platform", "--output-dir", ".", "--cwd", "bindings/microvms-js"],
  ["node", "--test", "--test-reporter=tap", "--test-name-pattern", "an omitted base working directory follows the shared default", "bindings/microvms-js/__test__/build_project.mjs"],
]
expect = "test-failed"
suite = "bindings"
note = "bindings/microvms-js/__test__/build_project.mjs::an omitted base working directory follows the shared default"
transform = [
  { file = "crates/microvms-app/src/control/artifact.rs", replace = "            working_dir: String::new(),\n", with = "            working_dir: \"/shared-default\".to_string(),\n" },
  { file = "bindings/microvms-js/src/sandbox.rs", replace = ".unwrap_or_else(|| CoreBaseImage::default().working_dir)", with = ".unwrap_or_default()" },
]

[[family]]
guard = "tools/test_check_parity.py: DefaultValueComparisonTests"
run = ["uv", "run", "--locked", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_parity.py", "-k", "DefaultValueComparisonTests"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "default-cli-string-spelling"
message = "FAIL: test_cli_strings_keep_their_raw_text_and_case"
transform = { file = "tools/check-parity.py", replace = "    if key == \"cli\":\n        if isinstance(value, str):\n", with = "    if key == \"CLI\":\n        if isinstance(value, str):\n" }

[[family.fault]]
id = "default-cli-boolean-case"
message = "FAIL: test_cli_booleans_accept_case_without_losing_the_value"
transform = { file = "tools/check-parity.py", replace = "        return text.lower() != str(value).lower()\n", with = "        return text.upper() != str(value).lower()\n" }

[[family.fault]]
id = "default-invalid-literal-refused"
message = "FAIL: test_invalid_python_and_typescript_literals_are_not_equal_defaults"
transform = { file = "tools/check-parity.py", replace = "    except (ValueError, SyntaxError):\n        return True\n", with = "    except (ValueError, SyntaxError):\n        return False\n" }

[[family.fault]]
id = "default-numeric-literal-equivalence"
message = "FAIL: test_numeric_literals_compare_values_across_integer_and_float_spellings"
transform = { file = "tools/check-parity.py", replace = "    if type(actual) in (int, float) and type(value) in (int, float):\n", with = "    if type(None) in (int, float) and type(value) in (int, float):\n" }

[[family.fault]]
id = "default-boolean-numeric-distinction"
message = "FAIL: test_booleans_and_numbers_remain_distinct_defaults"
transform = { file = "tools/check-parity.py", replace = "    return type(actual) is not type(value) or actual != value\n", with = "    return actual != value\n" }
