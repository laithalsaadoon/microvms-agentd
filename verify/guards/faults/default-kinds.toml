transform = { file = "tools/check-parity.py", replace = "                    f\"{where}: {key}: a cell is a default's name or a list of them\"\n                )\n                continue\n", with = "                    f\"{where}: {key}: a cell is a default's name or a list of them\"\n                )\n                break\n" }

[[family.fault]]
