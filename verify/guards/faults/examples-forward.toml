[[fault]]
id = "forward-host-before-mint"
guard = "session::forward::tests::requests_name_the_local_listener_before_minting"
run = ["cargo", "test", "-p", "microvms-edges", "--lib", "--", "--exact", "session::forward::tests::requests_name_the_local_listener_before_minting"]
