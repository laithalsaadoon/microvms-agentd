# Protected example configuration, publishing destinations, and local forward hosts.

[[fault]]
id = "bg-publishes-from-fork"
guard = "examples/background-coding-agent/tests/test_github.py::test_changes_become_one_commit_and_a_retry_safe_draft"
run = ["env", "PYTHONDONTWRITEBYTECODE=1", "uv", "run", "--project", "examples/background-coding-agent", "--frozen", "pytest", "-q", "-rA", "-p", "no:cacheprovider", "examples/background-coding-agent/tests/test_github.py::test_changes_become_one_commit_and_a_retry_safe_draft"]
expect = "test-failed"
suite = "script"
transform = { file = "examples/background-coding-agent/github_ops.py", replace = "    repo = publishing_repo(source)", with = "    repo = source" }

