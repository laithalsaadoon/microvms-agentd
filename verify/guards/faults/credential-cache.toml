# New private cache helpers need seeded faults that leave the regression tests buildable.

[[fault]]
id = "credentials-no-cache-concurrent"
guard = "control::credentials::tests::concurrent_signed_requests_resolve_credentials_once_per_expiry_window"
run = [["cargo", "test", "-p", "microvms-edges", "--lib", "control::credentials::tests::concurrent_signed_requests_resolve_credentials_once_per_expiry_window", "--", "--exact"]]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-edges/src/control/credentials.rs", replace = "    let cache = config\n        .identity_cache()\n        .unwrap_or_else(|| aws_config::identity::IdentityCache::lazy().build());\n", with = "    let cache = aws_config::identity::IdentityCache::no_cache();\n" }

[[fault]]
id = "credentials-no-cache-refresh"
guard = "control::credentials::tests::expired_credentials_are_not_returned_after_a_refresh_failure"
run = [["cargo", "test", "-p", "microvms-edges", "--lib", "control::credentials::tests::expired_credentials_are_not_returned_after_a_refresh_failure", "--", "--exact"]]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-edges/src/control/credentials.rs", replace = "    let cache = config\n        .identity_cache()\n        .unwrap_or_else(|| aws_config::identity::IdentityCache::lazy().build());\n", with = "    let cache = aws_config::identity::IdentityCache::no_cache();\n" }

[[fault]]
id = "credentials-unshared-regions"
guard = "control::credentials::tests::regional_initialization_is_shared_and_failed_loads_can_retry"
run = [["cargo", "test", "-p", "microvms-edges", "--lib", "control::credentials::tests::regional_initialization_is_shared_and_failed_loads_can_retry", "--", "--exact"]]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-edges/src/control/credentials.rs", replace = "    let cell = providers\n        .lock()\n        .await\n        .entry(region.clone())\n        .or_default()\n        .clone();\n", with = "    let _ = (providers, region);\n    let cell = Arc::new(OnceCell::new());\n" }

[[fault]]
id = "js-provider-source-lost"
guard = "errors::tests::provider_sources_survive_without_changing_the_code_chain"
run = [["cargo", "test", "-p", "microvms-js", "--lib", "errors::tests::provider_sources_survive_without_changing_the_code_chain", "--", "--exact"]]
expect = "test-failed"
suite = "rust"
transform = { file = "bindings/microvms-js/src/errors.rs", replace = "napi::Error::new(error.code().to_string(), diagnostic(error))", with = "napi::Error::new(error.code().to_string(), error.to_string())" }

[[fault]]
id = "py-provider-source-lost"
guard = "bindings/microvms-py/tests/test_errors.py::test_transport_sources_survive_as_python_exception_causes"
run = [["uvx", "maturin@1.14.1", "develop", "-q", "-m", "bindings/microvms-py/Cargo.toml"], ["python", "-m", "pytest", "-q", "-rA", "bindings/microvms-py/tests/test_errors.py::test_transport_sources_survive_as_python_exception_causes"]]
expect = "test-failed"
suite = "bindings"
transform = { file = "bindings/microvms-py/src/errors.rs", replace = "    if let Some(source) = std::error::Error::source(error) {\n        raised.set_cause(py, Some(source_exception(py, source)));\n    }\n", with = "" }
