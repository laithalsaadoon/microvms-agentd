# Python credential-fixture isolation: these guards predate the credential cache.
# The primer resolves synthetic credentials against a local proxy before the
# launch fixture removes them. Each fault bypasses that guard's new subprocess
# wrapper, so its own credential-error assertion exposes the inherited provider.
# These entries prove the isolation harness, not a new product-behavior regression.

[[fault]]
id = "py-credential-isolation-bare-name"
guard = "bindings/microvms-py/tests/test_launch_by_name.py::test_a_bare_image_name_is_listed_before_any_launch"
run = [["uvx", "maturin@1.14.1", "develop", "-q", "-m", "bindings/microvms-py/Cargo.toml"], ["python", "-m", "pytest", "-q", "-rA", "bindings/microvms-py/tests/test_async.py::test_bind_26_a_cancelled_read_closes_its_connection", "bindings/microvms-py/tests/test_launch_by_name.py::test_a_bare_image_name_is_listed_before_any_launch"]]
expect = "test-failed"
suite = "bindings"
transform = { file = "bindings/microvms-py/tests/test_launch_by_name.py", replace = "@isolated_credentials\ndef test_a_bare_image_name_is_listed_before_any_launch", with = "def test_a_bare_image_name_is_listed_before_any_launch" }

