# The session's stream status check, apart from `open_stream` so it has an offline test (#275):
# a stream opened on a failure status loses the daemon's detail string.
[[fault]]
id = "http-stream-failure-status"
guard = "session::http::tests::only_a_success_status_opens_a_stream"
run = ["cargo", "test", "-p", "microvms-edges", "--lib", "--", "--exact", "session::http::tests::only_a_success_status_opens_a_stream"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-edges/src/session/http.rs", replace = "    !(200..300).contains(&status)", with = "    (200..300).contains(&status)" }
