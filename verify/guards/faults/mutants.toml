[[fault]]
id = "mutants-wrapper-given-diff-unchecked"
guard = "test_check_mutants.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutants.py"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_given_diff_with_no_rust_in_it_fails_without_running_cargo_mutants ("
transform = { file = "tools/check-mutants.py", replace = "    if not RUST_HEADER.search(text):\n", with = "    if False:\n" }

[[fault]]
id = "mutants-wrapper-rust-header-matches-nothing"
guard = "test_check_mutants.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutants.py"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_given_diff_is_handed_over_as_it_is ("
transform = { file = "tools/check-mutants.py", replace = "(?:b/)?\\S+\\.rs\\s*$", with = "(?:b/)?\\S+\\.rs\\s*$(?!)" }

# The caller's CARGO_TARGET_DIR handed to cargo-mutants' copies, so a later build of the
# caller's tree can trust an artifact built from a mutated copy.
[[fault]]
id = "mutants-wrapper-shared-target"
guard = "test_check_mutants.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutants.py"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_cargo_mutants_builds_in_its_own_targets_unless_it_mutates_in_place ("
transform = { file = "tools/check-mutants.py", replace = "env.pop(\"CARGO_TARGET_DIR\", None)", with = "env.get(\"CARGO_TARGET_DIR\")" }

# The exclusion list (#275): `fuzz_extract` is compiled only with agentd's `fuzzing` feature, so
# no `cargo test` build can catch a mutant in it. Without its `exclude_re` entry, a change that
# touches the function fails the `mutants` job with both of its mutants missed. The command
# mutates a diff of that one function, built from the tree when it runs so it follows the
# function when fs.rs moves (a committed copy would pin its line numbers, and cargo-mutants
# refuses a diff whose lines don't match). Clean, the entry drops both mutants and the run
# passes with nothing to test; a renamed function fails the awk, and a pattern that stopped
# matching fails the clean run. `--in-place` mutates the scratch tree and builds in its target.
[[fault]]
id = "mutants-fuzz-extract-exclusion"
guard = "tools/check-mutants.py"
run = ["bash", "-c", "set -eu; diff=$(mktemp); trap 'rm -f \"$diff\"' EXIT; awk '/^pub fn fuzz_extract\\(/ { s = NR } s && !e { body = body \"+\" $0 \"\\n\" } s && !e && /^}/ { e = NR } END { if (!e) { print \"no fn fuzz_extract in crates/agentd/src/fs.rs\" > \"/dev/stderr\"; exit 1 } printf \"--- a/crates/agentd/src/fs.rs\\n+++ b/crates/agentd/src/fs.rs\\n@@ -%d,0 +%d,%d @@\\n%s\", s - 1, s, e - s + 1, body }' crates/agentd/src/fs.rs > \"$diff\"; ./tools/check-mutants.py --diff \"$diff\" -- --in-place"]
expect = "exit-nonzero"
suite = "script"
message = "MISSED"
transform = { file = ".cargo/mutants.toml", replace = "  '^crates/agentd/src/fs\\.rs:\\d+:\\d+: replace fuzz_extract -> ',\n", with = "" }

# A user's `diff.mnemonicPrefix` writes `+++ w/<path>`, which names no file for cargo-mutants,
# and a real run then passes with nothing mutated.
[[fault]]
id = "mutants-wrapper-user-diff-prefix"
guard = "test_check_mutants.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutants.py"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_the_diff_keeps_its_a_and_b_prefixes_whatever_git_is_set_to ("
transform = { file = "tools/check-mutants.py", replace = "diff = git(\"diff\", *DIFF_FORMAT, merge_base,", with = "diff = git(\"diff\", merge_base," }

# The package list not held to the workspace: a new crate is never mutated, and a renamed one
# only draws a warning from `-p`.
[[fault]]
id = "mutants-wrapper-members-unchecked"
guard = "test_check_mutants.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutants.py"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_workspace_member_in_neither_list_fails_naming_it ("
transform = { file = "tools/check-mutants.py", replace = "    if problems:\n", with = "    if False:\n" }

# The metadata reader returns no members. Every listed package then reads as gone, so even a
# clean run fails.
[[fault]]
id = "mutants-wrapper-members-read-nothing"
guard = "test_check_mutants.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutants.py"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_clean_run_passes ("
transform = { file = "tools/check-mutants.py", replace = "for package in metadata.get(\"packages\") or []", with = "for package in []" }

# `--detect` answers no Rust whatever the change, so CI's first step skips every later one.
[[fault]]
id = "mutants-wrapper-detect-always-false"
guard = "test_check_mutants.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutants.py"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_detect_answers_whether_there_is_rust_without_running_cargo ("
transform = { file = "tools/check-mutants.py", replace = "print(f\"rust={'true' if names else 'false'}\")", with = "print(\"rust=false\")" }

# The job's first step, as ci.yml writes it, asks about the wrong change: against HEAD, a
# committed change to Rust reads as none, and every shard passes without mutating anything.
# The #275 falsifier's pathspec fault on the step's first shell form had this effect.
[[fault]]
id = "mutants-ci-detect-step-wrong-base"
guard = "test_check_mutants.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutants.py"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_the_ci_jobs_steps_run_the_wrapper_as_these_cases_do ("
transform = { file = ".github/workflows/ci.yml", replace = "run: python3 tools/check-mutants.py --base \"$BASE\" --detect", with = "run: python3 tools/check-mutants.py --base HEAD --detect" }

# A gated step that reads an output the first step doesn't write never runs.
[[fault]]
id = "mutants-ci-gated-step-wrong-output"
guard = "test_check_mutants.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutants.py"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_the_ci_jobs_steps_run_the_wrapper_as_these_cases_do ("
transform = { file = ".github/workflows/ci.yml", replace = "        if: steps.diff.outputs.rust == 'true'\n        env:\n          BASE: origin/${{ github.base_ref }}\n          SHARD:", with = "        if: steps.diff.outputs.changed == 'true'\n        env:\n          BASE: origin/${{ github.base_ref }}\n          SHARD:" }

# A `mutants::skip` on shipping code drops its mutants with no run and no line in the job's
# output. The #275 falsifier's fault: an untested function exits 2 without it and 0 with it.
[[fault]]
id = "mutants-skip-on-shipping-code"
guard = "test_check_mutants.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutants.py"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_every_mutants_skip_is_a_listed_site ("
transform = { file = "crates/microvms-app/src/provision.rs", replace = "pub fn sha256_hex(bytes: &[u8]) -> String {", with = "#[cfg_attr(test, mutants::skip)]\npub fn sha256_hex(bytes: &[u8]) -> String {" }

