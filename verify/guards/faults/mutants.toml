# first form.
[[fault]]
id = "mutants-exclusion-drops-logic"
guard = "test_check_mutants.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutants.py"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_each_exclusion_drops_only_a_named_functions_return_value ("
transform = { file = ".cargo/mutants.toml", replace = "  '^crates/microvms-edges/src/session/http\\.rs:\\d+:\\d+: replace <impl HttpBackend for ReqwestBackend>::(send|open_stream) -> ',", with = "  '^crates/microvms-edges/src/session/http\\.rs:\\d+:\\d+: .*<impl HttpBackend for ReqwestBackend>::'," }

