# ── mutants: the wrapper over cargo-mutants (#275) ─────────────────────────────

# A missed mutant and a timeout each read as a pass.
[[fault]]
id = "mutants-wrapper-missed-passes"
guard = "test_check_mutants.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutants.py"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_missed_mutant_fails_and_names_it ("
transform = { file = "tools/check-mutants.py", replace = "    if code == 0:\n        return 0\n", with = "    if code in (0, 2):\n        return 0\n" }

[[fault]]
id = "mutants-wrapper-timeout-passes"
guard = "test_check_mutants.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_mutants.py"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_timeout_fails_and_names_the_mutant ("
transform = { file = "tools/check-mutants.py", replace = "    if code == 0:\n        return 0\n", with = "    if code in (0, 3):\n        return 0\n" }

