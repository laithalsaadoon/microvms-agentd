# ── agentd-model: each spec function's note names the property test ──────────

[[fault]]
id = "model-image-force"
guard = "image::tests::the_specified_ensure_satisfies_every_property"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "image::tests::the_specified_ensure_satisfies_every_property"]
expect = "test-failed"
suite = "rust"
note = "crates/model/src/image.rs::plan"
transform = { file = "crates/model/src/image.rs", replace = "        (Platform::Ready, true) | (Platform::Failed, _) => Plan::Delete,\n", with = "        (Platform::Ready, true) => Plan::Reuse,\n        (Platform::Failed, _) => Plan::Delete,\n" }

[[fault]]
id = "model-provision-launder"
guard = "provision::tests::the_specified_policy_satisfies_every_property"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "provision::tests::the_specified_policy_satisfies_every_property"]
expect = "test-failed"
suite = "rust"
note = "crates/model/src/provision.rs::verify"
transform = { file = "crates/model/src/provision.rs", replace = "        Gh::Unattested => Verdict::Refused,\n", with = "        Gh::Unattested => verify(\n            Behavior::Specified,\n            Release {\n                gh: Gh::Unavailable,\n                ..release\n            },\n        ),\n" }

[[fault]]
id = "model-wrap-tail"
guard = "wrap::tests::the_specified_wrap_satisfies_every_property"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "wrap::tests::the_specified_wrap_satisfies_every_property"]
expect = "test-failed"
suite = "rust"
note = "crates/model/src/wrap.rs::specified"
transform = { file = "crates/model/src/wrap.rs", replace = "    if task.tail != Tail::Complete {\n        return Wrap::Refused(Refusal::Unfinished);\n    }\n", with = "" }

[[fault]]
id = "model-output-continue"
guard = "output::tests::the_specified_cli_satisfies_every_property"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "output::tests::the_specified_cli_satisfies_every_property"]
expect = "test-failed"
suite = "rust"
note = "crates/model/src/output.rs::specified"
transform = { file = "crates/model/src/output.rs", replace = "            stream_event: true,\n        } => Decision::StopStream,\n", with = "            stream_event: true,\n        } => Decision::Continue,\n" }

[[fault]]
id = "model-exec-start-layers"
guard = "exec_start::tests::the_specified_daemon_satisfies_every_property"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "exec_start::tests::the_specified_daemon_satisfies_every_property"]
expect = "test-failed"
suite = "rust"
note = "crates/model/src/exec_start.rs::specified"
transform = { file = "crates/model/src/exec_start.rs", replace = "Layering::Specified => [image, identity, world.launch, request.env()],", with = "Layering::Specified => [image, world.launch, identity, request.env()]," }

# The daemon model's token properties (#305), one per key the trace credits to it: each fault
# changes one response of the model, and only that key's property reports a counterexample
# (stateright names the first one it finds).
[[fault]]
id = "model-agentd-2-first-bootstrap-refused"
guard = "tests::correct_deployment_satisfies_every_property"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "tests::correct_deployment_satisfies_every_property"]
expect = "test-failed"
suite = "rust"
message = "\"AGENTD-2 the first bootstrap installs its token\" counterexample"
transform = { file = "crates/model/src/lib.rs", replace = "                        next.boot = Boot::Ready { token, by: from };\n                        Response::Ok\n", with = "                        next.boot = Boot::Ready { token, by: from };\n                        Response::Conflict\n" }

[[fault]]
id = "model-agentd-4-replay-refused"
guard = "tests::correct_deployment_satisfies_every_property"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "tests::correct_deployment_satisfies_every_property"]
expect = "test-failed"
suite = "rust"
message = "\"AGENTD-4 a bootstrap presenting the installed token is accepted\" counterexample"
transform = { file = "crates/model/src/lib.rs", replace = "                    } if installed == token => Response::Ok,\n", with = "                    } if installed == token => Response::Conflict,\n" }

[[fault]]
id = "model-agentd-5-wrong-token-unavailable"
guard = "tests::correct_deployment_satisfies_every_property"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "tests::correct_deployment_satisfies_every_property"]
expect = "test-failed"
suite = "rust"
message = "\"AGENTD-5 a control request presenting another token is refused\" counterexample"
transform = { file = "crates/model/src/lib.rs", replace = "                Some(installed) if installed != token => Response::Unauthorized,\n", with = "                Some(installed) if installed != token => Response::Unavailable,\n" }

[[fault]]
id = "model-agentd-6-poll-refused"
guard = "tests::correct_deployment_satisfies_every_property"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "tests::correct_deployment_satisfies_every_property"]
expect = "test-failed"
suite = "rust"
message = "\"AGENTD-6 a control request presenting the installed token is accepted\" counterexample"
transform = { file = "crates/model/src/lib.rs", replace = "                        ControlOp::ExecPoll(_) => Response::Ok,\n", with = "                        ControlOp::ExecPoll(_) => Response::Unauthorized,\n" }
