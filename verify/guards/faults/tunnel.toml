# ── the verified tunnel's guards (#297) ──────────────────────────────────────

# The daemon dials the guest before the handshake decides, so a refused caller reaches it.
[[fault]]
id = "agentd-tunnel-dial-before-handshake"
guard = "a_refused_caller_never_causes_a_guest_connection"
run = ["cargo", "test", "-p", "agentd", "--test", "tunnel_relay", "--", "--exact", "a_refused_caller_never_causes_a_guest_connection"]
expect = "test-failed"
suite = "rust"
message = "a refused caller must never cause a connection to the guest service"
transform = { file = "crates/agentd/src/tunnel.rs", replace = "    let mut noise = match handshake::respond(socket, responder).await {", with = "    let _early = dial(port).await;\n    let mut noise = match handshake::respond(socket, responder).await {" }

# A VM with no seed relays the identity tunnel as a plain one instead of refusing it.
[[fault]]
id = "agentd-tunnel-seedless-downgrade"
guard = "identity_against_a_seedless_vm_is_refused_not_downgraded"
run = ["cargo", "test", "-p", "agentd", "--test", "tunnel_relay", "--", "--exact", "identity_against_a_seedless_vm_is_refused_not_downgraded"]
expect = "test-failed"
suite = "rust"
message = "the daemon refuses a seedless identity tunnel rather than relaying it"
transform = { file = "crates/agentd/src/tunnel.rs", replace = "    let Some(material) = material else {\n", with = "    let Some(material) = material else {\n        if port != 0 {\n            relay(socket, port).await;\n            return;\n        }\n" }

# The client reads its own failed check of the reply as a clean end instead of an error.
[[fault]]
id = "bind21-client-pin-failure-read-as-a-clean-end"
guard = "a_reply_that_does_not_verify_against_the_pin_fails_the_tunnel"
run = ["cargo", "test", "-p", "microvms-core", "--test", "tunnel_end_to_end", "--", "--exact", "a_reply_that_does_not_verify_against_the_pin_fails_the_tunnel"]
expect = "test-failed"
suite = "rust"
message = "a reply that doesn't verify must fail the tunnel, not end Closed"
transform = { file = "crates/microvms-edges/src/session/tunnel.rs", replace = "        Some(identity) => match initiate(&mut socket, identity, guest_port).await? {", with = "        Some(identity) => match initiate(&mut socket, identity, guest_port)\n            .await\n            .unwrap_or(Initiated::Refused(TunnelEnd::Closed))\n        {" }

# The client falls back to a plain relay when the reply doesn't verify.
[[fault]]
id = "bind21-client-pin-failure-downgrades"
guard = "a_reply_that_does_not_verify_against_the_pin_fails_the_tunnel"
run = ["cargo", "test", "-p", "microvms-core", "--test", "tunnel_end_to_end", "--", "--exact", "a_reply_that_does_not_verify_against_the_pin_fails_the_tunnel"]
expect = "test-failed"
suite = "rust"
message = "a reply that doesn't verify ends the tunnel rather than relaying"
transform = { file = "crates/microvms-edges/src/session/tunnel.rs", replace = "        Some(identity) => match initiate(&mut socket, identity, guest_port).await? {\n            Initiated::Transport(verified) => Some(verified),\n            Initiated::Refused(end) => return Ok(Opened::Refused(end)),\n        },", with = "        Some(identity) => match initiate(&mut socket, identity, guest_port).await {\n            Ok(Initiated::Transport(verified)) => Some(verified),\n            Ok(Initiated::Refused(end)) => return Ok(Opened::Refused(end)),\n            Err(_) => None,\n        }," }

# ── the verified tunnel's end of stream (#342) ──────────────────────────────────

# The daemon closes after the guest's EOF without its end of stream: the real client reads the
# clean download as cut short.
[[fault]]
id = "agentd-tunnel-no-end-of-stream"
guard = "bind_23_a_stream_the_guest_finishes_arrives_whole_and_ends_closed"
run = ["cargo", "test", "-p", "model-conformance", "--test", "tunnel_end_of_stream", "--", "--exact", "bind_23_a_stream_the_guest_finishes_arrives_whole_and_ends_closed"]
expect = "test-failed"
suite = "rust"
message = "the daemon's end of stream is the clean end"
transform = { file = "crates/agentd/src/tunnel.rs", replace = "            if channel.send_end().await {\n                channel.close(close::NORMAL, \"\").await;\n            }", with = "            channel.close(close::NORMAL, \"\").await;" }

# The same fault, caught by the daemon's own test of what it sends.
[[fault]]
id = "agentd19-no-end-of-stream-before-the-close"
guard = "agentd_19_a_guest_eof_reaches_the_caller_as_the_end_of_stream"
run = ["cargo", "test", "-p", "agentd", "--test", "tunnel_relay", "--", "--exact", "agentd_19_a_guest_eof_reaches_the_caller_as_the_end_of_stream"]
expect = "test-failed"
suite = "rust"
message = "the guest's EOF must arrive as the end of stream before the close frame"
transform = { file = "crates/agentd/src/tunnel.rs", replace = "            if channel.send_end().await {\n                channel.close(close::NORMAL, \"\").await;\n            }", with = "            channel.close(close::NORMAL, \"\").await;" }

# The daemon closes the guest connection on a caller end nothing proves, so the guest reads EOF.
[[fault]]
id = "agentd20-unproven-caller-end-closes-the-guest"
guard = "agentd_20_a_close_without_the_callers_end_of_stream_resets_the_guest"
run = ["cargo", "test", "-p", "agentd", "--test", "tunnel_relay", "--", "--exact", "agentd_20_a_close_without_the_callers_end_of_stream_resets_the_guest"]
expect = "test-failed"
suite = "rust"
message = "a caller's close without its end of stream must reach the guest as a reset, not an EOF"
transform = { file = "crates/agentd/src/tunnel.rs", replace = "    if cut_short {\n        reset(guest_read, guest_write, port);\n    }", with = "    let _ = (cut_short, port);" }

# The same fault, with the real client's end of stream withheld on the path.
[[fault]]
id = "agentd20-withheld-client-end-closes-the-guest"
guard = "agentd_20_the_clients_end_of_stream_withheld_resets_the_guest"
run = ["cargo", "test", "-p", "model-conformance", "--test", "tunnel_end_of_stream", "--", "--exact", "agentd_20_the_clients_end_of_stream_withheld_resets_the_guest"]
expect = "test-failed"
suite = "rust"
message = "an upload whose end of stream never arrived must reach the guest as a reset"
transform = { file = "crates/agentd/src/tunnel.rs", replace = "    if cut_short {\n        reset(guest_read, guest_write, port);\n    }", with = "    let _ = (cut_short, port);" }

# The daemon holds a caller from before the end of stream to one, and resets its every upload.
[[fault]]
id = "agentd-tunnel-older-caller-held-to-an-end"
guard = "a_caller_that_offers_no_end_of_stream_closes_the_guest_as_before"
run = ["cargo", "test", "-p", "agentd", "--test", "tunnel_relay", "--", "--exact", "a_caller_that_offers_no_end_of_stream_closes_the_guest_as_before"]
expect = "test-failed"
suite = "rust"
message = "an older caller's close is its end, as it always was"
transform = { file = "crates/agentd/src/tunnel.rs", replace = "let caller_proves_end = protocol::identity::offers_end_of_stream(&scratch[..offer]);", with = "let caller_proves_end = protocol::identity::offers_end_of_stream(&protocol::identity::HANDSHAKE_PAYLOAD);" }

# The client reads a verified tunnel's unproven end as a clean one, which is #342's defect: a
# close frame forged mid-stream through a real daemon reads as a finished download.
[[fault]]
id = "bind23-unproven-end-read-as-closed"
guard = "bind_23_a_close_frame_forged_mid_stream_ends_truncated"
run = ["cargo", "test", "-p", "model-conformance", "--test", "tunnel_end_of_stream", "--", "--exact", "bind_23_a_close_frame_forged_mid_stream_ends_truncated"]
expect = "test-failed"
suite = "rust"
message = "a stream cut short must not read as a clean end"
transform = { file = "crates/microvms-edges/src/session/tunnel.rs", replace = "Some(verified) if verified.daemon_proves_end => TunnelEnd::Truncated { code },", with = "Some(verified) if verified.daemon_proves_end => TunnelEnd::Closed," }

# The same fault, caught by the client crate's own test.
[[fault]]
id = "bind23-unproven-end-read-as-closed-edges"
guard = "bind_23_a_close_without_the_offered_end_of_stream_is_truncated"
run = ["cargo", "test", "-p", "microvms-edges", "--test", "tunnel_end_of_stream", "--", "--exact", "bind_23_a_close_without_the_offered_end_of_stream_is_truncated"]
expect = "test-failed"
suite = "rust"
message = "a close frame alone proves nothing"
transform = { file = "crates/microvms-edges/src/session/tunnel.rs", replace = "Some(verified) if verified.daemon_proves_end => TunnelEnd::Truncated { code },", with = "Some(verified) if verified.daemon_proves_end => TunnelEnd::Closed," }

# The client ignores the daemon's offer, so every daemon reads as one from before the end of
# stream and a cut stream ends unproven instead of truncated.
[[fault]]
id = "bind23-daemon-offer-ignored"
guard = "bind_23_a_close_without_the_offered_end_of_stream_is_truncated"
run = ["cargo", "test", "-p", "microvms-edges", "--test", "tunnel_end_of_stream", "--", "--exact", "bind_23_a_close_without_the_offered_end_of_stream_is_truncated"]
expect = "test-failed"
suite = "rust"
message = "left: ClosedUnproven"
transform = { file = "crates/microvms-edges/src/session/tunnel.rs", replace = "let daemon_proves_end = protocol::identity::offers_end_of_stream(&scratch[..offer]);", with = "let daemon_proves_end = protocol::identity::offers_end_of_stream(&scratch[..0]);" }

# The client holds a daemon from before the end of stream to one, failing every tunnel into an
# older image.
[[fault]]
id = "bind23-older-daemon-held-to-an-end"
guard = "bind_23_a_daemon_that_offers_no_end_of_stream_ends_closed_unproven"
run = ["cargo", "test", "-p", "microvms-edges", "--test", "tunnel_end_of_stream", "--", "--exact", "bind_23_a_daemon_that_offers_no_end_of_stream_ends_closed_unproven"]
expect = "test-failed"
suite = "rust"
message = "left: Truncated"
transform = { file = "crates/microvms-edges/src/session/tunnel.rs", replace = "let daemon_proves_end = protocol::identity::offers_end_of_stream(&scratch[..offer]);", with = "let daemon_proves_end = protocol::identity::offers_end_of_stream(&protocol::identity::HANDSHAKE_PAYLOAD);" }

# The client ends the tunnel without its own end of stream, so the daemon resets the guest's
# connection on a finished upload.
[[fault]]
id = "bind23-client-sends-no-end-of-stream"
guard = "the_local_eof_sends_the_end_of_stream_before_the_close"
run = ["cargo", "test", "-p", "microvms-edges", "--test", "tunnel_end_of_stream", "--", "--exact", "the_local_eof_sends_the_end_of_stream_before_the_close"]
expect = "test-failed"
suite = "rust"
message = "the end of stream came before the close"
transform = { file = "crates/microvms-edges/src/session/tunnel.rs", replace = "    if let Ok(Some(end)) = seal(noise, &[], scratch) {\n        let _ = socket.send(Message::Binary(end.into())).await;\n    }\n", with = "    let _ = (&noise, &scratch);\n" }

# ── the tunnel model's defenses, each switched off in the model (#297) ─────────────

# The daemon's pin accepts any caller key: the token holder completes a handshake. Under KK no
# one-sided change in the daemon does this, so the model is where the pin's fault can be seeded.
[[fault]]
id = "model-tunnel-daemon-pin-off"
guard = "tunnel::tests::agentd_17_a_token_holder_without_the_host_key_is_refused_before_any_dial"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "tunnel::tests::agentd_17_a_token_holder_without_the_host_key_is_refused_before_any_dial"]
expect = "test-failed"
suite = "rust"
message = "breaks \"AGENTD-17"
transform = { file = "crates/model/src/tunnel.rs", replace = "to == VmKey::Pinned && (from == HostKey::Launcher || variant == Variant::DaemonPinOff)", with = "to == VmKey::Pinned && (from == HostKey::Launcher || variant != Variant::DaemonPinOff)" }

# The client's pin accepts a reply from any key: an impostor reads the upload.
[[fault]]
id = "model-tunnel-client-pin-off"
guard = "tunnel::tests::bind_21_an_impostor_far_end_gets_no_local_byte_and_writes_none"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "tunnel::tests::bind_21_an_impostor_far_end_gets_no_local_byte_and_writes_none"]
expect = "test-failed"
suite = "rust"
message = "breaks \"BIND-21"
transform = { file = "crates/model/src/tunnel.rs", replace = "if from == VmKey::Pinned || variant == Variant::ClientPinOff {", with = "if from == VmKey::Pinned || variant != Variant::ClientPinOff {" }

# A frame opens at any later position: a dropped frame goes unnoticed.
[[fault]]
id = "model-tunnel-frames-open-past-their-position"
guard = "tunnel::tests::the_specified_tunnel_holds_every_property_against_a_path_attacker"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "tunnel::tests::the_specified_tunnel_holds_every_property_against_a_path_attacker"]
expect = "test-failed"
suite = "rust"
message = "breaks \"BIND-24"
transform = { file = "crates/model/src/tunnel.rs", replace = "&& (seq == client.next_in || variant == Variant::NoNonce);", with = "&& (seq >= client.next_in || variant == Variant::NoNonce);" }

# The client reads a close without the daemon's end of stream as a clean end, as before #342.
[[fault]]
id = "model-tunnel-unproven-close-read-as-clean"
guard = "tunnel::tests::the_specified_tunnel_holds_every_property_against_a_path_attacker"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "tunnel::tests::the_specified_tunnel_holds_every_property_against_a_path_attacker"]
expect = "test-failed"
suite = "rust"
message = "breaks \"BIND-23"
transform = { file = "crates/model/src/tunnel.rs", replace = "} else if client.far_offered {\n            End::Truncated", with = "} else if client.far_offered {\n            End::Closed" }

# The daemon closes the guest's connection on a caller end nothing proves, as before #342.
[[fault]]
id = "model-tunnel-cut-upload-closes-the-guest"
guard = "tunnel::tests::the_specified_tunnel_holds_every_property_against_a_path_attacker"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "tunnel::tests::the_specified_tunnel_holds_every_property_against_a_path_attacker"]
expect = "test-failed"
suite = "rust"
message = "breaks \"AGENTD-20"
transform = { file = "crates/model/src/tunnel.rs", replace = "        {\n            GuestRead::Reset\n        } else {", with = "        {\n            GuestRead::Eof\n        } else {" }

# ── frames that don't authenticate at their position (#297) ──────────────────

# The daemon skips a frame that doesn't authenticate instead of ending the tunnel.
[[fault]]
id = "agentd21-bad-frame-skipped"
guard = "agentd_21_a_replayed_frame_ends_the_tunnel_unrelayed"
run = ["cargo", "test", "-p", "agentd", "--test", "tunnel_relay", "--", "--exact", "agentd_21_a_replayed_frame_ends_the_tunnel_unrelayed"]
expect = "test-failed"
suite = "rust"
message = "the daemon ends the guest connection"
transform = { file = "crates/agentd/src/tunnel.rs", replace = "                Err(error) => {\n                    Inbound::Failed(format!(\"a tunnel frame did not authenticate: {error}\"))\n                }", with = "                Err(_) => Inbound::Bytes(Vec::new())," }

# The client skips a frame that doesn't authenticate instead of failing the tunnel.
[[fault]]
id = "bind24-bad-frame-skipped"
guard = "bind_24_a_replayed_frame_fails_the_tunnel_unwritten"
run = ["cargo", "test", "-p", "microvms-edges", "--test", "tunnel_end_of_stream", "--", "--exact", "bind_24_a_replayed_frame_fails_the_tunnel_unwritten"]
expect = "test-failed"
suite = "rust"
message = "the relay ends the local connection"
transform = { file = "crates/microvms-edges/src/session/tunnel.rs", replace = "                            })?;\n                            // The daemon's end of stream", with = "                            }).unwrap_or(usize::MAX);\n                            if count == usize::MAX {\n                                continue;\n                            }\n                            // The daemon's end of stream" }
