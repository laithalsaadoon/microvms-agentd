# ── the live suite's own helpers (#277), against a stub CLI ──────────────────

[[family]]
guard = "conformance/run_rs.py --self-test: conformance/selftest/suite.py"
run = ["uv", "run", "--script", "conformance/run_rs.py", "--self-test"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "conformance-eq-refuses-none"
message = "FAIL  eq() fails when either side is None"
transform = { file = "conformance/harness/results.py", replace = "        if actual is None or expected is None:\n", with = "        if False:\n" }

[[family.fault]]
id = "conformance-eq-positive-controls"
message = "FAIL  eq() still compares empty strings"
transform = { file = "conformance/harness/results.py", replace = "        if actual is None or expected is None:\n", with = "        if not actual or not expected:\n" }

[[family.fault]]
id = "conformance-absent"
message = "FAIL  absent() fails on any value that isn't None"
transform = { file = "conformance/harness/results.py", replace = "return self.check(name, value is None, f\"expected nothing, got {value!r}\")", with = "return self.check(name, True, f\"expected nothing, got {value!r}\")" }

[[family.fault]]
id = "conformance-bind19-record"
message = "FAIL  the digest record check refuses a proof absent from both sides"
transform = { file = "conformance/lanes/quickstart.py", replace = "        and record.get(\"verification\") is not None\n", with = "" }
