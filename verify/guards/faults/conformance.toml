# ── the live suite's own helpers (#277), against a stub CLI ──────────────────

[[family]]
guard = "conformance/run_rs.py --self-test: conformance/selftest/suite.py"
run = ["uv", "run", "--script", "conformance/run_rs.py", "--self-test"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "conformance-eq-refuses-none"
message = "FAIL  eq() fails when either side is None"
transform = { file = "conformance/harness/results.py", replace = "        if actual is None or expected is None:\n", with = "        if False:\n" }

[[family.fault]]
id = "conformance-eq-positive-controls"
message = "FAIL  eq() still compares empty strings"
transform = { file = "conformance/harness/results.py", replace = "        if actual is None or expected is None:\n", with = "        if not actual or not expected:\n" }

[[family.fault]]
id = "conformance-absent"
message = "FAIL  absent() fails on any value that isn't None"
transform = { file = "conformance/harness/results.py", replace = "return self.check(name, value is None, f\"expected nothing, got {value!r}\")", with = "return self.check(name, True, f\"expected nothing, got {value!r}\")" }

[[family.fault]]
id = "conformance-bind19-record"
message = "FAIL  the digest record check refuses a proof absent from both sides"
transform = { file = "conformance/lanes/quickstart.py", replace = "        and record.get(\"verification\") is not None\n", with = "" }


[[family.fault]]
id = "conformance-log-resource-scope"
message = "FAIL  execution role rejects regional groups"
transform = { file = "conformance/lanes/posture.py", replace = "bool(actions) and not outside_namespace and not attached,", with = "bool(actions) and not attached," }

[[family.fault]]
id = "conformance-log-explicit-resources"
message = "FAIL  execution role rejects NotResource"
transform = { file = "conformance/lanes/posture.py", replace = 'if not resources or "NotResource" in statement:', with = "if not resources:" }

[[family.fault]]
id = "conformance-log-inline-pages"
message = "FAIL  execution role checks every inline-policy page"
transform = { file = "conformance/lanes/posture.py", replace = 'for page in iam.get_paginator("list_role_policies").paginate(RoleName=role_name):', with = 'for page in list(iam.get_paginator("list_role_policies").paginate(RoleName=role_name))[:1]:' }

[[family.fault]]
id = "conformance-log-attached-pages"
message = "FAIL  execution role checks every attached-policy page"
transform = { file = "conformance/lanes/posture.py", replace = "for page in iam.get_paginator(\"list_attached_role_policies\").paginate(\n            RoleName=role_name\n        )", with = "for page in list(iam.get_paginator(\"list_attached_role_policies\").paginate(\n            RoleName=role_name\n        ))[:1]" }

[[family.fault]]
id = "conformance-log-empty-policy"
message = "FAIL  execution role requires grants"
transform = { file = "conformance/lanes/posture.py", replace = "bool(actions) and not outside_namespace and not attached,", with = "not outside_namespace and not attached," }
