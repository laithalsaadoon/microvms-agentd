# A skip that doesn't name its issue or trace id fails the reader, in every runner.

[[family]]
guard = "core_answers_the_shared_case_corpus"
run = ["cargo", "test", "-p", "microvms-core", "--test", "parity_cases", "--", "--exact", "core_answers_the_shared_case_corpus"]
expect = "test-failed"
suite = "rust"

[[family.fault]]
id = "parity-core-skip-without-reference"
message = "image-name/ensure-image-name: skip.py ends by naming its issue or trace id"
transform = { file = "verify/parity/cases/image-name/ensure-image-name.json", replace = "so no offline call answers it (IMAGE-12)\",\n", with = "so no offline call answers it\",\n" }

# A known_drift marker, which every runner refuses now that parity-drift is enforced (#258).
[[family.fault]]
id = "parity-core-refuses-known-drift"
message = "size-class/cpu-only: a known_drift marker is refused"
transform = { file = "verify/parity/cases/size-class/cpu-only.json", replace = "  \"capability\": \"size-from-request\",\n", with = "  \"capability\": \"size-from-request\",\n  \"known_drift\": { \"py\": { \"issue\": \"#255\", \"keys\": [\"baseline_mib\"] } },\n" }

# The `names` area (#338): a record from another region and a torn one, refused before any door.
# The first breaks core's region rule, which core and the CLI's fakes tier each fail on (the
# binding entries are in the bindings section); the second reads a torn file as a free name, and
# the refusal stops naming the file to inspect.

[[family.fault]]
id = "parity-core-names-region"
message = "the fake has no answer queued for GetMicrovm"
transform = { file = "crates/microvms-domain/src/names.rs", replace = "        && expected.as_str() != record.region\n", with = "        && expected.as_str() != record.region\n        && false\n" }

[[fault]]
id = "parity-cli-names-region"
guard = "guards::parity::the_cli_answers_the_shared_case_corpus_against_its_fakes"
run = ["cargo", "test", "-p", "microvms-cli", "--bin", "microvm", "--", "--exact", "guards::parity::the_cli_answers_the_shared_case_corpus_against_its_fakes"]
expect = "test-failed"
suite = "rust"
message = "names/region-mismatch: cli answered"
