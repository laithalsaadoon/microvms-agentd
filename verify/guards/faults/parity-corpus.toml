# ── the shared case corpus (#272): each runner's floor, strictness and one real regression ──
#
# Every Rust runner is one test that plans, answers and judges the whole corpus, so each entry
# names the reason it has to fail by. The floor entries hand a runner an empty corpus directory
# or a loader that drops what it parses: a path mistake has to fail, not pass over nothing. The
# three Rust runners share `parity_corpus/mod.rs`, so its loader is seeded once, under core.

[[fault]]
id = "parity-core-empty-corpus"
guard = "core_answers_the_shared_case_corpus"
run = ["cargo", "test", "-p", "microvms-core", "--test", "parity_cases", "--", "--exact", "core_answers_the_shared_case_corpus"]
expect = "test-failed"
suite = "rust"
message = "no case ran in area \"image-name\" on core"
transform = { file = "crates/microvms-core/tests/parity_corpus/mod.rs", replace = "pub fn cases_dir() -> PathBuf {\n    repo_root().join(\"verify\").join(\"parity\").join(\"cases\")\n}\n", with = "pub fn cases_dir() -> PathBuf {\n    let empty = std::env::temp_dir().join(format!(\"parity-empty-{}\", std::process::id()));\n    std::fs::create_dir_all(&empty).expect(\"an empty corpus directory\");\n    empty\n}\n" }

[[fault]]
id = "parity-cli-fakes-empty-corpus"
guard = "guards::parity::the_cli_answers_the_shared_case_corpus_against_its_fakes"
run = ["cargo", "test", "-p", "microvms-cli", "--bin", "microvm", "--", "--exact", "guards::parity::the_cli_answers_the_shared_case_corpus_against_its_fakes"]
expect = "test-failed"
suite = "rust"
message = "no case ran in area \"image-name\" on cli"
transform = { file = "crates/microvms-core/tests/parity_corpus/mod.rs", replace = "pub fn cases_dir() -> PathBuf {\n    repo_root().join(\"verify\").join(\"parity\").join(\"cases\")\n}\n", with = "pub fn cases_dir() -> PathBuf {\n    let empty = std::env::temp_dir().join(format!(\"parity-empty-{}\", std::process::id()));\n    std::fs::create_dir_all(&empty).expect(\"an empty corpus directory\");\n    empty\n}\n" }

[[fault]]
id = "parity-cli-process-empty-corpus"
guard = "the_cli_process_answers_the_shared_case_corpus"
run = ["cargo", "test", "-p", "microvms-cli", "--test", "parity_cases", "--", "--exact", "the_cli_process_answers_the_shared_case_corpus"]
expect = "test-failed"
suite = "rust"
message = "no case ran in area \"cost\" on cli"
transform = { file = "crates/microvms-core/tests/parity_corpus/mod.rs", replace = "pub fn cases_dir() -> PathBuf {\n    repo_root().join(\"verify\").join(\"parity\").join(\"cases\")\n}\n", with = "pub fn cases_dir() -> PathBuf {\n    let empty = std::env::temp_dir().join(format!(\"parity-empty-{}\", std::process::id()));\n    std::fs::create_dir_all(&empty).expect(\"an empty corpus directory\");\n    empty\n}\n" }

[[family]]
guard = "core_answers_the_shared_case_corpus"
run = ["cargo", "test", "-p", "microvms-core", "--test", "parity_cases", "--", "--exact", "core_answers_the_shared_case_corpus"]
expect = "test-failed"
suite = "rust"

[[family.fault]]
id = "parity-core-loader-returns-nothing"
message = "the sentinel wrap-dockerfile/sentinel.json wasn't loaded"
transform = { file = "crates/microvms-core/tests/parity_corpus/mod.rs", replace = "                        Ok(case) => cases.push(case),\n", with = "                        Ok(_) => {}\n" }

[[family.fault]]
id = "parity-core-no-handler"
message = "the core runner has no handler for area \"size-class\""
transform = { file = "crates/microvms-core/tests/parity_cases.rs", replace = "const AREAS: [&str; 7] = [\n    \"image-name\",\n    \"cost\",\n    \"error\",\n    \"egress\",\n    \"names\",\n    \"size-class\",\n    \"wrap-dockerfile\",\n];\n", with = "const AREAS: [&str; 6] = [\n    \"image-name\",\n    \"cost\",\n    \"error\",\n    \"egress\",\n    \"names\",\n    \"wrap-dockerfile\",\n];\n" }

# The issue's regression: `wrap_dockerfile` stops ending the task's last line before the stanza.
# Core, Python and TypeScript each fail the case (the binding entries are in the bindings section).

[[family.fault]]
id = "parity-core-wrap-newline"
message = "pip install pytestCOPY agentd"
transform = { file = "crates/microvms-app/src/control/artifact.rs", replace = "    wrapped.push_str(task);\n    if !task.ends_with('\\n') {\n        wrapped.push('\\n');\n    }\n", with = "    wrapped.push_str(task);\n" }

# The CLI's two tiers read one split of the areas. Each break moves `egress`: handed to the
# fakes tier, which has no handler for it; dropped from both lists; or listed in both.

[[fault]]
id = "parity-cli-area-handed-over"
guard = "guards::parity::the_cli_answers_the_shared_case_corpus_against_its_fakes"
run = ["cargo", "test", "-p", "microvms-cli", "--bin", "microvm", "--", "--exact", "guards::parity::the_cli_answers_the_shared_case_corpus_against_its_fakes"]
expect = "test-failed"
suite = "rust"
message = "gives the fakes tier area \"egress\", which it has no handler for"
transform = { file = "crates/microvms-core/tests/parity_corpus/mod.rs", replace = "pub const CLI_PROCESS_AREAS: [&str; 3] = [\"cost\", \"egress\", \"wrap-dockerfile\"];\npub const CLI_FAKE_AREAS: [&str; 3] = [\"image-name\", \"error\", \"names\"];\n", with = "pub const CLI_PROCESS_AREAS: [&str; 2] = [\"cost\", \"wrap-dockerfile\"];\npub const CLI_FAKE_AREAS: [&str; 4] = [\"image-name\", \"error\", \"names\", \"egress\"];\n" }

[[family]]
guard = "the_cli_process_answers_the_shared_case_corpus"
run = ["cargo", "test", "-p", "microvms-cli", "--test", "parity_cases", "--", "--exact", "the_cli_process_answers_the_shared_case_corpus"]
expect = "test-failed"
suite = "rust"

