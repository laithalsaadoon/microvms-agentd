# ── the published crates' API against their last release on crates.io (#298) ──

# `Phase::as_str` loses its `const`: nothing in the workspace calls it in a const context, so
# every build and test here still passes, and a user of the last release who does stops
# compiling. Only the comparison with that release sees it.
[[family]]
guard = "cargo semver-checks -p microvms-protocol --release-type minor"
run = ["cargo", "semver-checks", "-p", "microvms-protocol", "--release-type", "minor"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "semver-protocol-const-removed"
message = "Phase::as_str"
transform = { file = "crates/protocol/src/exec.rs", replace = "keeps this one equal to serde's.\n    pub const fn as_str(self) -> &'static str {", with = "keeps this one equal to serde's.\n    pub fn as_str(self) -> &'static str {" }
