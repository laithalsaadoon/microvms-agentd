# The model's AGENTD-22 property: an all-digit default with a row resolved as a request's digits
# are, a bare uid in the daemon's group.
[[fault]]
id = "model-exec-start-numeric-default-as-request"
guard = "exec_start::tests::the_specified_daemon_satisfies_every_property"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "exec_start::tests::the_specified_daemon_satisfies_every_property"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/model/src/exec_start.rs", replace = "            DefaultUser::NameKnown | DefaultUser::DigitsWithRow => Some(UserReq::NameKnown),\n", with = "            DefaultUser::NameKnown => Some(UserReq::NameKnown),\n            DefaultUser::DigitsWithRow => Some(UserReq::IdWithRow),\n" }

# An empty or non-UTF-8 value read as unset, which would run every workload as root.
[[fault]]
id = "default-user-empty-read-as-unset"
guard = "config::tests::the_default_user_is_kept_as_set"
run = ["cargo", "test", "-p", "agentd", "--lib", "--", "--exact", "config::tests::the_default_user_is_kept_as_set"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/agentd/src/config.rs", replace = "    raw.map(|raw| raw.to_string_lossy().into_owned())\n", with = "    raw.and_then(|raw| raw.into_string().ok())\n        .filter(|raw| !raw.is_empty())\n" }

# `from_env` that never reads the variable, the mutant `replace Config::from_env -> Self with
# Default::default()` stands for: only the child copy of the test binary sees the variable set.
[[fault]]
id = "default-user-env-unread"
guard = "config::tests::from_env_reads_the_default_user_from_the_environment"
run = ["cargo", "test", "-p", "agentd", "--lib", "--", "--exact", "config::tests::from_env_reads_the_default_user_from_the_environment"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/agentd/src/config.rs", replace = "            std::env::var_os(DEFAULT_USER_VAR),\n", with = "            None,\n" }

# A workload hook handler demoted to the image's default user (uid 65534 in the test).
[[fault]]
id = "default-user-hook-handler-demoted"
guard = "hook_handlers::tests::a_handler_runs_as_the_daemon_whatever_default_user_the_image_sets"
run = ["cargo", "test", "-p", "agentd", "--lib", "--", "--exact", "hook_handlers::tests::a_handler_runs_as_the_daemon_whatever_default_user_the_image_sets"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/agentd/src/hook_handlers.rs", replace = "        .process_group(0)\n        .kill_on_drop(true);\n", with = "        .process_group(0)\n        .uid(65534)\n        .kill_on_drop(true);\n" }

# The model's AGENTD-22 property: a specification that runs a nameless request as the daemon
