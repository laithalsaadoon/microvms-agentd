# ── default-user: AGENTD_DEFAULT_USER, the image's default user for a start that omits `user` (#595) ──

# The daemon's tests call what the change adds (`Guest::default_user`, `Config::default_user`),
# so the merge base doesn't build them and FAIL_TO_PASS can't prove them. Each fault here takes
# one part of the change out where the tests still compile.

# AGENTD-22: the default read and never applied.
[[fault]]
id = "default-user-ignored"
guard = "exec_start::tests::a_request_that_names_no_user_resolves_the_default_as_its_user"
run = ["cargo", "test", "-p", "agentd", "--lib", "--", "--exact", "exec_start::tests::a_request_that_names_no_user_resolves_the_default_as_its_user"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/agentd/src/exec_start.rs", replace = "    match (&request.user, default_user) {\n", with = "    let default_user: Option<&str> = default_user.and(None);\n    match (&request.user, default_user) {\n" }

[[fault]]
id = "default-user-ignored-fuzz"
guard = "exec_start_fuzz::start_resolution"
run = ["cargo", "test", "-p", "agentd", "--lib", "--", "--exact", "exec_start_fuzz::start_resolution"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/agentd/src/exec_start.rs", replace = "    match (&request.user, default_user) {\n", with = "    let default_user: Option<&str> = default_user.and(None);\n    match (&request.user, default_user) {\n" }

# AGENTD-22 through the handler: the default dropped where the start builds its `Guest`, and
# the passwd file left unread for a start that omits `user`.
[[family]]
guard = "exec::tests::a_start_that_names_no_user_runs_as_the_default_resolved_per_request"
run = ["cargo", "test", "-p", "agentd", "--lib", "--", "--exact", "exec::tests::a_start_that_names_no_user_runs_as_the_default_resolved_per_request"]
expect = "test-failed"
suite = "rust"

[[family.fault]]
id = "default-user-dropped-at-build"
transform = { file = "crates/agentd/src/exec.rs", replace = "            default_user,\n            is_executable: &is_executable_file,\n", with = "            default_user: None,\n            is_executable: &is_executable_file,\n" }

[[family.fault]]
id = "default-user-passwd-unread"
transform = { file = "crates/agentd/src/exec.rs", replace = "    let passwd = if req.user.is_some() || default_user.is_some() {\n", with = "    let passwd = if req.user.is_some() {\n" }

# AGENTD-23: the default applied ahead of a user the request names.
[[fault]]
id = "default-user-overrides-request"
guard = "exec_start::tests::a_user_the_request_names_wins_over_the_default"
run = ["cargo", "test", "-p", "agentd", "--lib", "--", "--exact", "exec_start::tests::a_user_the_request_names_wins_over_the_default"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/agentd/src/exec_start.rs", replace = "        (Some(spec), _) => resolve_user(spec, rows).map(Some),\n", with = "        (Some(_), Some(name)) => resolve_user(&NameOrId::Name(name.to_string()), rows).map(Some),\n        (Some(spec), _) => resolve_user(spec, rows).map(Some),\n" }

[[fault]]
id = "default-user-overrides-request-handler"
guard = "exec::tests::a_user_the_start_names_wins_over_the_default"
run = ["cargo", "test", "-p", "agentd", "--lib", "--", "--exact", "exec::tests::a_user_the_start_names_wins_over_the_default"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/agentd/src/exec_start.rs", replace = "        (Some(spec), _) => resolve_user(spec, rows).map(Some),\n", with = "        (Some(_), Some(name)) => resolve_user(&NameOrId::Name(name.to_string()), rows).map(Some),\n        (Some(spec), _) => resolve_user(spec, rows).map(Some),\n" }

# AGENTD-24: a default the guest doesn't have falls back to the daemon's user, which is root.
[[fault]]
id = "default-user-unknown-runs-as-daemon"
guard = "exec_start::tests::a_default_that_names_nobody_is_refused_naming_the_variable"
run = ["cargo", "test", "-p", "agentd", "--lib", "--", "--exact", "exec_start::tests::a_default_that_names_nobody_is_refused_naming_the_variable"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/agentd/src/exec_start.rs", replace = "            .map(Some)\n            .map_err(|_| {\n", with = "            .map(Some)\n            .or(Ok::<_, Rejection>(None))\n            .map_err(|_| {\n" }

# An empty or non-UTF-8 value read as unset, which would run every workload as root.
[[fault]]
id = "default-user-empty-read-as-unset"
guard = "config::tests::the_default_user_is_kept_as_set"
run = ["cargo", "test", "-p", "agentd", "--lib", "--", "--exact", "config::tests::the_default_user_is_kept_as_set"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/agentd/src/config.rs", replace = "    raw.map(|raw| raw.to_string_lossy().into_owned())\n", with = "    raw.and_then(|raw| raw.into_string().ok())\n        .filter(|raw| !raw.is_empty())\n" }

# `from_env` that never reads the variable, the mutant `replace Config::from_env -> Self with
# Default::default()` stands for: only the child copy of the test binary sees the variable set.
[[fault]]
id = "default-user-env-unread"
guard = "config::tests::from_env_reads_the_default_user_from_the_environment"
run = ["cargo", "test", "-p", "agentd", "--lib", "--", "--exact", "config::tests::from_env_reads_the_default_user_from_the_environment"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/agentd/src/config.rs", replace = "        cfg.default_user = default_user(std::env::var_os(DEFAULT_USER_VAR));\n", with = "" }

# A workload hook handler demoted to the image's default user (uid 65534 in the test).
[[fault]]
id = "default-user-hook-handler-demoted"
guard = "hook_handlers::tests::a_handler_runs_as_the_daemon_whatever_default_user_the_image_sets"
run = ["cargo", "test", "-p", "agentd", "--lib", "--", "--exact", "hook_handlers::tests::a_handler_runs_as_the_daemon_whatever_default_user_the_image_sets"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/agentd/src/hook_handlers.rs", replace = "        .process_group(0)\n        .kill_on_drop(true);\n", with = "        .process_group(0)\n        .uid(65534)\n        .kill_on_drop(true);\n" }

# The model's AGENTD-22 property: a specification that runs a nameless request as the daemon
# under any default.
[[fault]]
id = "model-exec-start-default-ignored"
guard = "exec_start::tests::the_specified_daemon_satisfies_every_property"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "exec_start::tests::the_specified_daemon_satisfies_every_property"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/model/src/exec_start.rs", replace = "        (UserReq::Absent, Some(default), _) => (Account::Default, default),\n", with = "        (UserReq::Absent, Some(_), _) => (Account::Daemon, UserReq::Absent),\n" }

