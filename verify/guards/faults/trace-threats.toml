# ── trace:check's threat table (#297) ────────────────────────────────────────

# A row's key that neither spec defines.
[[fault]]
id = "trace-threat-unknown-key"
guard = "tools/check-trace.py --check"
run = ["./tools/check-trace.py", "--check"]
expect = "exit-nonzero"
suite = "script"
message = "AGENTD-99 is not defined in either spec"
transform = { file = "docs/TRUST.md", replace = "| `AGENTD-17` |", with = "| `AGENTD-99` |" }

# A guard naming a test the file doesn't have (a rename the table didn't follow).
[[fault]]
id = "trace-threat-missing-guard"
guard = "tools/check-trace.py --check"
run = ["./tools/check-trace.py", "--check"]
expect = "exit-nonzero"
suite = "script"
message = "isn't a test that runs in crates/agentd/tests/tunnel_relay.rs"
transform = { file = "docs/TRUST.md", replace = "::a_valid_token_with_the_wrong_host_key_is_refused`", with = "::a_valid_token_with_a_wrong_host_key_is_refused`" }

# A guard that runs but no longer names its row's key.
[[fault]]
id = "trace-threat-unnamed-guard"
guard = "tools/check-trace.py --check"
run = ["./tools/check-trace.py", "--check"]
expect = "exit-nonzero"
suite = "script"
message = "doesn't name AGENTD-17"
transform = { file = "crates/agentd/tests/tunnel_relay.rs", replace = "is refused with 4403** (AGENTD-17).", with = "is refused with 4403**." }

[[fault]]
id = "trace-threat-gap-issue"
guard = "tools/check-trace.py --check"
run = ["./tools/check-trace.py", "--check"]
expect = "exit-nonzero"
suite = "script"
message = "a known gap names the issue that closes it"
transform = { file = "docs/TRUST.md", replace = "frames_open_in_order_and_the_daemons_end_only_after_every_chunk` | guarded |", with = "frames_open_in_order_and_the_daemons_end_only_after_every_chunk` | known gap: a harness finds nothing |" }

# The floor on empty input: a blank line after the header leaves a table with no rows.
[[fault]]
id = "trace-threat-empty-table"
guard = "tools/check-trace.py --check"
run = ["./tools/check-trace.py", "--check"]
expect = "exit-nonzero"
suite = "script"
message = "the threat table in docs/TRUST.md parses to no rows"
transform = { file = "docs/TRUST.md", replace = "|---|---|---|---|\n| An in-VM process", with = "|---|---|---|---|\n\n| An in-VM process" }

# The floor with a parser that returns nothing.
[[fault]]
id = "trace-threat-floor"
guard = "tools/check-trace.py --check"
run = ["./tools/check-trace.py", "--check"]
expect = "exit-nonzero"
suite = "script"
message = "the threat table in docs/TRUST.md parses to no rows"
transform = { file = "tools/check-trace.py", replace = "        if not line.startswith(\"|\"):\n", with = "        if not line.startswith(\"||\"):\n" }

# The sentinel: a parser that keeps only the first row passes the floor.
[[fault]]
id = "trace-threat-sentinel"
guard = "tools/check-trace.py --check"
run = ["./tools/check-trace.py", "--check"]
expect = "exit-nonzero"
suite = "script"
message = "the sentinel row naming BIND-18 is not in the threat table"
transform = { file = "tools/check-trace.py", replace = "    for number, line in body:\n", with = "    for number, line in body[:1]:\n" }

# A doc credited to the last test in the file instead of the one it sits on.
[[fault]]
id = "trace-threat-unit-neighbor"
guard = "test_check_trace.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_trace.py", "-k", "ThreatTable"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_key_on_a_neighboring_test_does_not_name_the_guard ("
transform = { file = "tools/check-trace.py", replace = "named[path][following[0]]", with = "named[path][following[-1]]" }

# A missing docs/TRUST.md read as an empty table with nothing to say.
[[fault]]
id = "trace-threat-unit-missing-file"
guard = "test_check_trace.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_trace.py", "-k", "ThreatTable"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_missing_trust_file_is_reported ("
transform = { file = "tools/check-trace.py", replace = "    except FileNotFoundError:\n        return [], [f\"{where} doesn't exist\"]\n", with = "    except FileNotFoundError:\n        return [], []\n" }

# #297a review round 1: a table with no delimiter row used to lose its first row unread, and a
# blank line inside the table every row after it.
[[fault]]
id = "trace-threat-no-delimiter"
guard = "tools/check-trace.py --check"
run = ["./tools/check-trace.py", "--check"]
expect = "exit-nonzero"
suite = "script"
message = "the line after the threat table's header isn't its delimiter row"
transform = { file = "docs/TRUST.md", replace = "| Threat | Requirement | Guard | Status |\n|---|---|---|---|\n", with = "| Threat | Requirement | Guard | Status |\n" }

[[fault]]
id = "trace-threat-row-past-a-break"
guard = "tools/check-trace.py --check"
run = ["./tools/check-trace.py", "--check"]
expect = "exit-nonzero"
suite = "script"
message = "this row is past a break in the threat table"
transform = { file = "docs/TRUST.md", replace = "\n| An on-path party ends", with = "\n\n| An on-path party ends" }

# A guard whose file no `mod` reaches never compiles, and its row used to pass as guarded.
[[fault]]
id = "trace-threat-guard-unreached"
guard = "tools/check-trace.py --check"
run = ["./tools/check-trace.py", "--check"]
expect = "exit-nonzero"
suite = "script"
message = "which no `mod` declaration reaches from its crate"
transform = { file = "crates/microvms-app/src/session/mod.rs", replace = "#[cfg(test)]\nmod sse_fuzz;\n", with = "" }

# The module rule counting a declaration a feature `cfg` could leave out everywhere.
[[fault]]
id = "trace-threat-unit-gated-mod"
guard = "test_check_trace.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_trace.py", "-k", "ThreatTable"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_guard_no_mod_declaration_reaches_is_reported ("
transform = { file = "tools/check-trace.py", replace = "                    {\"has\": {\"field\": \"body\", \"kind\": \"declaration_list\"}},\n                    *_OFF,\n", with = "                    {\"has\": {\"field\": \"body\", \"kind\": \"declaration_list\"}},\n" }
