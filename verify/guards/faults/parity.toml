# ── parity: the capability table's gate (#271) ──────────────────────────────

# The issue's three deliberate breaks: a stub method gone (rule (b)), a sentinel's cell gone
# (rule (c)), and the Griffe step pointed at an empty stub (the sentinels).
[[family]]
guard = "tools/check-parity.py"
run = ["./tools/check-parity.py"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "parity-stub-file-exists"
message = "file-exists: py: Session.file_exists isn't on the surface"
transform = { file = "bindings/microvms-py/microvms.pyi", replace = "    def file_exists(self, /, path: str) -> bool:\n        \"\"\"\n        Whether a path exists, distinguishing absence from every other refusal.\n        \"\"\"\n", with = "" }

[[family.fault]]
id = "parity-health-ts-cell"
message = "health: ts: no cell; name the surface or exempt it"
transform = { file = "verify/parity/capabilities.toml", replace = "py = [\"Session.health\", \"Session.health_async\"]\nts = \"Session.health\"\n", with = "py = [\"Session.health\", \"Session.health_async\"]\n" }

[[family.fault]]
id = "parity-empty-pyi"
message = "sentinel launch: py: Sandbox.run isn't on the surface"
argv_fault = ["--pyi", "verify/parity/fixtures/empty.pyi"]

# Every other input empty, and each reader returning nothing from a real input.
[[family.fault]]
id = "parity-empty-dts"
message = "sentinel launch: ts: Sandbox.run isn't on the surface"
argv_fault = ["--dts", "verify/parity/fixtures/empty.d.ts"]

[[family.fault]]
id = "parity-empty-manifest"
message = "sentinel launch: cli: run isn't on the surface"
argv_fault = ["--manifest", "verify/parity/fixtures/empty.json"]

[[family.fault]]
id = "parity-empty-core-api"
message = "sentinel launch: core: microvms_core::sandbox::Sandbox::run isn't on the surface"
argv_fault = ["--core-api", "verify/parity/fixtures/empty.json"]

[[family.fault]]
id = "parity-empty-table"
message = "table: no [[capability]] rows"
argv_fault = ["--table", "verify/parity/fixtures/empty.toml"]

[[family.fault]]
id = "parity-py-reader-empty"
message = "sentinel run-report: py: run_report isn't on the surface"
transform = { file = "tools/check-parity.py", replace = "        if dunder(name):\n", with = "        if name:\n" }

# A TypeDoc whose JSON moved its members under another key reads as an empty project.
[[family.fault]]
id = "parity-ts-reader-empty"
message = "sentinel run-report: ts: runReport isn't on the surface"
transform = { file = "tools/check-parity.py", replace = "    read_ts_children(project.get(\"children\") or [], \"\", surface)\n", with = "    read_ts_children(project.get(\"members\") or [], \"\", surface)\n" }

[[family.fault]]
id = "parity-typedoc-pin"
message = "here and 0.28.21 in site/package.json"
transform = { file = "site/package.json", replace = "    \"typedoc\": \"0.28.20\",\n", with = "    \"typedoc\": \"0.28.21\",\n" }

# Rule (a) and the type pairing over the real surfaces: a row pointed away from the method it
# mapped, and an exempt member deleted.
[[family.fault]]
id = "parity-row-unmapped"
message = "py: RateTable.age_days belongs to no row"
transform = { file = "verify/parity/capabilities.toml", replace = "py = \"RateTable.age_days\"\n", with = "py = \"RateTable.staleness\"\n" }

[[family.fault]]
id = "parity-exempt-member-deleted"
message = "type Sandbox: ts: suspendedWindowSecondsAsync has no Python twin and no exemption"
transform = { file = "verify/parity/capabilities.toml", replace = "exempt_members.ts = { suspendedWindowSecondsAsync = \"an async method, because napi can't await in a getter\" }\n", with = "" }

# A Python awaitable twin pairs with its blocking spelling's TypeScript twin (#544); without
# the suffix rule every twin on a `[[type]]` reads as unpaired.
[[family.fault]]
id = "parity-async-twin-unpaired"
message = "type Sandbox: py: run_async has no TypeScript twin and no exemption"
transform = { file = "tools/check-parity.py", replace = "        name = name.removesuffix(\"_async\")\n", with = "        pass\n" }

# The self-test's named cases, each against the code that makes it pass.
[[family]]
guard = "test_check_parity.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_parity.py"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "parity-test-unmapped-function"
message = "FAIL: test_an_unmapped_python_function_fails ("
transform = { file = "tools/check-parity.py", replace = "        for name in sorted(surface.functions - covered):\n", with = "        for name in sorted(surface.functions & covered):\n" }

[[family.fault]]
id = "parity-test-missing-name"
message = "FAIL: test_a_row_naming_a_typescript_method_that_does_not_exist_fails ("
transform = { file = "tools/check-parity.py", replace = "return None if name in surface.names else f\"{name} isn't on the surface\"", with = "return None" }

[[family.fault]]
id = "parity-test-missing-cell"
message = "FAIL: test_a_missing_cli_cell_with_no_exemption_fails ("
transform = { file = "tools/check-parity.py", replace = "                problems.append(f\"{where}: no cell; name the surface or exempt it\")\n", with = "" }

[[family.fault]]
id = "parity-test-empty-reason"
message = "FAIL: test_an_exemption_with_an_empty_reason_fails ("
transform = { file = "tools/check-parity.py", replace = "    if not isinstance(reason, str) or not reason.strip():\n", with = "    if not isinstance(reason, str):\n" }

[[family.fault]]
id = "parity-test-issue-form"
message = "FAIL: test_an_issue_that_is_not_a_number_fails ("
transform = { file = "tools/check-parity.py", replace = "ISSUE = re.compile(r\"#[1-9][0-9]*\")", with = "ISSUE = re.compile(r\".+\")" }

[[family.fault]]
id = "parity-test-empty-sentinel"
message = "FAIL: test_an_empty_griffe_dump_fails_on_the_sentinels ("
transform = { file = "tools/check-parity.py", replace = "                        f\"sentinel {row_id}: {key}: {why}\"\n", with = "                        f\"{row_id}: {key}: {why}\"\n" }

# A surface that can't be read is reported and skipped, and the others are still checked: each
# part of that, reverted, fails its test.

[[family.fault]]
id = "parity-test-async-twin-pairing"
message = "FAIL: test_an_awaitable_twin_pairs_with_its_blocking_spellings_typescript_twin ("
transform = { file = "tools/check-parity.py", replace = "        name = name.removesuffix(\"_async\")\n", with = "        pass\n" }

[[family]]
guard = "test_check_parity.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "tools", "-p", "test_check_parity.py", "-k", "RuleTests"]
expect = "exit-nonzero"
suite = "script"

[[family.fault]]
id = "parity-refused-surface-ends-the-check"
message = "FAIL: test_an_unreadable_surface_is_reported_first_and_the_rest_still_checked ("
transform = { file = "tools/check-parity.py", replace = "    problems = pin_problems() + check(table, surfaces, frozenset(refused))\n", with = "    problems = [] if refused else pin_problems() + check(table, surfaces)\n" }

[[family.fault]]
id = "parity-unread-surface-resolved"
message = "FAIL: test_an_unread_surface_draws_nothing_and_the_others_are_still_held ("
transform = { file = "tools/check-parity.py", replace = "                if key in unread or (key in empty and not sentinel):\n", with = "                if key in empty and not sentinel:\n" }
