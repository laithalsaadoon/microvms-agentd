# ── the cost report's defaults and JSON shape, in core (#255) ─────────────────
# Whether a plan launched, the default labels and the report's JSON used to be restated by the
# CLI and both bindings, and had drifted. Core owns each now; these break core's copy, and the
# binding entries in bindings.toml put a binding's old default back.

[[fault]]
id = "domain-infer-launched-zero-image"
guard = "cost::tests::a_launch_is_inferred_from_running_time_or_a_real_image_only"
run = ["cargo", "test", "-p", "microvms-domain", "--lib", "--", "--exact", "cost::tests::a_launch_is_inferred_from_running_time_or_a_real_image_only"]
expect = "test-failed"
suite = "rust"
message = "image_gb: Some(0.0)"
note = "crates/microvms-domain/src/cost.rs::a_launch_is_inferred_from_running_time_or_a_real_image_only"
transform = { file = "crates/microvms-domain/src/cost.rs", replace = "    image_gb.is_some_and(|gb| gb != 0.0)\n", with = "    image_gb.is_some()\n" }

[[fault]]
id = "domain-report-json-usd-null"
guard = "cost::tests::an_unpriced_line_omits_the_usd_key_rather_than_reporting_zero"
run = ["cargo", "test", "-p", "microvms-domain", "--lib", "--", "--exact", "cost::tests::an_unpriced_line_omits_the_usd_key_rather_than_reporting_zero"]
expect = "test-failed"
suite = "rust"
message = "a null would be summed as zero"
note = "crates/microvms-domain/src/cost.rs::an_unpriced_line_omits_the_usd_key_rather_than_reporting_zero"
transform = { file = "crates/microvms-domain/src/cost.rs", replace = "                \"kind\": \"unpriced\",\n                \"reason\": reason,\n", with = "                \"kind\": \"unpriced\",\n                \"usd\": null,\n                \"reason\": reason,\n" }

[[fault]]
id = "domain-report-json-seconds-string"
guard = "cost::tests::every_dollar_is_a_string_and_every_seconds_figure_is_a_number"
run = ["cargo", "test", "-p", "microvms-domain", "--lib", "--", "--exact", "cost::tests::every_dollar_is_a_string_and_every_seconds_figure_is_a_number"]
expect = "test-failed"
suite = "rust"
message = "a number, matching cli.py:743"
note = "crates/microvms-domain/src/cost.rs::every_dollar_is_a_string_and_every_seconds_figure_is_a_number"
transform = { file = "crates/microvms-domain/src/cost.rs", replace = "                \"seconds\": duration.seconds_f64(),\n", with = "                \"seconds\": duration.seconds_f64().to_string(),\n" }

[[fault]]
id = "domain-report-json-headroom"
guard = "cost::tests::the_report_json_carries_the_pythons_key_set"
run = ["cargo", "test", "-p", "microvms-domain", "--lib", "--", "--exact", "cost::tests::the_report_json_carries_the_pythons_key_set"]
expect = "test-failed"
suite = "rust"
message = "\"headroomMib\""
note = "crates/microvms-domain/src/cost.rs::the_report_json_carries_the_pythons_key_set"
transform = { file = "crates/microvms-domain/src/cost.rs", replace = "                \"headroomMib\": size.headroom_mib(),\n", with = "" }

# `run`'s envelope carries its report in core's shape; CI's mutants job found `attach_cost`
# replaced by `()` passing every test.

[[fault]]
id = "cli-run-drops-its-cost"
guard = "guards::run::a_finished_run_reports_its_cost_in_cores_shape"
run = ["cargo", "test", "-p", "microvms-cli", "--bin", "microvm", "--", "--exact", "guards::run::a_finished_run_reports_its_cost_in_cores_shape"]
expect = "test-failed"
suite = "rust"
message = "null"
note = "crates/microvms-cli/src/guards/run.rs::a_finished_run_reports_its_cost_in_cores_shape"
transform = { file = "crates/microvms-cli/src/commands/lifecycle.rs", replace = "    outcome.cost = Some(report.to_json());\n", with = "    let _ = report.to_json();\n" }


# The budget gate is core's (#270): a breach aborts only under the caller's `abort`, and a
# floor at the ceiling is within it. Each entry breaks one, on core's `BudgetVerdict`.

[[fault]]
id = "domain-budget-abort-ignores-the-judgement"
guard = "cost::tests::a_budget_verdict_follows_the_judgement_and_the_total_it_was_given"
run = ["cargo", "test", "-p", "microvms-domain", "--lib", "--", "--exact", "cost::tests::a_budget_verdict_follows_the_judgement_and_the_total_it_was_given"]
expect = "test-failed"
suite = "rust"
message = "aborts:"
note = "crates/microvms-domain/src/cost.rs::a_budget_verdict_follows_the_judgement_and_the_total_it_was_given"
transform = { file = "crates/microvms-domain/src/cost.rs", replace = "        self.breached() && self.budget.on_breach == OnBreach::Abort\n", with = "        self.breached()\n" }

[[fault]]
id = "domain-budget-at-the-ceiling-breaches"
guard = "cost::tests::a_budget_verdict_follows_the_judgement_and_the_total_it_was_given"
run = ["cargo", "test", "-p", "microvms-domain", "--lib", "--", "--exact", "cost::tests::a_budget_verdict_follows_the_judgement_and_the_total_it_was_given"]
expect = "test-failed"
suite = "rust"
message = "breached:"
note = "crates/microvms-domain/src/cost.rs::a_budget_verdict_follows_the_judgement_and_the_total_it_was_given"
transform = { file = "crates/microvms-domain/src/cost.rs", replace = "        self.floor > self.budget.max\n", with = "        self.floor >= self.budget.max\n" }
