# This compatibility test keeps active reuse across the token lifetime while idle
# connections have a deadline. An absolute connection lifetime must still fail it.
[[fault]]
id = "active-connection-has-an-absolute-lifetime"
guard = "a_connection_survives_past_the_proxy_token_lifetime"
run = ["cargo", "test", "-p", "agentd", "--test", "turmoil_transport", "--", "--exact", "a_connection_survives_past_the_proxy_token_lifetime"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/agentd/src/serve.rs", replace = "                    tokio::select! {\n                        result = &mut connection => {", with = "                    tokio::select! {\n                        _ = tokio::time::sleep(Duration::from_secs(60 * 60)) => {},\n                        result = &mut connection => {" }

