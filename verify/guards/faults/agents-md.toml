# #251: the named terminate's fallback runs on a leaked envelope and on an error envelope,
# and only then.

[[fault]]
id = "conformance-terminate-fallback-leaked"
guard = "conformance/run_rs.py --self-test: conformance/selftest/names.py"
run = ["uv", "run", "--script", "conformance/run_rs.py", "--self-test"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL  a named terminate that leaked the VM falls back to a terminate by id in its region"
transform = { file = "conformance/lanes/names.py", replace = "        and not gone.data.get(\"leaked\")\n    )\n    results.check(by_name, reached, detail)\n", with = "    )\n    results.check(by_name, reached, detail)\n" }

[[fault]]
id = "conformance-terminate-fallback-error"
guard = "conformance/run_rs.py --self-test: conformance/selftest/names.py"
run = ["uv", "run", "--script", "conformance/run_rs.py", "--self-test"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL  a named terminate refused with an error envelope falls back the same way"
# The wrong exception class: `EnvelopeError` is a malformed stdout, not an error envelope, and
# the lane imports it for the fault, since only the fault names it there.
transform = [
  { file = "conformance/lanes/names.py", replace = "from harness.envelope import Envelope, KindError\n", with = "from harness.envelope import Envelope, EnvelopeError, KindError\n" },
  { file = "conformance/lanes/names.py", replace = "    except KindError as exc:\n        detail = (\n            f\"environment={elsewhere} kind=", with = "    except EnvelopeError as exc:\n        detail = (\n            f\"environment={elsewhere} kind=" },
]

[[fault]]
id = "conformance-terminate-fallback-reached"
guard = "conformance/run_rs.py --self-test: conformance/selftest/names.py"
run = ["uv", "run", "--script", "conformance/run_rs.py", "--self-test"]
expect = "exit-nonzero"
