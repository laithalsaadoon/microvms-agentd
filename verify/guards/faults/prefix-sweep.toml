[[family.fault]]
id = "sweep-report-dry-run"
message = "FAIL  prefix sweep dry-run rejects missing imagesDeleted"
transform = { file = "conformance/lanes/prefix_sweep.py", replace = "dry.get(\"imagesDeleted\") == []", with = "dry.get(\"imagesDeleted\", []) == []" }

