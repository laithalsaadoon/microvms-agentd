# Prefix cleanup and listing metadata regression proofs.

[[fault]]
id = "sweep-keep-list"
guard = "control::sweep::tests::dry_run_protects_keep_names_and_arns_and_filters_substrings"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "control::sweep::tests::dry_run_protects_keep_names_and_arns_and_filters_substrings"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-app/src/control/sweep.rs", replace = "if options.keep.contains(&image.name) || options.keep.contains(&image.image_arn) {", with = "if false {" }

[[fault]]
id = "sweep-prefix-boundary"
guard = "control::sweep::tests::dry_run_protects_keep_names_and_arns_and_filters_substrings"
run = ["cargo", "test", "-p", "microvms-app", "--lib", "--", "--exact", "control::sweep::tests::dry_run_protects_keep_names_and_arns_and_filters_substrings"]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-app/src/control/sweep.rs", replace = "image.name.starts_with(prefix) && image.state != \"DELETED\"", with = "image.name.contains(prefix) && image.state != \"DELETED\"" }

