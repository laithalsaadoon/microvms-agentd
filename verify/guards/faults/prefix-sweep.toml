[[fault]]
id = "sweep-outside-control-cleanup"
guard = "conformance/run_rs.py --self-test: fresh outside control cleanup"
run = ["uv", "run", "--script", "conformance/run_rs.py", "--self-test"]
expect = "exit-nonzero"
