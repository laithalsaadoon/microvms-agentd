# Python wake lifetime: retain callback admission through wake and original-waker drop.
# The base lacks the new inline Rust tests; reversing the full source removes them.
# These focused faults preserve the tests. Parametrized Python guards name exact nodes,
# since the emitter cannot find its source-level selector in the pytest report.

[[fault]]
id = "py-wake-close-disabled"
guard = "bindings/microvms-py/tests/test_errors.py::test_finishing_an_await_drains_the_inflight_python_wake[cancel]"
run = [["uvx", "maturin@1.14.1", "develop", "-q", "-m", "bindings/microvms-py/Cargo.toml"], ["python", "-m", "pytest", "-q", "-rA", "bindings/microvms-py/tests/test_errors.py::test_finishing_an_await_drains_the_inflight_python_wake[cancel]"]]
expect = "test-failed"
suite = "bindings"
transform = { file = "bindings/microvms-py/src/runtime.rs", replace = "        if !self.quiescent.load(Ordering::Acquire) {", with = "        if false && !self.quiescent.load(Ordering::Acquire) {" }

