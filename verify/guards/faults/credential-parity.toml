[[fault]]
id = "credential-parity-py-provider-text"
guard = "bindings/microvms-py/tests/test_parity_cases.py::test_a_case[credential-error/provider-stderr]"
run = [
  ["cargo", "build", "-p", "microvms-core", "--example", "parity-tunnel-peer"],
  ["uvx", "maturin@1.14.1", "develop", "-q", "-m", "bindings/microvms-py/Cargo.toml", "--features", "parity-fixtures"],
  ["python", "-m", "pytest", "-q", "-rA", "bindings/microvms-py/tests/test_parity_cases.py::test_a_case[credential-error/provider-stderr]"],
]
expect = "test-failed"
suite = "bindings"
transform = { file = "crates/microvms-edges/src/control/credentials.rs", replace = 'Error::new(ErrorKind::Credentials, messages.join(": "))', with = 'Error::new(ErrorKind::Credentials, format!("{error:?}"))' }

[[fault]]
id = "credential-parity-ts-provider-text"
guard = "credential-error/provider-stderr"
run = [
  ["cargo", "build", "-p", "microvms-core", "--example", "parity-tunnel-peer"],
  ["npx", "-y", "-p", "@napi-rs/cli@3.10.8", "napi", "build", "--manifest-path", "Cargo.toml", "--package", "microvms-js", "--platform", "--output-dir", ".", "--cwd", "bindings/microvms-js", "--features", "parity-fixtures", "--dts", "parity-fixtures.d.ts"],
  ["node", "--test", "--test-reporter=tap", "--test-name-pattern=^credential\\-error/provider\\-stderr$", "bindings/microvms-js/__test__/parity_cases.mjs"],
]
expect = "test-failed"
suite = "bindings"
transform = { file = "crates/microvms-edges/src/control/credentials.rs", replace = 'Error::new(ErrorKind::Credentials, messages.join(": "))', with = 'Error::new(ErrorKind::Credentials, format!("{error:?}"))' }
