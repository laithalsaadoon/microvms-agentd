# The same production sanitizer fault must be caught by every actual surface.
# This reverses the sanitizer on the integrated source-exposing implementation;
# older versions can omit provider sources entirely and need not leak this marker.

[[fault]]
id = "credential-parity-core-provider-text"
guard = "core_answers_the_shared_case_corpus"
run = [
  ["cargo", "build", "-p", "microvms-core", "--example", "parity-tunnel-peer"],
  ["cargo", "test", "--config", "env.MICROVMS_PARITY_CASE.value=\"credential-error/provider-stderr\"", "--config", "env.MICROVMS_PARITY_CASE.force=true", "-p", "microvms-core", "--test", "parity_cases", "--", "--exact", "core_answers_the_shared_case_corpus"],
]
expect = "test-failed"
suite = "rust"
transform = { file = "crates/microvms-edges/src/control/credentials.rs", replace = 'Error::new(ErrorKind::Credentials, messages.join(": "))', with = 'Error::new(ErrorKind::Credentials, format!("{error:?}"))' }

[[fault]]
id = "credential-parity-cli-provider-text"
guard = "the_cli_process_answers_the_shared_case_corpus"
