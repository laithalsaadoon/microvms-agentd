# Each driving adapter's allowed direct dependencies, normal and build (#285), and those of the
# layers below them that have a set: the domain (#282), the app and core (#283). Dev dependencies
# are out of scope: they never ship.
#
# Every adapter name is a parsing, rendering, or host-bridge crate, or the one edge onto core.
# `crates/microvms-cli/tests/dependency_direction.rs` holds each crate here to exactly its set,
# its `drift` table and its placement decisions in `verify/ratchet/decisions.toml`: a direct
# dependency outside all three fails there, and so does a listed crate the crate no longer uses.
# A crate's drift is work it does that belongs below it, with the issue that moves it; the test
# is its one computation, and `mise run ratchet:check` holds it to the base branch, so it can only
# shrink. A set can shrink too, but the check refuses a crate added to a set the base branch
# already has, since that would clear a finding without a reason: move the work to the layer whose
# job it is, or record a decision with its reason. A new table is fine for a crate the base has no
# set for, once the test holds that crate: it refuses a table for any other.
#
# A layer's set is every crate it may use, and it never carries drift or a decision. The test
# asserts the domain's and the app's declared features too.
#
# - The domain's crates compute or encode: no network, files, subprocess, environment, clock, or
#   entropy (ARCH-6).
# - The app's add scheduling (tokio without `net`, `fs` or `process`, and backon's retry) to
#   that. None of them reaches the network, AWS, files, a subprocess, the wall clock, or the OS
#   random pool (ARCH-7).
# - Core's are the layers themselves, since it only composes them (ARCH-8).
#
# `microvms-edges` has no set: it's the one library crate where the I/O crates belong.

[microvms-cli]
normal = ["microvms-core", "clap", "ratatui", "serde", "serde_json", "tokio", "toml", "unicode-width"]

# Directory sync's hashing, globbing and archive crates, which #260 moves into core.
[microvms-cli.drift]
normal = ["const-hex", "globset", "sha2", "tar"]

[microvms-py]
normal = ["microvms-core", "microvms-protocol", "serde_json", "pyo3", "tokio"]

[microvms-js]
normal = ["microvms-core", "microvms-protocol", "napi", "napi-derive", "serde_json", "tokio"]
build = ["napi-build"]

[microvms-domain]
normal = ["microvms-protocol", "base64", "const-hex", "jiff", "rust_decimal", "rust_decimal_macros", "serde", "serde_json", "thiserror", "x25519-dalek"]

[microvms-app]
normal = ["microvms-domain", "microvms-protocol", "backon", "base64", "const-hex", "futures-util", "percent-encoding", "serde", "serde_json", "sha2", "tokio", "zip"]

[microvms-core]
normal = ["microvms-app", "microvms-domain", "microvms-edges", "microvms-protocol"]
