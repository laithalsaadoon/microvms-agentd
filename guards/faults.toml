run = ["cargo", "build", "-p", "microvms-js"]
expect = "compile-error"
suite = "rust"
code = "E0639"
message = "cannot create non-exhaustive struct using struct expression"
transform = { file = "microvms-js/src/session.rs", replace = "        let mut request =\n            protocol::exec::StartRequest::new(", with = "        let _literal = protocol::exec::StartRequest {\n            exec_id: String::new(),\n            command: Vec::new(),\n            shell: protocol::exec::Shell::Flag(false),\n            cwd: None,\n            env: Default::default(),\n            user: None,\n            group: None,\n            timeout_sec: None,\n            stdin: false,\n            reap_group_on_exit: false,\n            inherit_image_env: false,\n        };\n        let mut request =\n            protocol::exec::StartRequest::new(" }

