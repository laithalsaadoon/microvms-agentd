[[fault]]
id = "js-backpressure"
guard = "a stream survives more events than the channel can hold"
run = [
  ["npx", "-y", "-p", "@napi-rs/cli@3", "napi", "build", "--manifest-path", "Cargo.toml", "--package", "microvms-js", "--platform", "--output-dir", ".", "--cwd", "microvms-js"],
  ["node", "--test", "--test-reporter=tap", "microvms-js/__test__/exec.mjs"],
]
expect = "test-failed"
suite = "bindings"
note = "microvms-js/__test__/exec.mjs::a stream survives more events than the channel can hold"
transform = { file = "microvms-js/src/exec.rs", replace = "match sender.send(Ok(event)).await {", with = "match sender.try_send(Ok(event)) {" }
