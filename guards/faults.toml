# ── the bindings, rebuilt before each run (CI's bindings job) ────────────────

[[fault]]
id = "py-unpriced-usd"
guard = "microvms-py/tests/test_smoke.py::test_an_unpriced_line_omits_the_usd_key_entirely"
run = [
  ["uvx", "maturin@1.14", "develop", "-q", "-m", "microvms-py/Cargo.toml"],
  ["python", "-m", "pytest", "-q", "-rA", "microvms-py/tests/test_smoke.py::test_an_unpriced_line_omits_the_usd_key_entirely"],
]
expect = "test-failed"
suite = "bindings"
note = "microvms-py/tests/test_smoke.py::test_an_unpriced_line_omits_the_usd_key_entirely"
transform = { file = "microvms-py/src/cost.rs", replace = "        (None, Some(reason)) => amount.set_item(\"reason\", reason)?,\n", with = "        (None, Some(reason)) => {\n            amount.set_item(\"usd\", py.None())?;\n            amount.set_item(\"reason\", reason)?\n        }\n" }

