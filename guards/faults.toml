message = "ExecAck(0) }): answered 200 OK; the model's response is 409 Conflict"
transform = { file = "agentd/src/exec.rs", replace = "    if slot.is_none() {\n", with = "    if slot.is_none() && false {\n" }

# Collection takes an exited entry nobody acked. `exec::tests::collection_takes_acked_entries_only`
# catches it too.
[[fault]]
id = "model-conformance-collect-unacked-exited"
guard = "slice_0_of_the_walk_replays_against_the_daemon"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "slice_0_of_the_walk_replays_against_the_daemon"]
expect = "test-failed"
suite = "rust"
message = "collect_expired removed 1 entries; the model collects 0"
transform = { file = "agentd/src/exec.rs", replace = "            Some(at) => now.duration_since(at) < ttl,\n            None => true,\n", with = "            Some(at) => now.duration_since(at) < ttl,\n            None => entry.shared.terminal.try_lock().map_or(true, |terminal| terminal.is_none()),\n" }

# A retried start of an acked id spawns a second child, as if an acked id were free again. Only
# the replay catches this one: every other agentd test passes with it seeded. The phase gives it
# away (Running where the model has Acked) before the spawn count does.
[[fault]]
id = "model-conformance-restart-acked"
guard = "slice_0_of_the_walk_replays_against_the_daemon"
