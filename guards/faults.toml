# The seeded-fault registry (#274): each entry is a deliberate break and the guard that has to
# catch it. `mise run guards:list` (in `check`) holds every anchor and patch to the tree and
# every Falsification note to an entry or to guards/unregistered.txt; `mise run guards:fire`
# seeds each fault in a scratch worktree and requires its guard to fail for the named reason.
# The schema is in scripts/check-guards-fire.py's docstring.
#
# A new guard gets its entry in the PR that adds it, and `guards:fire -- --only <id>` must
# print `fired` for it. An entry goes when its guard is deleted on purpose, in the same PR.

