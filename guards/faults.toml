# ── model_conformance.rs: the bootstrap and exec model replayed against agentd (#296) ──

# The walk is replayed in slices, each a run of its shortest-first order, so the shortest path a
# daemon fault fails on is slice 0's, and each fault below that seeds the daemon names slice 0.
# The walk's floors, and the check that the slices replay it once, are
# `the_slices_replay_every_walked_path_once`.

# A step the per-state paths never take: every state a removing `Collect` reaches has a shorter
# path, so only the walk's untaken-step paths drive it.
[[fault]]
id = "model-conformance-collect-keeps-acked"
guard = "slice_0_of_the_walk_replays_against_the_daemon"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "slice_0_of_the_walk_replays_against_the_daemon"]
expect = "test-failed"
suite = "rust"
message = "collect_expired removed 0 entries; the model collects 1"
transform = { file = "agentd/src/exec.rs", replace = "            Some(at) => now.duration_since(at) < ttl,\n", with = "            Some(_) => true,\n" }

# The floor: a recorder that records nothing replays nothing and would pass.
[[fault]]
id = "model-conformance-empty-walk"
guard = "the_slices_replay_every_walked_path_once"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "the_slices_replay_every_walked_path_once"]
expect = "test-failed"
suite = "rust"
message = "the walk recorded no path, so nothing was replayed"
transform = { file = "agentd/tests/model_conformance.rs", replace = "accessor().into_iter().map(", with = "accessor().into_iter().filter(|_| false).map(" }

# Without the untaken-step paths the walk skips the removing `Collect`, and the coverage floor
# names it.
[[fault]]
id = "model-conformance-untaken-steps"
guard = "the_slices_replay_every_walked_path_once"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "the_slices_replay_every_walked_path_once"]
expect = "test-failed"
suite = "rust"
message = "the walk never takes [\"collect 200 removed\"]"
transform = { file = "agentd/tests/model_conformance.rs", replace = "    paths.extend(untaken);\n", with = "    drop(untaken);\n" }

# Acking a running exec succeeds and releases its output.
# `exec::tests::acking_a_running_exec_is_a_conflict_not_a_silent_success` catches it too; the
# replay reaches it on the shortest path that acks before the child exits.
[[fault]]
id = "model-conformance-ack-running"
guard = "slice_0_of_the_walk_replays_against_the_daemon"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "slice_0_of_the_walk_replays_against_the_daemon"]
