# The exclusion list (#275): `fuzz_extract` is compiled only with agentd's `fuzzing` feature, so
# no `cargo test` build can catch a mutant in it. Without its `exclude_re` entry, a change that
# touches the function fails the `mutants` job with both of its mutants missed. The command
# mutates a diff of that one function, built from the tree when it runs so it follows the
# function when fs.rs moves (a committed copy would pin its line numbers, and cargo-mutants
# refuses a diff whose lines don't match). Clean, the entry drops both mutants and the run
# passes with nothing to test; a renamed function fails the awk, and a pattern that stopped
# matching fails the clean run. `--in-place` mutates the scratch tree and builds in its target.
[[fault]]
id = "mutants-fuzz-extract-exclusion"
guard = "scripts/check-mutants.py"
run = ["bash", "-c", "set -eu; diff=$(mktemp); trap 'rm -f \"$diff\"' EXIT; awk '/^pub fn fuzz_extract\\(/ { s = NR } s && !e { body = body \"+\" $0 \"\\n\" } s && !e && /^}/ { e = NR } END { if (!e) { print \"no fn fuzz_extract in agentd/src/fs.rs\" > \"/dev/stderr\"; exit 1 } printf \"--- a/agentd/src/fs.rs\\n+++ b/agentd/src/fs.rs\\n@@ -%d,0 +%d,%d @@\\n%s\", s - 1, s, e - s + 1, body }' agentd/src/fs.rs > \"$diff\"; ./scripts/check-mutants.py --diff \"$diff\" -- --in-place"]
expect = "exit-nonzero"
suite = "script"
message = "MISSED"
transform = { file = ".cargo/mutants.toml", replace = "  '^agentd/src/fs\\.rs:\\d+:\\d+: replace fuzz_extract -> ',\n", with = "" }

