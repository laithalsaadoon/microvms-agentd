transform = { file = "microvms-py/src/cost.rs", replace = "        image_retained_seconds,\n        suspend_resume_cycles,\n", with = "        image_retained_seconds,\n        suspend_resume_cycles: suspend_resume_cycles.min(0),\n" }

[[fault]]
id = "parity-ts-suspended-dropped"
guard = "cost/estimate-running-and-suspended"
run = [
  ["npx", "-y", "-p", "@napi-rs/cli@3", "napi", "build", "--manifest-path", "Cargo.toml", "--package", "microvms-js", "--platform", "--output-dir", ".", "--cwd", "microvms-js"],
  ["node", "--test", "--test-reporter=tap", "microvms-js/__test__/parity_cases.mjs"],
]
expect = "test-failed"
suite = "bindings"
message = "cost/estimate-running-and-suspended: ts answered"
transform = { file = "microvms-js/src/cost.rs", replace = "        suspended_seconds: options.suspended_seconds.unwrap_or(0.0),\n", with = "        suspended_seconds: options.suspended_seconds.map_or(0.0, |_| 0.0),\n" }
