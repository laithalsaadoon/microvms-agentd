# Every Rust runner is one test that plans, answers and judges the whole corpus, so each entry
# names the reason it has to fail by. The floor entries hand a runner an empty corpus directory
# or a loader that drops what it parses: a path mistake has to fail, not pass over nothing. The
# three Rust runners share `parity_corpus/mod.rs`, so its loader is seeded once, under core.

