# A retried start of a running id spawns a second child and replaces the entry: the common
# retry, a client that timed out while its child is still up. Nothing the daemon answers
# changes, so only the spawn count shows it, and no other agentd test fails with it seeded
# (`exec::tests::a_retried_start_does_not_spawn_a_second_child` retries after the exit).
[[fault]]
id = "model-conformance-restart-running"
guard = "slice_0_of_the_walk_replays_against_the_daemon"
run = ["cargo", "test", "-p", "agentd", "--test", "model_conformance", "--", "--exact", "slice_0_of_the_walk_replays_against_the_daemon"]
expect = "test-failed"
suite = "rust"
note = "agentd/tests/model_conformance.rs::slice_0_of_the_walk_replays_against_the_daemon"
message = "spawned 2 children; the model spawned 1"
transform = { file = "agentd/src/exec.rs", replace = "    let already_present = state.with_execs(|execs| execs.contains_key(&req.exec_id));\n", with = "    let already_present = state.with_execs(|execs| execs.get(&req.exec_id).is_some_and(|entry| entry.acked_at.is_some() || entry.shared.terminal.try_lock().map_or(true, |terminal| terminal.is_some())));\n" }

