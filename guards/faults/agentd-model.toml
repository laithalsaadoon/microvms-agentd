# ── agentd-model: each spec function's note names the property test ──────────

[[fault]]
id = "model-image-force"
guard = "image::tests::the_specified_ensure_satisfies_every_property"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "image::tests::the_specified_ensure_satisfies_every_property"]
expect = "test-failed"
suite = "rust"
note = "model/src/image.rs::plan"
transform = { file = "model/src/image.rs", replace = "        (Platform::Ready, true) | (Platform::Failed, _) => Plan::Delete,\n", with = "        (Platform::Ready, true) => Plan::Reuse,\n        (Platform::Failed, _) => Plan::Delete,\n" }

[[fault]]
id = "model-provision-launder"
guard = "provision::tests::the_specified_policy_satisfies_every_property"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "provision::tests::the_specified_policy_satisfies_every_property"]
expect = "test-failed"
suite = "rust"
note = "model/src/provision.rs::verify"
transform = { file = "model/src/provision.rs", replace = "        Gh::Unattested => Verdict::Refused,\n", with = "        Gh::Unattested => verify(\n            Behavior::Specified,\n            Release {\n                gh: Gh::Unavailable,\n                ..release\n            },\n        ),\n" }

[[fault]]
id = "model-wrap-tail"
guard = "wrap::tests::the_specified_wrap_satisfies_every_property"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "wrap::tests::the_specified_wrap_satisfies_every_property"]
expect = "test-failed"
suite = "rust"
note = "model/src/wrap.rs::specified"
transform = { file = "model/src/wrap.rs", replace = "    if task.tail != Tail::Complete {\n        return Wrap::Refused(Refusal::Unfinished);\n    }\n", with = "" }

[[fault]]
id = "model-output-continue"
guard = "output::tests::the_specified_cli_satisfies_every_property"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "output::tests::the_specified_cli_satisfies_every_property"]
expect = "test-failed"
suite = "rust"
note = "model/src/output.rs::specified"
transform = { file = "model/src/output.rs", replace = "            stream_event: true,\n        } => Decision::StopStream,\n", with = "            stream_event: true,\n        } => Decision::Continue,\n" }

[[fault]]
id = "model-exec-start-layers"
guard = "exec_start::tests::the_specified_daemon_satisfies_every_property"
run = ["cargo", "test", "-p", "agentd-model", "--lib", "--", "--exact", "exec_start::tests::the_specified_daemon_satisfies_every_property"]
expect = "test-failed"
suite = "rust"
note = "model/src/exec_start.rs::specified"
transform = { file = "model/src/exec_start.rs", replace = "Layering::Specified => [image, identity, world.launch, request.env()],", with = "Layering::Specified => [image, world.launch, identity, request.env()]," }
