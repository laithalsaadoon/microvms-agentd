# The seam's `#[expect]` covers its two door calls, not the whole `impl`: an environment read or
# a transport call added to a seam method still fails lint.
[[fault]]
id = "clippy-cli-seam-env-read"
guard = "microvms-cli clippy.toml: std::env::var, inside AwsSeam's impl"
run = ["cargo", "clippy", "-p", "microvms-cli", "--all-targets", "--", "-D", "warnings"]
expect = "lint-error"
suite = "rust"
message = "use of a disallowed method `std::env::var`"
transform = { file = "microvms-cli/src/seam.rs", replace = "    fn control_plane(&self, region: Region) -> BoxFuture<'_, Result<ControlPlane, Error>> {\n        Box::pin(production_plane(region))", with = "    fn control_plane(&self, region: Region) -> BoxFuture<'_, Result<ControlPlane, Error>> {\n        let _ = std::env::var(\"AWS_PROFILE\");\n        Box::pin(production_plane(region))" }

