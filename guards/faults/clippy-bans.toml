# ── clippy bans (#282, #285) ─────────────────────────────────────────────────

[[fault]]
id = "clippy-domain-fs"
guard = "microvms-domain clippy.toml: std::fs::read"
run = ["cargo", "clippy", "-p", "microvms-domain", "--all-targets", "--", "-D", "warnings"]
expect = "lint-error"
suite = "rust"
message = "use of a disallowed method `std::fs::read`"
transform = { file = "microvms-domain/src/sizing.rs", replace = "    pub fn baseline_mib(self) -> u32 {\n", with = "    pub fn baseline_mib(self) -> u32 {\n        let _ = std::fs::read(\"x\");\n" }

[[fault]]
id = "clippy-js-subprocess"
