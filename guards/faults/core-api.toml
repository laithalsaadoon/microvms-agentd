# ── core-api: core's surface stitched across its crates (#271) ───────────────

# The snapshot's CI step: a re-export deleted from core is a diff naming the paths it took.
[[fault]]
id = "core-api-stale-reexport"
guard = "scripts/generate-core-api.py"
run = ["./scripts/generate-core-api.py", "--check"]
expect = "exit-nonzero"
suite = "script"
message = "-    \"microvms_core::BuildHookTimeout\": \"struct\","
transform = { file = "microvms-core/src/lib.rs", replace = "pub use hooks::{BuildHookTimeout, RunHookTimeout};\n", with = "" }

[[fault]]
id = "core-api-empty-input"
guard = "scripts/generate-core-api.py"
run = ["./scripts/generate-core-api.py", "--check"]
expect = "exit-nonzero"
suite = "script"
message = "microvms_core.json doesn't exist; the crate's rustdoc JSON wasn't built"
argv_fault = ["--doc-dir", "{empty_dir}"]

# A walk that returns nothing, and one that stops following re-exports into the crates below.
[[fault]]
id = "core-api-walk-empty"
guard = "scripts/generate-core-api.py"
run = ["./scripts/generate-core-api.py", "--check"]
expect = "exit-nonzero"
suite = "script"
message = "the walk of microvms_core found no public paths"
transform = { file = "scripts/rustdoc_walk.py", replace = "if child[\"visibility\"] != \"public\":", with = "if child[\"visibility\"] != \"crate\":" }

[[fault]]
id = "core-api-stitch-sentinel"
guard = "scripts/generate-core-api.py"
run = ["./scripts/generate-core-api.py", "--check"]
expect = "exit-nonzero"
suite = "script"
message = "these sentinels are missing or of another kind"
transform = { file = "scripts/rustdoc_walk.py", replace = "        other = self.doc(crate)\n", with = "        other = None\n" }

[[fault]]
id = "rustdoc-walk-cross-crate"
guard = "test_rustdoc_walk.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "scripts", "-p", "test_rustdoc_walk.py"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_reexport_from_another_crate_resolves_with_its_members ("
transform = { file = "scripts/rustdoc_walk.py", replace = "        other = self.doc(crate)\n", with = "        other = None\n" }

[[fault]]
id = "rustdoc-walk-extension"
guard = "test_rustdoc_walk.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "scripts", "-p", "test_rustdoc_walk.py"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_an_extension_trait_method_is_named_on_the_type_it_extends ("
transform = { file = "scripts/rustdoc_walk.py", replace = "    walk.attribute_extensions()\n", with = "" }

[[fault]]
id = "rustdoc-walk-glob-shadow"
guard = "test_rustdoc_walk.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "scripts", "-p", "test_rustdoc_walk.py"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_a_local_item_shadows_what_a_glob_brings_in ("
transform = { file = "scripts/rustdoc_walk.py", replace = "self.walk(glob_doc, glob, prefix, inherited)", with = "self.walk(glob_doc, glob, prefix)" }

[[fault]]
id = "rustdoc-walk-format-version"
guard = "test_rustdoc_walk.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "scripts", "-p", "test_rustdoc_walk.py"]
expect = "exit-nonzero"
suite = "script"
message = "FAIL: test_an_unknown_format_version_is_refused_naming_it ("
transform = { file = "scripts/rustdoc_walk.py", replace = "    if version not in ACCEPTED_FORMAT_VERSIONS:\n", with = "    if version is None:\n" }

# Without the refusal, an empty index fails later as a KeyError, which unittest reports as an
# error rather than a failure.
[[fault]]
id = "rustdoc-walk-empty-index"
guard = "test_rustdoc_walk.py"
run = ["uv", "run", "python", "-m", "unittest", "discover", "-s", "scripts", "-p", "test_rustdoc_walk.py"]
expect = "exit-nonzero"
suite = "script"
message = "ERROR: test_an_empty_index_is_refused ("
transform = { file = "scripts/rustdoc_walk.py", replace = "    if not index or str(doc.get(\"root\")) not in index:\n", with = "    if index is None:\n" }
